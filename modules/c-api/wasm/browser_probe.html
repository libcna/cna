<!doctype html>
<meta charset="utf-8">
<title>CNA C ABI browser probe</title>
<!-- An empty icon, so the browser does not request /favicon.ico. The 404 that produced was
     harmless, but a harmless 404 in the log is where a real missing asset hides. -->
<link rel="icon" href="data:,">
<body style="font:14px/1.5 monospace;padding:1rem">
<h1 style="font-size:1rem">CNA C ABI browser probe</h1>
<canvas id="canvas" width="160" height="96" style="width:160px;height:96px"></canvas>
<pre id="out">running…</pre>
<script type="module">
// plans/plan_cabi.md CABI-37; fixcnats.md Phase 7: "If toolchain exists, build a real artifact and
// create a tiny C-level browser probe before involving TypeScript."
//
// module_smoke.mjs proves the artifact loads and answers under node. It does not prove the same in
// a browser, where the module is fetched over HTTP, compiled by the browser's own WebAssembly
// pipeline and run under its memory model. This is the smallest page that does, and it stays at
// the C level on purpose -- no TypeScript, no binding layer.
//
// Reports in the same shape as every other CNA browser page, so
// scripts/run_browser_tests.mjs runs it unchanged.
const requestedFrames = Number(new URLSearchParams(location.search).get('frames') || 5);
const EXPECTED = 12;
let passed = 0;
const out = document.getElementById('out');
const canvas = document.getElementById('canvas');
const lines = [];
const runtimeErrors = [];
window.addEventListener('error', (event) => runtimeErrors.push(`error: ${event.message}`));
window.addEventListener('unhandledrejection', (event) => {
    const reason = event.reason;
    runtimeErrors.push(`unhandled rejection: ${reason?.message || reason}`);
});
const say = (t) => { lines.push(t); out.textContent = lines.join('\n'); console.log(t); };
const check = (name, ok, detail) => {
    if (ok) { passed += 1; say(`[ok] ${name}${detail ? ': ' + detail : ''}`); }
    else { say(`[FAIL] ${name}${detail ? ': ' + detail : ''}`); }
};

try {
    const createCnaCApi = (await import('./cna_c_api.mjs')).default;
    const cna = await createCnaCApi({ canvas });
    check('the ES module factory instantiates in a browser', true);

    // The route a consumer must call before trusting any other.
    const encoded = cna._cna_get_abi_version();
    const version = `${(encoded >>> 16) & 0xff}.${(encoded >>> 8) & 0xff}.${encoded & 0xff}`;
    check('cna_get_abi_version answers', encoded !== 0, version);

    // A route that writes through a pointer: proves the heap views and the C memory model agree,
    // which is the part most likely to differ between node and a browser.
    const sizeOut = cna._malloc(8);
    let bytes = 0;
    try {
        cna.HEAPU32[sizeOut >> 2] = 0;
        cna.HEAPU32[(sizeOut >> 2) + 1] = 0;
        const result = cna._cna_platform_get_current_name_size_ext(sizeOut);
        bytes = cna.HEAPU32[sizeOut >> 2];
        check('a pointer out-parameter is written', result === 0 && bytes > 0,
              `result=${result} bytes=${bytes}`);
    } finally { cna._free(sizeOut); }

    // UTF-8 exchange, which the artifact contract names explicitly. Two facts a consumer needs,
    // both measured rather than assumed: this module is linked with WASM_BIGINT, so a uint64_t
    // passed *by value* must arrive as a BigInt -- a plain number throws "Cannot convert 4 to a
    // BigInt" -- and the copied bytes carry no terminator, so UTF8ToString needs the length.
    const buffer = cna._malloc(bytes + 1);
    const copyOut = cna._malloc(8);
    try {
        const copied = cna._cna_platform_copy_current_name_ext(buffer, BigInt(bytes + 1), copyOut);
        const name = cna.UTF8ToString(buffer, bytes);
        check('UTF-8 is exchanged through the heap', copied === 0 && name === 'Web',
              `"${name}" (result=${copied})`);
    } finally { cna._free(buffer); cna._free(copyOut); }
    // CABI-41: a callback made in JavaScript, handed to the C ABI, and invoked by it. This ABI is
    // callback-driven, and until CABI-41 the module exported no addFunction, so a consumer could
    // not construct a function pointer at all -- 2,872 routes and no way to give any of them a
    // callback. Worth a check of its own rather than trusting the export list.
    let fired = 0;
    let sunkText = '';
    const sink = cna.addFunction((level, category, view) => {
        fired += 1;
        // CNA_StringView in wasm32: pointer at word 0, and byte_length is a uint64 that lands at
        // word 2 after the padding, not word 1.
        const pointer = cna.HEAPU32[view >> 2];
        const length = cna.HEAPU32[(view >> 2) + 2];
        try { sunkText = cna.UTF8ToString(pointer, length); } catch { /* reported by the check */ }
    }, 'viiii');
    try {
        const installed = cna._cna_logger_set_sink_ext(sink, 0);
        const message = 'browser probe';
        const buffer = cna._malloc(message.length + 1);
        const view = cna._malloc(16);
        try {
            cna.stringToUTF8(message, buffer, message.length + 1);
            cna.HEAPU32[view >> 2] = buffer;
            cna.HEAPU32[(view >> 2) + 1] = message.length;
            cna.HEAPU32[(view >> 2) + 2] = 0;
            cna._cna_logger_info(view, 0);
        } finally { cna._free(buffer); cna._free(view); }
        cna._cna_logger_reset_sink_ext();
        check('a JavaScript callback is invoked by the C ABI',
              installed === 0 && fired === 1 && sunkText.length > 0,
              `installed=${installed} fired=${fired} text=${JSON.stringify(sunkText)}`);
    } finally { cna.removeFunction(sink); }

    // The wasm32 offsets below are compile-time-pinned in module_entry.c. This is a real C-owned
    // Game, not a zero-argument wasm smoke: its callbacks receive uint64 handles as BigInt, issue a
    // GPU clear, and every frame reaches the renderer's present path.
    let updates = 0;
    let draws = 0;
    let clearFailures = 0;
    let callbackHandlesAreBigInt = true;
    const clearColor = cna._malloc(4);
    cna.HEAPU8.set([24, 48, 96, 255], clearColor);
    const update = cna.addFunction((game, gameTime, context, outError) => {
        void gameTime; void context; void outError;
        callbackHandlesAreBigInt &&= typeof game === 'bigint';
        updates += 1;
        return 0;
    }, 'ijiii');
    const draw = cna.addFunction((game, gameTime, context, outError) => {
        void gameTime; void context; void outError;
        callbackHandlesAreBigInt &&= typeof game === 'bigint';
        draws += 1;
        // Struct-by-value C arguments are wasm-lowered to a pointer; this is the real CNA clear,
        // not a direct JavaScript WebGL call.
        if (cna._cna_game_clear(game, clearColor) !== 0) clearFailures += 1;
        return 0;
    }, 'ijiii');
    const callbacks = cna._malloc(32);
    const createInfo = cna._malloc(48);
    const gameOut = cna._malloc(8);
    let game = 0n;
    try {
        cna.HEAPU8.fill(0, callbacks, callbacks + 32);
        cna.HEAPU32[callbacks >> 2] = 32;
        cna.HEAPU32[(callbacks >> 2) + 1] = 1;
        cna.HEAPU32[(callbacks >> 2) + 3] = update;
        cna.HEAPU32[(callbacks >> 2) + 4] = draw;

        cna.HEAPU8.fill(0, createInfo, createInfo + 48);
        cna.HEAPU32[createInfo >> 2] = 48;
        cna.HEAPU32[(createInfo >> 2) + 1] = 1;
        // Variable timing gives one Update for each externally requested frame.
        cna.HEAPU8[createInfo + 8] = 0;
        cna.setValue(createInfo + 16, 166667n, 'i64');
        // Empty CNA_StringView at byte 24; callback pointer at byte 40.
        cna.HEAPU32[(createInfo + 40) >> 2] = callbacks;
        cna.setValue(gameOut, 0n, 'i64');

        const createResult = cna._cna_game_create(createInfo, gameOut);
        game = cna.getValue(gameOut, 'i64');
        check('a C-owned Game is created through the wasm ABI',
              createResult === 0 && game !== 0n,
              `result=${createResult} handle=${game}`);

        const frameResults = [];
        if (createResult === 0) {
            for (let frame = 0; frame < requestedFrames; frame += 1) {
                await new Promise((resolve) => requestAnimationFrame(resolve));
                try {
                    frameResults.push(cna._cna_game_run_one_frame(game));
                } catch (error) {
                    say(`[trace] frame=${frame} updates=${updates} draws=${draws} ` +
                        `clearFailures=${clearFailures}`);
                    throw error;
                }
            }
            // Let a queued browser error/rejection become observable before evaluating the run.
            await new Promise((resolve) => setTimeout(resolve, 0));
        }

        const rendererOut = cna._malloc(4);
        let rendererResult = -1;
        let rendererType = 0;
        try {
            rendererResult = cna._cna_graphics_renderer_get_current_type(rendererOut);
            rendererType = cna.HEAPU32[rendererOut >> 2];
        } finally { cna._free(rendererOut); }
        const expectedWebglVersion = rendererType === 5 ? 1 : (rendererType === 6 ? 2 : 0);
        const gl = expectedWebglVersion === 1
            ? canvas.getContext('webgl')
            : canvas.getContext('webgl2');
        check('the renderer obtains its required WebGL context version',
              rendererResult === 0 && expectedWebglVersion !== 0 && gl !== null &&
                  (expectedWebglVersion === 1
                      ? !(gl instanceof WebGL2RenderingContext)
                      : gl instanceof WebGL2RenderingContext),
              gl ? `renderer=${rendererType} ${gl.getParameter(gl.VERSION)}`
                 : `renderer=${rendererType} no WebGL ${expectedWebglVersion} context`);
        check('every externally requested frame completes exactly once',
              frameResults.length === requestedFrames && frameResults.every((value) => value === 0) &&
                  updates === requestedFrames && draws === requestedFrames && clearFailures === 0,
              `requested=${requestedFrames} results=${frameResults.length} updates=${updates} ` +
                  `draws=${draws} clearFailures=${clearFailures}`);
        check('game callbacks preserve uint64 handles as JavaScript BigInt',
              callbackHandlesAreBigInt && updates > 0 && draws > 0,
              `updates=${updates} draws=${draws}`);
        check('frame driving reports no page errors or unhandled rejections',
              runtimeErrors.length === 0, runtimeErrors.join('; '));

        const destroyResult = game !== 0n ? cna._cna_game_destroy(game) : -1;
        if (destroyResult === 0) game = 0n;
        check('the C-owned Game tears down cleanly', destroyResult === 0,
              `result=${destroyResult}`);
    } finally {
        if (game !== 0n) cna._cna_game_destroy(game);
        cna._free(gameOut);
        cna._free(createInfo);
        cna._free(callbacks);
        cna._free(clearColor);
        cna.removeFunction(draw);
        cna.removeFunction(update);
    }

    // BINDFIX-052: a caller-created GraphicsDevice made and destroyed while a Game is alive is a
    // second SDL window on this page. Its teardown removed the drop directory both windows share,
    // so the Game's own teardown threw ENOENT out of cna_game_destroy instead of returning.
    const standalone = {};
    const loadContent = cna.addFunction((game, gameTime, context, outError) => {
        void game; void gameTime; void context; void outError;
        const parameters = cna._malloc(44);
        const deviceOut = cna._malloc(8);
        try {
            cna.HEAPU8.fill(0, parameters, parameters + 44);
            cna.HEAPU32[parameters >> 2] = 44;
            cna.HEAPU32[(parameters >> 2) + 1] = 1;
            cna.setValue(deviceOut, 0n, 'i64');
            standalone.init = cna._cna_presentation_parameters_init(parameters);
            standalone.create = cna._cna_graphics_device_create(0, 0, parameters, deviceOut);
            standalone.destroy = cna._cna_graphics_device_destroy(cna.getValue(deviceOut, 'i64'));
        } finally { cna._free(deviceOut); cna._free(parameters); }
        return 0;
    }, 'ijiii');
    const secondCallbacks = cna._malloc(32);
    const secondInfo = cna._malloc(48);
    const secondOut = cna._malloc(8);
    try {
        cna.HEAPU8.fill(0, secondCallbacks, secondCallbacks + 32);
        cna.HEAPU32[secondCallbacks >> 2] = 32;
        cna.HEAPU32[(secondCallbacks >> 2) + 1] = 1;
        cna.HEAPU32[(secondCallbacks >> 2) + 2] = loadContent;
        cna.HEAPU8.fill(0, secondInfo, secondInfo + 48);
        cna.HEAPU32[secondInfo >> 2] = 48;
        cna.HEAPU32[(secondInfo >> 2) + 1] = 1;
        cna.setValue(secondInfo + 16, 166667n, 'i64');
        cna.HEAPU32[(secondInfo + 40) >> 2] = secondCallbacks;
        cna.setValue(secondOut, 0n, 'i64');
        standalone.gameCreate = cna._cna_game_create(secondInfo, secondOut);
        const secondGame = cna.getValue(secondOut, 'i64');
        standalone.frame = cna._cna_game_run_one_frame(secondGame);
        try { standalone.gameDestroy = cna._cna_game_destroy(secondGame); }
        catch (error) { standalone.gameDestroy = `threw ${error?.name} errno=${error?.errno}`; }
        check('a Game outlives a caller-created device made and destroyed in its load_content',
              standalone.gameCreate === 0 && standalone.create === 0 && standalone.destroy === 0 &&
                  standalone.frame === 0 && standalone.gameDestroy === 0,
              JSON.stringify(standalone));
    } finally {
        cna._free(secondOut);
        cna._free(secondInfo);
        cna._free(secondCallbacks);
        cna.removeFunction(loadContent);
    }
} catch (error) {
    say(`[FAIL] the probe threw: ${error && error.stack ? error.stack : error}`);
}

say(`=== ${passed}/${EXPECTED} PASS ===`);
</script>
</body>
