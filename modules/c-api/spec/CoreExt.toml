# CoreExt routes, generated into src/generated/CoreExt.inc,
# which src/CnaCApiCoreExt.cpp includes. Format: docs/c-api/GENERATED_ROUTES.md.

[fallback_record]
lookup = "BorrowFallbackRecord"
object = "const CNA::GraphicsRendererFallbackRecord*"

[fallback_record.routes]
cna_graphics_renderer_fallback_get_message_size_ext = { size = "object->message" }
cna_graphics_renderer_fallback_copy_message_ext = { copy = "object->message" }

[calls]
[calls.routes]
cna_logger_fatal = { result = "LogWithCategory(&CNA::Logger::Fatal, message, category)" }
cna_logger_error = { result = "LogWithCategory(&CNA::Logger::Error, message, category)" }
cna_logger_warn = { result = "LogWithCategory(&CNA::Logger::Warn, message, category)" }
cna_logger_info = { result = "LogWithCategory(&CNA::Logger::Info, message, category)" }
cna_logger_debug = { result = "LogWithCategory(&CNA::Logger::Debug, message, category)" }
cna_logger_trace = { result = "LogWithCategory(&CNA::Logger::Trace, message, category)" }
cna_logger_experiment = { result = "LogWithCategory(&CNA::Logger::Experiment, message, category)" }
cna_logger_fatal_if = { call = "CNA::Logger::FatalIf(message, condition)", refuse_nul = ["message"] }
cna_logger_error_if = { call = "CNA::Logger::ErrorIf(message, condition)", refuse_nul = ["message"] }
cna_logger_warn_if = { call = "CNA::Logger::WarnIf(message, condition)", refuse_nul = ["message"] }
cna_logger_info_if = { call = "CNA::Logger::InfoIf(message, condition)", refuse_nul = ["message"] }
cna_logger_debug_if = { call = "CNA::Logger::DebugIf(message, condition)", refuse_nul = ["message"] }
cna_logger_trace_if = { call = "CNA::Logger::TraceIf(message, condition)", refuse_nul = ["message"] }
cna_logger_experiment_if = { call = "CNA::Logger::ExperimentIf(message, condition)", refuse_nul = ["message"] }
cna_platform_copy_current_name_ext = { copy = "CNA::getCurrentPlatformName()" }
# CBIND-093. The assembly title works in every build; the canonical AssemblyTitleAttributeEXT has
# no C form, because C has no static-initialization construct to bind -- a C caller sets the
# title from main instead.
cna_assembly_set_title_ext = { call = "CNA::SetAssemblyTitleEXT(title)", refuse_nul = ["title"] }
cna_assembly_copy_title_ext = { copy = "CNA::GetAssemblyTitleEXT()" }
cna_graphics_renderer_get_current_name_size = { size = "CNA::getCurrentGraphicsRendererName()" }
cna_graphics_renderer_copy_current_name = { copy = "CNA::getCurrentGraphicsRendererName()" }

[values]
[values.routes]
cna_logger_get_minimum_level = { value = "MapLogLevelToC(CNA::Logger::GetMinimumLevel())" }
cna_graphics_backend_get_current_category = { value = "MapBackendCategoryToC(CNA::getCurrentGraphicsRendererCategory())" }
cna_graphics_backend_get_current_maturity = { value = "MapBackendMaturityToC(CNA::getCurrentGraphicsRendererMaturity())" }
cna_platform_get_is_apple_ext = { value = "CNA::isApplePlatform()" }
cna_platform_get_is_mobile_ext = { value = "CNA::isMobilePlatform()" }
cna_platform_get_current_name_size_ext = { size = "std::string_view(CNA::getCurrentPlatformName())" }
cna_graphics_renderer_get_selected_ext = { value = "MapRendererTypeToC(CNA::GraphicsRendererSelection::GetSelected())" }
cna_graphics_renderer_get_active_ext = { value = "MapRendererTypeToC(CNA::GraphicsRendererSelection::GetActive())" }
cna_graphics_renderer_get_is_latched_ext = { value = "CNA::GraphicsRendererSelection::IsLatched()" }
cna_graphics_renderer_get_available_count_ext = { value = "CNA::GraphicsRendererSelection::GetAvailable().size()" }
cna_graphics_renderer_set_automatic_fallback_ext = { call = "CNA::GraphicsRendererSelection::EnableAutomaticFallback(enabled)" }
cna_graphics_renderer_get_automatic_fallback_ext = { value = "CNA::GraphicsRendererSelection::IsFallbackEnabled()" }
cna_graphics_renderer_get_fallback_count_ext = { value = "CNA::GraphicsRendererSelection::GetFallbackHistory().size()" }
cna_graphics_renderer_reset_selection_for_tests_ext = { call = "CNA::GraphicsRendererSelection::ResetForTestingEXT()" }
cna_graphics_renderer_get_current_type = { value = "MapRendererTypeToC(CNA::getCurrentGraphicsRendererType())" }

# The lookup maps the C log level to the canonical one; `object` is that CNA::LogLevel.
cna_graphics_renderer_set_preferred_by_name_ext = { call = "CNA::GraphicsRendererSelection::SetPreferred(std::string_view(name))", refuse_nul = ["name"] }
[log_level]
lookup = "MapLogLevel"
object = "CNA::LogLevel"

[log_level.routes]
cna_logger_set_minimum_level = { call = "CNA::Logger::SetMinimumLevel(object)" }

# The lookup maps the C renderer identity to the canonical one, refusing unknown values.
[renderer_type]
lookup = "MapRendererType"
object = "CNA::GraphicsRendererType"

[renderer_type.routes]
cna_graphics_backend_get_category = { get = "MapBackendCategoryToC(CNA::getGraphicsRendererCategory(object))" }
cna_graphics_backend_get_maturity = { get = "MapBackendMaturityToC(CNA::getGraphicsRendererMaturity(object))" }
cna_graphics_renderer_set_preferred_ext = { call = "CNA::GraphicsRendererSelection::SetPreferred(object)" }
cna_graphics_renderer_get_is_available_ext = { get = "CNA::GraphicsRendererSelection::IsAvailable(object)" }

# The lookup maps the C backend category to the canonical one.
[backend_category]
lookup = "MapBackendCategory"
object = "CNA::GraphicsRendererCategory"

[backend_category.routes]
cna_graphics_backend_category_copy_name = { copy = "CNA::toStringView(object)" }

# The lookup maps the C backend maturity to the canonical one.
[backend_maturity]
lookup = "MapBackendMaturity"
object = "CNA::GraphicsRendererMaturity"

[backend_maturity.routes]
cna_graphics_backend_maturity_copy_name = { copy = "CNA::toStringView(object)" }

# The lookup maps the C fallback reason to the canonical one.
[fallback_reason]
lookup = "MapFallbackReason"
object = "CNA::GraphicsRendererFallbackReason"

[fallback_reason.routes]
cna_graphics_renderer_fallback_reason_get_name_size_ext = { size = "std::string_view(CNA::getGraphicsRendererFallbackReasonName(object))" }
cna_graphics_renderer_fallback_reason_copy_name_ext = { copy = "CNA::getGraphicsRendererFallbackReasonName(object)" }

# The routes whose logic is a hand-written helper of the same name, in CamelCase. The
# generated half refuses null out_* outputs, clears handle outputs and checks CNA_Bool
# inputs first; C structures and text reach the helper as the caller passed them.
[helpers]
raw = true

[helpers.routes]
cna_logger_log = { result = "LoggerLog(level, message, category, condition)" }
cna_platform_get_current = { result = "PlatformGetCurrent(out_platform)" }
cna_desktop_os_get_current = { result = "DesktopOsGetCurrent(out_os)" }
cna_graphics_renderer_copy_available_ext = { result = "GraphicsRendererCopyAvailableExt(destination, capacity, out_count)" }
cna_graphics_renderer_try_parse_name_ext = { result = "GraphicsRendererTryParseNameExt(name, out_type, out_recognized)" }
cna_graphics_renderer_get_fallback_at_ext = { result = "GraphicsRendererGetFallbackAtExt(index, out_record)" }
cna_graphics_backend_category_get_name_size = { result = "GraphicsBackendCategoryGetNameSize(category, out_bytes)", optional = ["out_bytes"] }
cna_graphics_backend_maturity_get_name_size = { result = "GraphicsBackendMaturityGetNameSize(maturity, out_bytes)", optional = ["out_bytes"] }
cna_logger_set_sink_ext = { result = "LoggerSetSinkExt(callback, context)" }
cna_logger_reset_sink_ext = { result = "LoggerResetSinkExt()" }
cna_graphics_renderer_set_fallback_chain_ext = { result = "GraphicsRendererSetFallbackChainExt(types, count)" }
