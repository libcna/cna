# Avatars routes, generated into src/generated/Avatars.inc,
# which src/CnaCApiAvatars.cpp includes. Format: docs/c-api/GENERATED_ROUTES.md.

[description]
lookup = "BorrowDescription"
object = "std::shared_ptr<AvatarDescriptionResource>"

[description.routes]
cna_avatar_description_destroy = { release = true }

[animation]
lookup = "BorrowAnimation"
object = "std::shared_ptr<AvatarAnimationResource>"

[animation.routes]
cna_avatar_animation_destroy = { release = "object->value->Dispose()" }
cna_avatar_animation_set_current_position = { call = "object->value->setCurrentPositionProperty(System::TimeSpan(position_ticks))" }

[renderer]
lookup = "BorrowRenderer"
object = "std::shared_ptr<AvatarRendererResource>"

[renderer.routes]
cna_avatar_renderer_destroy = { release = "object->value->Dispose()" }

[calls]
[calls.routes]
cna_avatar_description_create_random = { result = "PublishDescription(AvatarDescription::CreateRandom(), out_description)" }

[values]
[values.routes]
cna_avatar_expression_init = { value = "ToC(AvatarExpression{})" }

[renderer_and_animation]
lookup = "BorrowRenderer"
object = "std::shared_ptr<AvatarRendererResource>"
other = { lookup = "BorrowAnimation", object = "std::shared_ptr<AvatarAnimationResource>" }

[renderer_and_animation.routes]
# The canonical parameter is the animation interface, and this ABI's animation handle is the
# only thing that implements it -- a C caller cannot supply an implementation of its own.
cna_avatar_renderer_draw_animation = { call = "object->value->Draw(other->value.get())" }
