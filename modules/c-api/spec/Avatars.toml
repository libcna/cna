# Avatars routes, generated into src/generated/Avatars.inc,
# which src/CnaCApiAvatars.cpp includes. Format: docs/c-api/GENERATED_ROUTES.md.

[description]
lookup = "BorrowDescription"
object = "std::shared_ptr<AvatarDescriptionResource>"

[description.routes]
cna_avatar_description_destroy = { release = true }
cna_avatar_description_get_info = { versioned = true, get = '''
CNA_AvatarDescriptionInfo{
    sizeof(CNA_AvatarDescriptionInfo),
    StructureVersion,
    static_cast<CNA_AvatarBodyType>(object->value->getBodyTypeProperty()),
    object->value->getHeightProperty(),
    static_cast<uint64_t>(object->value->getDescriptionProperty().size()),
    ToCBool(object->value->getIsValidProperty()),
    {0U, 0U, 0U, 0U, 0U, 0U, 0U}
}''' }
cna_avatar_description_copy_description = { copy = "object->value->getDescriptionProperty()" }

[animation]
lookup = "BorrowAnimation"
object = "std::shared_ptr<AvatarAnimationResource>"

[animation.routes]
cna_avatar_animation_destroy = { release = "object->value->Dispose()" }
cna_avatar_animation_set_current_position = { call = "object->value->setCurrentPositionProperty(System::TimeSpan(position_ticks))" }
cna_avatar_animation_update = { call = "object->value->Update(System::TimeSpan(elapsed_ticks), loop)" }
cna_avatar_animation_get_info = { versioned = true, get = '''
CNA_AvatarAnimationInfo{
    sizeof(CNA_AvatarAnimationInfo),
    StructureVersion,
    static_cast<int32_t>(object->value->getBoneTransformsProperty().getCountProperty()),
    ToCBool(object->value->getIsDisposedProperty()),
    {0U, 0U, 0U},
    static_cast<int64_t>(object->value->getCurrentPositionProperty().getTicksProperty()),
    static_cast<int64_t>(object->value->getLengthProperty().getTicksProperty())
}''' }
cna_avatar_animation_get_expression = { get = "ToC(object->value->getExpressionProperty())", versioned = true }

[renderer]
lookup = "BorrowRenderer"
object = "std::shared_ptr<AvatarRendererResource>"

[renderer.routes]
cna_avatar_renderer_destroy = { release = "object->value->Dispose()" }
cna_avatar_renderer_get_info = { versioned = true, get = '''
CNA_AvatarRendererInfo{
    sizeof(CNA_AvatarRendererInfo),
    StructureVersion,
    static_cast<CNA_AvatarRendererState>(object->value->getStateProperty()),
    ToCBool(object->value->getIsDisposedProperty()),
    {0U, 0U, 0U}
}''' }

[calls]
[calls.routes]
cna_avatar_description_create_random = { result = "PublishDescription(AvatarDescription::CreateRandom(), out_description)" }
cna_avatar_description_create_random_for_body_type = { result = "PublishDescription(AvatarDescription::CreateRandom(static_cast<AvatarBodyType>(body_type)), out_description)", invalid_if = "body_type > CNA_AVATAR_BODY_TYPE_MAXIMUM" }
cna_avatar_animation_create = { result = "CreateResourceHandle<AvatarAnimationResource>(ObjectKind::AvatarAnimation, std::make_shared<AvatarAnimation>(static_cast<AvatarAnimationPreset>(preset)), out_animation)", invalid_if = "preset > CNA_AVATAR_ANIMATION_PRESET_MAXIMUM" }

[values]
[values.routes]
cna_avatar_expression_init = { value = "ToC(AvatarExpression{})" }

[renderer_and_animation]
lookup = "BorrowRenderer"
object = "std::shared_ptr<AvatarRendererResource>"
other = { lookup = "BorrowAnimation", object = "std::shared_ptr<AvatarAnimationResource>" }

[renderer_and_animation.routes]
# The canonical parameter is the animation interface, and this ABI's animation handle is the
# only thing that implements it -- a C caller cannot supply an implementation of its own.
cna_avatar_renderer_draw_animation = { call = "object->value->Draw(other->value.get())" }
