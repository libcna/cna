# VertexBuffer routes, generated into src/generated/VertexBuffer.inc,
# which src/CnaCApiVertexBuffer.cpp includes. Format: docs/c-api/GENERATED_ROUTES.md.

[buffer]
lookup = "GetBuffer"
object = "std::shared_ptr<VertexBufferResource>"

[buffer.routes]
cna_vertex_buffer_get_type_name_byte_count = { size = "object->value->GetTypeName()" }
cna_vertex_buffer_copy_type_name = { copy = "object->value->GetTypeName()" }
