# ContentReaders routes, generated into src/generated/ContentReaders.inc,
# which src/CnaCApiContentReaders.cpp includes. Format: docs/c-api/GENERATED_ROUTES.md.

[reader]
lookup = "GetReader"
object = "std::shared_ptr<ContentReaderResource>"

[reader.routes]
cna_content_reader_get_asset_name_size = { size = "object->value->getAssetNameProperty()" }
cna_content_reader_copy_asset_name = { copy = "object->value->getAssetNameProperty()" }
cna_content_reader_initialize_type_readers = { call = "object->value->InitializeTypeReaders()" }
cna_content_reader_read_shared_resources = { call = "object->value->ReadSharedResources()" }
cna_content_reader_get_version = { get = "object->value->getVersionProperty()" }
cna_content_reader_get_platform = { get = "object->value->getPlatformProperty()" }
cna_content_reader_destroy = { release = true, require = 'InvalidStateIf(object->isBorrowed, "A callback-scoped borrowed ContentReader handle cannot be destroyed; it is released when the callback that received it returns.")' }

[copy_reader_name]
lookup = "CopyReaderName"
object = "std::string"

[copy_reader_name.routes]
cna_content_type_reader_manager_get_is_registered = { get = "ContentTypeReaderManager::IsRegistered(object)" }
cna_known_unsupported_content_type_reader_create = { result = "CreateTypeReaderHandle(std::make_unique<KnownUnsupportedContentTypeReader>(std::move(object), static_cast<UnsupportedContentReaderReason>(reason)), out_type_reader)", invalid_if = "reason != CNA_UNSUPPORTED_CONTENT_READER_REASON_COMPILED_PLATFORM_SHADER_BYTECODE" }

[type_reader]
lookup = "GetTypeReader"
object = "std::shared_ptr<ContentTypeReaderResource>"

[type_reader.routes]
cna_content_type_reader_get_can_deserialize_into_existing_object = { get = "object->value->getCanDeserializeIntoExistingObjectProperty()" }
cna_content_type_reader_get_target_type_name_size = { size = "object->value->getTargetTypeNameProperty()" }
cna_content_type_reader_copy_target_type_name = { copy = "object->value->getTargetTypeNameProperty()" }
cna_content_type_reader_get_type_version = { get = "object->value->getTypeVersionProperty()" }
cna_content_type_reader_supports_version = { get = "object->value->SupportsVersion(static_cast<int>(serialized_version))" }
cna_content_type_reader_destroy = { release = true }

[object_dictionary]
lookup = "GetObjectDictionary"
object = "std::shared_ptr<ObjectDictionaryResource>"

[object_dictionary.routes]
cna_object_dictionary_ext_get_runtime_type_name_size = { size = "object->value->GetTypeName()" }
cna_object_dictionary_ext_get_count = { get = "object->value->getValuesProperty().size()" }
cna_object_dictionary_ext_destroy = { result = "GetRuntimeHandles().Release(dictionary)" }
cna_object_dictionary_ext_copy_runtime_type_name = { copy = "object->value->GetTypeName()" }
cna_object_dictionary_ext_contains_key = { get = "object->value->ContainsKey(key)", refuse_nul = ["key"] }

[reflective_builder]
lookup = "GetReflectiveBuilder"
object = "std::shared_ptr<ReflectiveBuilderResource>"

[reflective_builder.routes]
cna_reflective_type_reader_builder_destroy = { release = true }

[calls]
[calls.routes]
cna_reflective_type_reader_get_canonical_name_size = { result = "CanonicalNameSize(target_type_name, ReflectiveCanonicalName, out_byte_count)" }
cna_reflective_type_reader_copy_canonical_name = { result = "CanonicalNameCopy(target_type_name, ReflectiveCanonicalName, destination, capacity, out_byte_count)" }
cna_enum_type_reader_get_canonical_name_size = { result = "CanonicalNameSize(target_type_name, EnumCanonicalName, out_byte_count)" }
cna_enum_type_reader_copy_canonical_name = { result = "CanonicalNameCopy(target_type_name, EnumCanonicalName, destination, capacity, out_byte_count)" }

[values]
[values.routes]
cna_content_type_reader_manager_clear_type_creators = { call = "ContentTypeReaderManager::ClearTypeCreators()" }
cna_content_register_known_unsupported_xnb_readers = { call = "Microsoft::Xna::Framework::Content::RegisterKnownUnsupportedXnbReaders()" }

[dictionary_entry]
lookup = "GetDictionaryEntry"
object = "const std::any*"
owner = "std::shared_ptr<ObjectDictionaryResource>"
arguments = 2

[dictionary_entry.routes]
cna_object_dictionary_ext_get_type_name_size = { get = "std::strlen(object->type().name())" }

[foreign_registration]
lookup = "GetForeignRegistration"
object = "std::shared_ptr<ForeignReaderRegistration>"

[foreign_registration.routes]
cna_content_type_reader_manager_unregister = { release = "static_cast<void>(ContentTypeReaderManager::RemoveTypeCreatorEXT(object->canonicalName))" }

# The routes whose logic is a hand-written helper of the same name, in CamelCase. The
# generated half refuses null out_* outputs, clears handle outputs and checks CNA_Bool
# inputs first; C structures and text reach the helper as the caller passed them.
[helpers]
raw = true

[helpers.routes]
cna_content_reader_create = { result = "ContentReaderCreate(create_info, out_reader)" }
cna_content_reader_get_content_manager = { result = "ContentReaderGetContentManager(reader, out_content_manager)" }
cna_content_reader_read_bytes_exact = { result = "ContentReaderReadBytesExact(reader, count, reader_name, destination, capacity, out_bytes)" }
cna_content_type_reader_manager_register = { result = "ContentTypeReaderManagerRegister(canonical_name, callbacks, out_registration)" }
cna_content_type_reader_manager_create_reader = { result = "ContentTypeReaderManagerCreateReader(canonical_name, out_type_reader)" }
cna_content_type_reader_read_untyped = { result = "ContentTypeReaderReadUntyped(type_reader, reader, out_has_value)" }
cna_reflective_type_reader_builder_create = { result = "ReflectiveTypeReaderBuilderCreate(target_type_name, create_callback, context, out_builder)" }
cna_object_dictionary_ext_get_key_size_at = { result = "ObjectDictionaryExtGetKeySizeAt(dictionary, index, out_byte_count)" }
cna_object_dictionary_ext_copy_key_at = { result = "ObjectDictionaryExtCopyKeyAt(dictionary, index, destination, capacity, out_byte_count)" }
cna_object_dictionary_ext_get_entry = { result = "ObjectDictionaryExtGetEntry(dictionary, key, out_entry)" }
cna_object_dictionary_ext_copy_type_name = { result = "ObjectDictionaryExtCopyTypeName(dictionary, key, destination, capacity, out_byte_count)" }
cna_object_dictionary_ext_copy_array = { result = "ObjectDictionaryExtCopyArray(dictionary, key, kind, destination, capacity, out_byte_count)" }
cna_object_dictionary_ext_get_string_size = { result = "ObjectDictionaryExtGetStringSize(dictionary, key, out_byte_count)" }
cna_object_dictionary_ext_copy_string = { result = "ObjectDictionaryExtCopyString(dictionary, key, destination, capacity, out_byte_count)" }
cna_object_dictionary_ext_get_foreign_object = { result = "ObjectDictionaryExtGetForeignObject(dictionary, key, out_object)" }
cna_content_manager_load_object_dictionary_ext = { result = "ContentManagerLoadObjectDictionaryExt(content_manager, asset_name, out_dictionary)" }
cna_content_reader_read_matrix = { result = "ContentReaderReadMatrix(reader, out_value)", optional = ["out_value"] }
cna_content_reader_read_quaternion = { result = "ContentReaderReadQuaternion(reader, out_value)", optional = ["out_value"] }
cna_content_reader_read_vector2 = { result = "ContentReaderReadVector2(reader, out_value)", optional = ["out_value"] }
cna_content_reader_read_vector3 = { result = "ContentReaderReadVector3(reader, out_value)", optional = ["out_value"] }
cna_content_reader_read_vector4 = { result = "ContentReaderReadVector4(reader, out_value)", optional = ["out_value"] }
cna_content_reader_read_color = { result = "ContentReaderReadColor(reader, out_value)", optional = ["out_value"] }
cna_content_reader_read_bounding_sphere = { result = "ContentReaderReadBoundingSphere(reader, out_value)", optional = ["out_value"] }
cna_content_reader_read_object_tag = { result = "ContentReaderReadObjectTag(reader, out_has_value)", optional = ["out_has_value"] }
cna_content_reader_check_collection_element_count = { result = "ContentReaderCheckCollectionElementCount(reader, count, reader_name)" }
cna_content_reader_check_decoded_byte_size = { result = "ContentReaderCheckDecodedByteSize(reader, byte_size, reader_name)" }
cna_content_type_reader_initialize = { result = "ContentTypeReaderInitialize(type_reader)" }
cna_reflective_type_reader_builder_add_field = { result = "ReflectiveTypeReaderBuilderAddField(builder, kind, offset_in_bytes)" }
cna_reflective_type_reader_builder_add_enum_field = { result = "ReflectiveTypeReaderBuilderAddEnumField(builder, offset_in_bytes, enum_type_name)" }
cna_reflective_type_reader_builder_add_custom = { result = "ReflectiveTypeReaderBuilderAddCustom(builder, callback, context)" }
cna_reflective_type_reader_builder_register = { result = "ReflectiveTypeReaderBuilderRegister(builder)" }
cna_reflective_type_reader_builder_register_shared = { result = "ReflectiveTypeReaderBuilderRegisterShared(builder)" }
cna_object_dictionary_ext_copy_value = { result = "ObjectDictionaryExtCopyValue(dictionary, key, kind, destination, capacity)" }
