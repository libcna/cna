# VertexResources routes, generated into src/generated/VertexResources.inc,
# which src/CnaCApiVertexResources.cpp includes. Format: docs/c-api/GENERATED_ROUTES.md.

[declaration]
lookup = "GetDeclaration"
object = "std::shared_ptr<VertexDeclaration>"

[declaration.routes]
cna_vertex_declaration_copy_type_name = { copy = "object->GetTypeName()" }
cna_vertex_declaration_get_stride = { get = "object->getVertexStrideProperty()" }
cna_vertex_declaration_get_type_name_byte_count = { size = "object->GetTypeName()" }
cna_vertex_declaration_destroy = { release = "object->Dispose()" }

[calls]
[calls.routes]
cna_vertex_declaration_create_empty = { result = "RegisterDeclaration(std::make_shared<VertexDeclaration>(), out_declaration)" }
