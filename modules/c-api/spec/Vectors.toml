# The routes whose logic is a hand-written helper of the same name, in CamelCase. The
# generated half refuses null out_* outputs, clears handle outputs and checks CNA_Bool
# inputs first; C structures and text reach the helper as the caller passed them.
[helpers]
raw = true

[helpers.routes]
cna_vector2_normalize_in_place = { result = "Vector2NormalizeInPlace(value)" }
cna_vector2_transform_matrix_array = { result = "Vector2TransformMatrixArray(source, source_count, source_index, matrix, destination, destination_count, destination_index, length)" }
cna_vector2_transform_quaternion_array = { result = "Vector2TransformQuaternionArray(source, source_count, source_index, rotation, destination, destination_count, destination_index, length)" }
cna_vector2_transform_normal_array = { result = "Vector2TransformNormalArray(source, source_count, source_index, matrix, destination, destination_count, destination_index, length)" }
