# GameComponents routes, generated into src/generated/GameComponents.inc,
# which src/CnaCApiGameComponents.cpp includes. Format: docs/c-api/GENERATED_ROUTES.md.

[component]
lookup = "BorrowComponent"
object = "std::shared_ptr<ComponentResource>"

[component.routes]
cna_game_component_get_is_drawable = { get = "object->drawable != nullptr" }
cna_game_component_get_enabled = { get = "object->value->getEnabledProperty()" }
cna_game_component_set_enabled = { call = "object->value->setEnabledProperty(enabled)" }
cna_game_component_get_update_order = { get = "object->value->getUpdateOrderProperty()" }
cna_game_component_set_update_order = { call = "object->value->setUpdateOrderProperty(static_cast<SharpRuntime::intcs>(order))" }
cna_game_component_initialize = { call = "object->value->Initialize()" }
cna_game_component_dispose = { call = "object->value->Dispose()" }
cna_game_component_get_type_name_size = { size = "object->value->GetTypeName()" }
cna_game_component_copy_type_name = { copy = "object->value->GetTypeName()" }

[drawable]
lookup = "BorrowDrawable"
object = "std::shared_ptr<ComponentResource>"

[drawable.routes]
cna_drawable_game_component_get_draw_order = { get = "object->drawable->getDrawOrderProperty()" }
cna_drawable_game_component_set_draw_order = { call = "object->drawable->setDrawOrderProperty(static_cast<SharpRuntime::Int32>(order))" }
cna_drawable_game_component_get_visible = { get = "object->drawable->getVisibleProperty()" }
cna_drawable_game_component_set_visible = { call = "object->drawable->setVisibleProperty(visible)" }

[components]
lookup = "BorrowComponents"
object = "GameComponentCollection*"

[components.routes]
cna_game_components_get_count = { get = "object->getCountProperty()" }
cna_game_components_clear = { call = "object->Clear()" }
cna_game_components_get_type_name_size = { size = "object->GetTypeName()" }
cna_game_components_copy_type_name = { copy = "object->GetTypeName()" }
cna_game_components_remove_at = { call = "object->RemoveAt(static_cast<GameComponentCollection::size_type>(index))", require = 'RequireIndex(index, object->getCountProperty(), "The component index is at or past the collection count.")' }

[components_and_component]
lookup = "BorrowComponents"
object = "GameComponentCollection*"
other = { lookup = "BorrowComponent", object = "std::shared_ptr<ComponentResource>" }

[components_and_component.routes]
cna_game_components_add = { call = "object->Add(other->value.get())" }
cna_game_components_remove = { get = "object->Remove(other->value.get())" }
cna_game_components_contains = { get = "object->Contains(other->value.get())" }
cna_game_components_index_of = { get = "object->IndexOf(other->value.get())" }

[calls]
[calls.routes]
cna_game_component_create = { result = "CreateComponent<CGameComponent>(game, callbacks, out_component)" }
cna_drawable_game_component_create = { result = "CreateComponent<CDrawableGameComponent>(game, callbacks, out_component)" }
cna_game_components_subscribe_added = { result = "SubscribeCollection(game, true, callback, context, out_registration)" }
cna_game_components_subscribe_removed = { result = "SubscribeCollection(game, false, callback, context, out_registration)" }

[component_pair]
lookup = "BorrowComponent"
object = "std::shared_ptr<ComponentResource>"
other = { lookup = "BorrowComponent", object = "std::shared_ptr<ComponentResource>" }

[component_pair.routes]
cna_game_component_compare_to = { get = "object->value->CompareTo(*other->value)" }

# The routes whose logic is a hand-written helper of the same name, in CamelCase. The
# generated half refuses null out_* outputs, clears handle outputs and checks CNA_Bool
# inputs first; C structures and text reach the helper as the caller passed them.
[helpers]
raw = true

[helpers.routes]
cna_game_component_callbacks_init = { result = "GameComponentCallbacksInit(out_callbacks)" }
cna_game_component_get_game = { result = "GameComponentGetGame(component, out_game)" }
cna_drawable_game_component_get_graphics_device = { result = "DrawableGameComponentGetGraphicsDevice(component, out_graphics_device)" }
cna_game_component_subscribe = { result = "GameComponentSubscribe(component, event, callback, context, out_registration)" }
cna_game_components_get_at = { result = "GameComponentsGetAt(game, index, out_component)" }
cna_game_services_contains_ext = { result = "GameServicesContainsExt(game, service, out_present)" }
cna_game_component_update = { result = "GameComponentUpdate(component, game_time)" }
cna_drawable_game_component_draw = { result = "DrawableGameComponentDraw(component, game_time)" }
cna_game_component_unsubscribe = { result = "GameComponentUnsubscribe(registration)" }
cna_game_component_destroy = { result = "GameComponentDestroy(component)" }
cna_game_components_insert = { result = "GameComponentsInsert(game, index, component)" }
cna_game_services_remove_ext = { result = "GameServicesRemoveExt(game, service)" }
