# Guide routes, generated into src/generated/Guide.inc,
# which src/CnaCApiGuide.cpp includes. Format: docs/c-api/GENERATED_ROUTES.md.

[game_object]
lookup = "CNA::C::Detail::GetGameObject"
object = "Microsoft::Xna::Framework::Game*"

[game_object.routes]
cna_gamer_services_dispatcher_initialize = { call = "GamerServicesDispatcher::Initialize(object->getServicesProperty())" }
cna_gamer_services_component_create = { result = "CreateOwnedCanonicalGameComponent(game, std::make_unique<GamerServicesComponent>(*object), out_component)" }

[calls]
[calls.routes]
cna_guide_copy_pending_keyboard_input_title_ext = { result = "CopyText(Guide::GetPendingKeyboardInputTitleForTestingEXT(), destination, capacity, out_bytes)" }
cna_guide_copy_pending_keyboard_input_description_ext = { result = "CopyText(Guide::GetPendingKeyboardInputDescriptionForTestingEXT(), destination, capacity, out_bytes)" }
cna_guide_copy_pending_keyboard_input_display_text_ext = { result = "CopyText(Guide::GetPendingKeyboardInputDisplayTextForTestingEXT(), destination, capacity, out_bytes)" }

[values]
[values.routes]
cna_guide_get_is_screen_saver_enabled = { value = "Guide::getIsScreenSaverEnabledProperty()" }
cna_guide_get_is_trial_mode = { value = "Guide::getIsTrialModeProperty()" }
cna_guide_get_is_visible = { value = "Guide::getIsVisibleProperty()" }
cna_guide_get_notification_position = { value = "Guide::getNotificationPositionProperty()" }
cna_guide_get_simulate_trial_mode = { value = "Guide::getSimulateTrialModeProperty()" }
cna_guide_get_has_pending_keyboard_input_ext = { value = "Guide::getHasPendingKeyboardInputEXTProperty()" }
cna_guide_get_pending_keyboard_input_title_size_ext = { size = "Guide::GetPendingKeyboardInputTitleForTestingEXT()" }
cna_guide_get_pending_keyboard_input_description_size_ext = { size = "Guide::GetPendingKeyboardInputDescriptionForTestingEXT()" }
cna_guide_get_pending_keyboard_input_display_text_size_ext = { size = "Guide::GetPendingKeyboardInputDisplayTextForTestingEXT()" }
cna_guide_simulate_keyboard_input_cancel_ext = { call = "Guide::SimulateKeyboardInputCancelEXT()" }
cna_guide_get_has_pending_message_box_ext = { value = "Guide::getHasPendingMessageBoxEXTProperty()" }
cna_guide_simulate_message_box_click_ext = { call = "Guide::SimulateMessageBoxClickEXT(static_cast<int>(button_index))" }
cna_guide_delay_notifications = { call = "Guide::DelayNotifications(System::TimeSpan(delay_ticks))" }
cna_gamer_services_dispatcher_get_is_initialized = { value = "GamerServicesDispatcher::getIsInitializedProperty()" }
cna_gamer_services_dispatcher_get_window_handle = { value = "GamerServicesDispatcher::getWindowHandleProperty()" }
cna_gamer_services_dispatcher_set_window_handle = { call = "GamerServicesDispatcher::setWindowHandleProperty(static_cast<SharpRuntime::IntPtr>(window_handle))" }
cna_gamer_services_dispatcher_update = { call = "GamerServicesDispatcher::Update()" }
cna_gamer_services_dispatcher_update_async = { value = "GamerServicesDispatcher::UpdateAsync()" }
cna_gamer_services_dispatcher_get_freed_gamer_count_ext = { value = "GamerServicesDispatcher::GetFreedGamerCountForTesting()" }
cna_guide_set_notification_position = { call = "Guide::setNotificationPositionProperty(static_cast<NotificationPosition>(position))", invalid_if = "position > CNA_NOTIFICATION_POSITION_MAXIMUM" }

# `object` is the canonical PlayerIndex the C player index maps to; `other` the gamer shown.
[player_and_gamer]
lookup = "ValidatePlayer"
object = "PlayerIndex"
other = { lookup = "BorrowGamerForGuide", object = "Gamer*" }

[player_and_gamer.routes]
cna_guide_show_friend_request = { call = "Guide::ShowFriendRequest(object, other)" }
cna_guide_show_gamer_card = { call = "Guide::ShowGamerCard(object, other)" }
cna_guide_show_player_review = { call = "Guide::ShowPlayerReview(object, other)" }

# `object` is the canonical PlayerIndex the C player index maps to.
[player]
lookup = "ValidatePlayer"
object = "PlayerIndex"

[player.routes]
cna_guide_show_friends = { call = "Guide::ShowFriends(object)" }
cna_guide_show_marketplace = { call = "Guide::ShowMarketplace(object)" }
cna_guide_show_messages = { call = "Guide::ShowMessages(object)" }
cna_guide_show_party = { call = "Guide::ShowParty(object)" }
cna_guide_show_party_sessions = { call = "Guide::ShowPartySessions(object)" }
cna_guide_show_players = { call = "Guide::ShowPlayers(object)" }
cna_guide_show_achievements_ext = { call = "Guide::ShowAchievementsEXT(object)" }
