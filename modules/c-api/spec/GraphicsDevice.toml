# GraphicsDevice routes, generated into src/generated/GraphicsDevice.inc,
# which src/CnaCApiGraphicsDevice.cpp includes. Format: docs/c-api/GENERATED_ROUTES.md.

[viewport]
[viewport.routes]
cna_viewport_init = { value = "Viewport()" }
cna_viewport_init_bounds = { value = "Viewport(x, y, width, height)" }
cna_viewport_get_aspect_ratio = { value = "value.getAspectRatioProperty()" }
cna_viewport_get_bounds = { value = "value.getBoundsProperty()" }
cna_viewport_get_title_safe_area = { value = "value.getTitleSafeAreaProperty()" }
cna_viewport_project = { value = "value.Project(source, projection, view, world)" }
cna_viewport_unproject = { value = "value.Unproject(source, projection, view, world)" }
cna_viewport_get_string_size = { size = "value.ToString()" }
cna_viewport_copy_string = { copy = "value.ToString()" }

[rectangle]
[rectangle.routes]
cna_viewport_init_from_rectangle = { value = "Viewport(bounds)" }

[values]
[values.routes]
cna_primitive_type_get_vertex_count = { value = "GraphicsDevice::PrimitiveVerts(static_cast<PrimitiveType>(primitive_type), primitive_count)" }

[borrowed_graphics_device]
lookup = "GetBorrowedGraphicsDevice"
object = "std::shared_ptr<BorrowedGraphicsDevice>"

[borrowed_graphics_device.routes]
cna_graphics_device_get_is_disposed = { get = "object->value->getIsDisposedProperty()" }
cna_graphics_device_get_status = { get = "NativeOrdinal(object->value->getGraphicsDeviceStatusProperty())" }
cna_graphics_device_set_viewport = { call = "object->value->setViewportProperty(viewport)", invalid_if = "!std::isfinite(viewport.min_depth) || !std::isfinite(viewport.max_depth)" }
cna_graphics_device_get_blend_factor = { get = "object->value->getBlendFactorProperty()" }
cna_graphics_device_set_blend_factor = { call = "object->value->setBlendFactorProperty(blend_factor)" }
cna_graphics_device_clear_rgba = { call = "object->value->Clear(r, g, b, a)", invalid_if = "!std::isfinite(r) || !std::isfinite(g) || !std::isfinite(b) || !std::isfinite(a)" }
cna_graphics_device_clear_color_depth = { call = "object->value->Clear(color, depth)", invalid_if = "!std::isfinite(depth)" }
cna_graphics_device_clear_options = { call = "object->value->Clear(static_cast<NativeGraphics::ClearOptions>(options), color, depth, stencil)", invalid_if = ["(options & ~(CNA_CLEAR_OPTION_TARGET | CNA_CLEAR_OPTION_DEPTH_BUFFER | CNA_CLEAR_OPTION_STENCIL)) != 0U", "!std::isfinite(depth)"] }
cna_graphics_device_set_graphics_profile_ext = { call = "object->value->SetGraphicsProfileEXT(static_cast<GraphicsProfile>(profile))", invalid_if = "profile != NativeOrdinal(GraphicsProfile::Reach) && profile != NativeOrdinal(GraphicsProfile::HiDef)" }
cna_graphics_device_set_unsupported_3d_call_behavior = { call = "object->value->SetUnsupported3DGraphicsCallBehavior(static_cast<CNA::Unsupported3DGraphicsCallBehavior>(behavior))", invalid_if = "behavior != CNA_UNSUPPORTED_3D_GRAPHICS_CALL_BEHAVIOR_THROW && behavior != CNA_UNSUPPORTED_3D_GRAPHICS_CALL_BEHAVIOR_WARN_AND_STUB" }
cna_graphics_device_set_context_recovery_enabled = { call = "object->value->SetContextRecoveryEnabled(enabled)" }
cna_graphics_device_get_graphics_profile = { get = "NativeOrdinal(object->value->getGraphicsProfileProperty())" }
cna_graphics_device_get_scissor_rectangle = { get = "object->value->getScissorRectangleProperty()" }
cna_graphics_device_set_scissor_rectangle = { call = "object->value->setScissorRectangleProperty(scissor_rectangle)" }
cna_graphics_device_get_viewport = { get = "object->value->getViewportProperty()" }
cna_graphics_device_get_multi_sample_mask = { get = "object->value->getMultiSampleMaskProperty()" }
cna_graphics_device_set_multi_sample_mask = { call = "object->value->setMultiSampleMaskProperty(multi_sample_mask)" }
cna_graphics_device_get_reference_stencil = { get = "object->value->getReferenceStencilProperty()" }
cna_graphics_device_set_reference_stencil = { call = "object->value->setReferenceStencilProperty(reference_stencil)" }
cna_graphics_device_get_type_name_size = { size = "object->value->GetTypeName()" }
cna_graphics_device_present = { call = "object->value->Present()" }
cna_graphics_device_get_vertex_buffer_count = { get = "object->value->GetVertexBuffers().size()" }
cna_graphics_device_get_tracked_resource_count = { get = "object->value->GetTrackedResourceCount()" }
cna_graphics_device_get_unsupported_3d_call_behavior = { get = "NativeOrdinal(object->value->GetUnsupported3DGraphicsCallBehavior())" }
cna_graphics_device_notify_content_lost_resources_ext = { call = "object->value->NotifyContentLostResourcesEXT()" }
cna_graphics_device_supports_surface_format_as_render_target_ext = { get = "object->value->SupportsSurfaceFormatAsRenderTargetEXT(static_cast<Microsoft::Xna::Framework::Graphics::SurfaceFormat>(format))" }
cna_graphics_device_executes_shader_effect_source_ext = { get = "object->value->ExecutesShaderEffectSourceEXT()" }
cna_graphics_device_supports_image_based_lighting_ext = { get = "object->value->SupportsImageBasedLightingEXT()" }
cna_graphics_device_get_display_color_space_ext = { get = "static_cast<uint32_t>(object->value->GetDisplayColorSpaceEXT())" }
cna_graphics_device_get_max_compute_work_group_size_ext = { get = "static_cast<int32_t>(object->value->GetMaxComputeWorkGroupSizeEXT(static_cast<int>(axis)))" }
cna_graphics_device_get_max_compute_work_group_invocations_ext = { get = "static_cast<int32_t>(object->value->GetMaxComputeWorkGroupInvocationsEXT())" }
cna_graphics_device_copy_type_name = { result = "CopyFormattedText(destination, capacity, out_bytes, [&] { return object->value->GetTypeName(); })" }
cna_graphics_device_dispose = { result = "NotSupported(\"The active game owns this graphics device; destroy the game to dispose it.\")" }
cna_graphics_device_draw_primitives = { call = "object->value->DrawPrimitives(static_cast<PrimitiveType>(primitive_type), vertex_start, primitive_count)", validate = "ValidatePrimitiveType(primitive_type)", require = "EnsureThreeDSupported(*object->value)" }
cna_graphics_device_draw_indexed_primitives = { call = "object->value->DrawIndexedPrimitives(static_cast<PrimitiveType>(primitive_type), base_vertex, min_vertex_index, num_vertices, start_index, primitive_count)", validate = "ValidatePrimitiveType(primitive_type)", require = "EnsureThreeDSupported(*object->value)" }
cna_graphics_device_draw_instanced_primitives = { call = "object->value->DrawInstancedPrimitives(static_cast<PrimitiveType>(primitive_type), base_vertex, min_vertex_index, num_vertices, start_index, primitive_count, instance_count)", validate = "ValidatePrimitiveType(primitive_type)", require = "EnsureThreeDSupported(*object->value)" }
cna_graphics_device_set_depth_test_enabled = { call = "object->value->SetDepthTestEnabled(enabled)", require = "EnsureThreeDSupported(*object->value)" }
cna_graphics_device_set_blend_enabled = { call = "object->value->SetBlendEnabled(enabled)", require = "EnsureThreeDSupported(*object->value)" }
cna_graphics_device_set_depth_write_enabled = { call = "object->value->SetDepthWriteEnabled(enabled)", require = "EnsureThreeDSupported(*object->value)" }
cna_graphics_device_set_string_marker_ext = { call = "object->value->SetStringMarkerEXT(marker)", refuse_nul = ["marker"] }
cna_graphics_device_set_display_color_space_ext = { get = "object->value->SetDisplayColorSpaceEXT(static_cast<CNA::DisplayColorSpace>(space))", validate = "ValidateDisplayColorSpaceOrdinal(space)" }
cna_graphics_device_supports_display_color_space_ext = { get = "object->value->SupportsDisplayColorSpaceEXT(static_cast<CNA::DisplayColorSpace>(space))", validate = "ValidateDisplayColorSpaceOrdinal(space)" }
cna_graphics_device_get_max_compute_work_group_count_ext = { get = "object->value->GetMaxComputeWorkGroupCountEXT(static_cast<int>(axis))" }

[occlusion_query]
lookup = "GetOcclusionQuery"
object = "std::shared_ptr<OcclusionQueryResource>"

[occlusion_query.routes]
cna_occlusion_query_begin = { call = "object->value->Begin()" }
cna_occlusion_query_end = { call = "object->value->End()" }
cna_occlusion_query_get_is_complete = { get = "object->value->getIsCompleteProperty()" }
cna_occlusion_query_get_pixel_count = { get = "object->value->getPixelCountProperty()" }
# CBIND-104: whether the count above is a tally or a flag. A coverage ratio computed from a boolean
# count is 1/area rather than a fraction, so a caller that divides has to be able to ask first.
cna_occlusion_query_get_is_pixel_count_precise_ext = { get = "object->value->isPixelCountPreciseEXT()" }
cna_occlusion_query_has_renderer = { get = "object->value->HasRenderer()" }

# The routes whose logic is a hand-written helper of the same name, in CamelCase. The
# generated half refuses null out_* outputs, clears handle outputs and checks CNA_Bool
# inputs first; C structures and text reach the helper as the caller passed them.
[helpers]
raw = true

[helpers.routes]
cna_graphics_device_get_adapter_index = { result = "GraphicsDeviceGetAdapterIndex(graphics_device, out_adapter_index)" }
cna_graphics_device_subscribe_event = { result = "GraphicsDeviceSubscribeEvent(graphics_device, device_event, callback, context, out_registration)" }
cna_graphics_device_copy_vertex_buffers = { result = "GraphicsDeviceCopyVertexBuffers(graphics_device, destination, capacity, out_count)" }
cna_occlusion_query_create = { result = "OcclusionQueryCreate(graphics_device, out_occlusion_query)" }
cna_graphics_device_get_texture = { result = "GraphicsDeviceGetTexture(graphics_device, stage, slot, out_info)" }
cna_graphics_device_subscribe_resource_created = { result = "GraphicsDeviceSubscribeResourceCreated(graphics_device, callback, context, out_registration)", optional = ["out_registration"] }
cna_graphics_device_subscribe_resource_destroyed = { result = "GraphicsDeviceSubscribeResourceDestroyed(graphics_device, callback, context, out_registration)", optional = ["out_registration"] }
cna_viewport_set_bounds = { result = "ViewportSetBounds(viewport, bounds)" }
cna_graphics_device_unsubscribe = { result = "GraphicsDeviceUnsubscribe(registration)" }
cna_graphics_device_set_texture = { result = "GraphicsDeviceSetTexture(graphics_device, stage, slot, texture)" }
cna_graphics_device_unbind_texture = { result = "GraphicsDeviceUnbindTexture(graphics_device, texture)" }
cna_graphics_device_get_backbuffer_data_window = { result = "GraphicsDeviceGetBackbufferDataWindow(graphics_device, readback, destination, capacity)" }
cna_graphics_device_set_vertex_buffer = { result = "GraphicsDeviceSetVertexBuffer(graphics_device, vertex_buffer)" }
cna_graphics_device_set_vertex_buffer_offset = { result = "GraphicsDeviceSetVertexBufferOffset(graphics_device, vertex_buffer, vertex_offset)" }
cna_graphics_device_set_vertex_buffers = { result = "GraphicsDeviceSetVertexBuffers(graphics_device, bindings, binding_count)" }
cna_graphics_device_get_vertex_buffer = { result = "GraphicsDeviceGetVertexBuffer(graphics_device, out_vertex_buffer)" }
cna_graphics_device_set_index_buffer = { result = "GraphicsDeviceSetIndexBuffer(graphics_device, index_buffer)" }
cna_graphics_device_get_index_buffer = { result = "GraphicsDeviceGetIndexBuffer(graphics_device, out_index_buffer)" }
cna_graphics_device_draw_user_primitives = { result = "GraphicsDeviceDrawUserPrimitives(graphics_device, primitives)" }
cna_graphics_device_draw_user_indexed_primitives = { result = "GraphicsDeviceDrawUserIndexedPrimitives(graphics_device, primitives, indices)" }
cna_graphics_device_set_current_effect = { result = "GraphicsDeviceSetCurrentEffect(graphics_device, effect)" }
cna_graphics_device_recreate_renderer_for_multi_sample_count_ext = { result = "GraphicsDeviceRecreateRendererForMultiSampleCountExt(graphics_device, multi_sample_count)" }
cna_occlusion_query_destroy = { result = "OcclusionQueryDestroy(occlusion_query)" }
