# Leaderboards routes, generated into src/generated/Leaderboards.inc,
# which src/CnaCApiLeaderboards.cpp includes. Format: docs/c-api/GENERATED_ROUTES.md.

[reader]
lookup = "BorrowReader"
object = "std::shared_ptr<LeaderboardReaderResource>"

[reader.routes]
cna_leaderboard_reader_destroy = { release = "object->value->Dispose()" }
cna_leaderboard_reader_page_down = { call = "object->value->PageDown()" }
cna_leaderboard_reader_page_up = { call = "object->value->PageUp()" }
cna_leaderboard_reader_get_identity = { result = "ToCIdentity(object->value->getLeaderboardIdentityProperty(), out_identity)" }
cna_leaderboard_reader_get_info = { versioned = true, get = '''
CNA_LeaderboardReaderInfo{
    sizeof(CNA_LeaderboardReaderInfo),
    StructureVersion,
    static_cast<int32_t>(object->value->getPageStartProperty()),
    static_cast<int32_t>(object->value->getTotalLeaderboardSizeProperty()),
    static_cast<int32_t>(object->value->getEntriesProperty().getCountProperty()),
    ToCBool(object->value->getIsDisposedProperty()),
    ToCBool(object->value->getCanPageDownProperty()),
    ToCBool(object->value->getCanPageUpProperty()),
    0U
}''' }

[entry]
lookup = "BorrowEntry"
object = "std::shared_ptr<LeaderboardEntryResource>"

[entry.routes]
cna_leaderboard_entry_destroy = { release = true }
cna_leaderboard_entry_set_rating = { call = "object->Value()->setRatingProperty(static_cast<long long>(rating))" }
cna_leaderboard_entry_get_info = { versioned = true, get = '''
CNA_LeaderboardEntryInfo{
    sizeof(CNA_LeaderboardEntryInfo),
    StructureVersion,
    static_cast<int32_t>(object->Value()->getRankingEXTProperty()),
    ToCBool(object->Value()->getGamerProperty() != nullptr),
    {0U, 0U, 0U},
    static_cast<int64_t>(object->Value()->getRatingProperty())
}''' }

[to_native_identity]
lookup = "ToNativeIdentity"
object = "LeaderboardIdentity"

[to_native_identity.routes]
cna_leaderboard_reader_read = { result = "ReadThroughOperation([&]() { return LeaderboardReader::BeginRead(object, static_cast<int>(page_start), static_cast<int>(page_size), System::AsyncCallback{}, std::any{}); }, out_reader)" }

[optional_gamer]
lookup = "BorrowOptionalGamer"
accepts_null_handle = true
object = "Gamer*"

[optional_gamer.routes]
cna_leaderboard_entry_create_ext = { result = "PublishOwnedEntry(LeaderboardEntry::CreateInternal(object, static_cast<long long>(rating), static_cast<int>(ranking)), out_entry)" }

[calls]
[calls.routes]
# Both canonical creation routes are this one: the overload without a game mode is this one
# with zero.
cna_leaderboard_identity_init = { result = "WriteCIdentity(LeaderboardIdentity::Create(static_cast<LeaderboardKey>(key), static_cast<int>(game_mode)), out_identity)", invalid_if = "key > CNA_LEADERBOARD_KEY_MAXIMUM" }
# Begin halves this ABI completes at once: the synchronous route, then the callback.
cna_leaderboard_reader_begin_read = { result = "CompleteAtOnce(cna_leaderboard_reader_read(identity, page_start, page_size, out_reader), callback, context)" }
cna_leaderboard_reader_begin_read_from_pivot = { result = "CompleteAtOnce(cna_leaderboard_reader_read_from_pivot(identity, pivot_gamer, page_size, out_reader), callback, context)" }
cna_leaderboard_reader_begin_read_from_gamers = { result = "CompleteAtOnce(cna_leaderboard_reader_read_from_gamers(identity, gamers, gamer_count, pivot_gamer, page_size, out_reader), callback, context)" }
cna_leaderboard_reader_begin_page_down = { result = "CompleteAtOnce(cna_leaderboard_reader_page_down(reader), callback, context)" }
cna_leaderboard_reader_begin_page_up = { result = "CompleteAtOnce(cna_leaderboard_reader_page_up(reader), callback, context)" }

[entry_pair]
lookup = "BorrowEntry"
object = "std::shared_ptr<LeaderboardEntryResource>"
other = { lookup = "BorrowEntry", object = "std::shared_ptr<LeaderboardEntryResource>" }

[entry_pair.routes]
# Both canonical equality operators are this one answer; inequality is its negation.
cna_leaderboard_entry_equals = { get = "*object->Value() == *other->Value()" }
