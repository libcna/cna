# Models routes, generated into src/generated/Models.inc,
# which src/CnaCApiModels.cpp includes. Format: docs/c-api/GENERATED_ROUTES.md.

[bone]
lookup = "GetBone"
object = "std::shared_ptr<BoneResource>"

[bone.routes]
cna_model_bone_get_name_byte_count = { size = "object->node->value->getNameProperty()" }
cna_model_bone_copy_name = { copy = "object->node->value->getNameProperty()" }
cna_model_bone_get_index = { get = "object->node->value->getIndexProperty()" }
cna_model_bone_get_transform = { get = "object->node->value->getTransformProperty()" }
cna_model_bone_set_transform = { call = "object->node->value->setTransformProperty(transform)" }
cna_model_bone_get_children = { result = "CreateCollectionHandle(std::make_shared<BoneCollectionResource>(BoneCollectionResource{nullptr, object->node}), out_children)" }
cna_model_bone_destroy = { release = true }

[collection]
lookup = "GetCollection"
object = "std::shared_ptr<BoneCollectionResource>"

[collection.routes]
cna_model_bone_collection_get_count = { get = "CollectionNodes(*object).size()" }
cna_model_bone_collection_destroy = { release = true }

[part]
lookup = "GetPart"
object = "std::shared_ptr<PartResource>"

[part.routes]
cna_model_mesh_part_get_sampler_state_ext = { invalid_if = "slot > CNA_PBR_TEXTURE_MAXIMUM", get = '''
ToCSamplerState(slot < CNA_PBR_TEXTURE_SPECULAR_EXT
    ? object->value->getSamplerStatesEXTProperty()[slot]
    : object->value->getSpecularSamplerStatesEXTProperty()[slot - CNA_PBR_TEXTURE_SPECULAR_EXT])''' }
cna_model_mesh_part_get_num_vertices = { get = "object->value->getNumVerticesProperty()" }
cna_model_mesh_part_get_primitive_count = { get = "object->value->getPrimitiveCountProperty()" }
cna_model_mesh_part_get_start_index = { get = "object->value->getStartIndexProperty()" }
cna_model_mesh_part_get_vertex_offset = { get = "object->value->getVertexOffsetProperty()" }
cna_model_mesh_part_set_tag = { call = "object->tag = tag" }
cna_model_mesh_part_get_primitive_type_ext = { get = "object->value->getPrimitiveTypeEXTProperty()" }
cna_model_mesh_part_get_tag = { get = "object->tag" }
cna_model_mesh_part_set_effect = { result = "SetPartEffect(object, effect)" }
cna_model_mesh_part_set_vertex_buffer = { result = "SetPartVertexBuffer(object, vertex_buffer)" }
cna_model_mesh_part_set_index_buffer = { result = "SetPartIndexBuffer(object, index_buffer)" }
cna_model_mesh_part_set_primitive_type_ext = { call = "object->value->setPrimitiveTypeEXTProperty(static_cast<PrimitiveType>(value))", invalid_if = "value > CNA_PRIMITIVE_POINT_LIST_EXT" }
cna_model_mesh_part_destroy = { release = true }

[part_collection]
lookup = "GetPartCollection"
object = "std::shared_ptr<PartCollectionResource>"

[part_collection.routes]
cna_model_mesh_part_collection_get_count = { get = "PartList(*object).size()" }
cna_model_mesh_part_collection_destroy = { release = true }

[mesh]
lookup = "GetMesh"
object = "std::shared_ptr<MeshResource>"

[mesh.routes]
cna_model_mesh_get_bounding_sphere = { get = "object->value->getBoundingSphereProperty()" }
cna_model_mesh_set_bounding_sphere = { call = "object->value->setBoundingSphereProperty(value)" }
cna_model_mesh_get_name_byte_count = { size = "object->value->getNameProperty()" }
cna_model_mesh_copy_name = { copy = "object->value->getNameProperty()" }
cna_model_mesh_set_tag = { call = "object->tag = tag" }
cna_model_mesh_get_tag = { get = "object->tag" }
cna_model_mesh_get_effects = { result = "CreateEffectCollectionHandle(std::move(object), out_effects)" }
cna_model_mesh_destroy = { release = true }
cna_model_mesh_draw = { call = "object->value->Draw()", require = 'NotSupportedIf(!object->supportsThreeD, "ModelMesh drawing requires a renderer with 3D support.")' }

[mesh_collection]
lookup = "GetMeshCollection"
object = "std::shared_ptr<MeshCollectionResource>"

[mesh_collection.routes]
cna_model_mesh_collection_get_count = { get = "object->meshes.size()" }
cna_model_mesh_collection_destroy = { release = true }
cna_model_mesh_collection_get_at = { result = "CreateMeshHandle(object->meshes[static_cast<std::size_t>(index)], out_mesh)", require = 'InvalidArgumentIf(index >= object->meshes.size(), "The ModelMeshCollection index is outside the valid range.")' }

[effect_collection]
lookup = "GetEffectCollection"
object = "std::shared_ptr<EffectCollectionResource>"

[effect_collection.routes]
cna_model_effect_collection_get_count = { get = "object->mesh->effects.size()" }
cna_model_effect_collection_destroy = { release = true }

[model]
lookup = "GetModel"
object = "std::shared_ptr<ModelResource>"

[model.routes]
cna_model_set_tag = { call = "object->tag = tag" }
cna_model_get_bone_transform_count = { get = "object->bones.size()" }
cna_model_get_camera_count_ext = { get = "object->value->getCamerasEXTProperty().size()" }
cna_model_clear_cameras_ext = { call = "object->value->setCamerasEXTProperty({})" }
cna_model_get_skin_count_ext = { get = "object->value->getSkinsEXTProperty().size()" }
cna_model_get_material_variant_count_ext = { get = "object->value->getMaterialVariantNamesEXTProperty().size()" }
cna_model_get_material_variant_ext = { get = "object->value->getMaterialVariantEXTProperty()" }
cna_model_set_material_variant_ext = { call = "object->value->setMaterialVariantEXTProperty(static_cast<int>(value))" }
cna_model_get_tag = { get = "object->tag" }
cna_model_draw = { call = "object->value->Draw(world, view, projection)", require = 'NotSupportedIf(!object->meshes.empty() && !object->supportsThreeD, "Model drawing requires a renderer with 3D support.")' }
cna_model_get_material_variant_name_byte_count_ext = { size = "object->value->getMaterialVariantNamesEXTProperty()[static_cast<std::size_t>(index)]", require = 'InvalidArgumentIf(index >= object->value->getMaterialVariantNamesEXTProperty().size(), "The Model material-variant index is outside the valid range.")' }
cna_model_copy_material_variant_name_ext = { copy = "object->value->getMaterialVariantNamesEXTProperty()[static_cast<std::size_t>(index)]", require = 'InvalidArgumentIf(index >= object->value->getMaterialVariantNamesEXTProperty().size(), "The Model material-variant index is outside the valid range.")' }

[morph_data]
lookup = "GetMorphData"
object = "std::shared_ptr<MorphDataResource>"

[morph_data.routes]
cna_morph_target_data_ext_get_type_name_byte_count = { size = "object->value->GetTypeName()" }
cna_morph_target_data_ext_get_stride = { get = "object->value->Stride" }
cna_morph_target_data_ext_get_base_vertex_byte_count = { get = "object->value->BaseVertexBytes.size()" }
cna_morph_target_data_ext_get_target_count = { get = "object->value->PositionDeltas.size()" }
cna_morph_target_data_ext_get_recompute_flat_normals_ext = { get = "object->value->RecomputeFlatNormalsEXT" }
cna_morph_target_data_ext_copy_weights = { result = "CopyOutputValues(object->value->Weights, destination, capacity, out_weight_count, [](const float value) noexcept { return value; }, \"The MorphTargetDataEXT weight output is invalid.\", \"The destination cannot hold all morph weights.\")" }
cna_morph_target_data_ext_copy_triangle_indices_ext = { result = "CopyOutputValues(object->value->TriangleIndicesEXT, destination, capacity, out_index_count, [](const std::uint32_t value) { return static_cast<uint32_t>(value); }, \"The MorphTargetDataEXT triangle-index output is invalid.\", \"The destination cannot hold all morph triangle indices.\")" }
cna_morph_target_data_ext_set_recompute_flat_normals_ext = { call = "object->value->RecomputeFlatNormalsEXT = recompute" }
cna_morph_target_data_ext_destroy = { release = true }
cna_morph_target_data_ext_copy_base_vertex_bytes = { copy = "object->value->BaseVertexBytes" }
cna_morph_target_data_ext_copy_type_name = { copy = "object->value->GetTypeName()" }
cna_morph_target_data_ext_copy_position_deltas = { result = "CopyOutputValues(object->value->PositionDeltas[static_cast<std::size_t>(target_index)], destination, capacity, out_delta_count, ToCVector3, \"The MorphTargetDataEXT position-delta output is invalid.\", \"The destination cannot hold all morph position deltas.\")", require = 'InvalidArgumentIf(target_index >= object->value->PositionDeltas.size(), "The MorphTargetDataEXT target index is outside the valid range.")' }
cna_morph_target_data_ext_copy_normal_deltas = { result = "CopyOutputValues(object->value->NormalDeltas[static_cast<std::size_t>(target_index)], destination, capacity, out_delta_count, ToCVector3, \"The MorphTargetDataEXT normal-delta output is invalid.\", \"The destination cannot hold all morph normal deltas.\")", require = 'InvalidArgumentIf(target_index >= object->value->NormalDeltas.size(), "The MorphTargetDataEXT target index is outside the valid range.")' }

[skinned_model]
lookup = "GetSkinnedModel"
object = "std::shared_ptr<SkinnedModelResource>"

[skinned_model.routes]
cna_skinned_model_ext_get_bone_count = { get = "object->value->BoneCount" }
cna_skinned_model_ext_get_clip_count = { get = "object->value->Clips.size()" }
cna_skinned_model_ext_get_part_count = { get = "object->parts.size()" }
cna_skinned_model_ext_copy_parent_bone_indices = { result = "CopyOutputValues(object->value->ParentBoneIndices, destination, capacity, out_count, [](const int value) noexcept { return static_cast<int32_t>(value); }, \"The SkinnedModelEXT parent-index output is invalid.\", \"The destination cannot hold all SkinnedModelEXT parent indices.\")" }
cna_skinned_model_ext_copy_bind_pose_local = { result = "CopyOutputValues(object->value->BindPoseLocal, destination, capacity, out_count, [](const Matrix value) noexcept { return ToC(value); }, \"The SkinnedModelEXT bind-pose output is invalid.\", \"The destination cannot hold all SkinnedModelEXT bind-pose matrices.\")" }
cna_skinned_model_ext_copy_inverse_bind_pose_global = { result = "CopyOutputValues(object->value->InverseBindPoseGlobal, destination, capacity, out_count, [](const Matrix value) noexcept { return ToC(value); }, \"The SkinnedModelEXT inverse-bind-pose output is invalid.\", \"The destination cannot hold all SkinnedModelEXT inverse-bind-pose matrices.\")" }
cna_skinned_model_ext_remove_clip = { call = "object->value->Clips.erase(name)", refuse_nul = ["name"] }
cna_skinned_model_ext_destroy = { release = true }
cna_skinned_model_ext_get_part_name_byte_count_at = { size = "object->parts[static_cast<std::size_t>(part_index)].name", require = 'InvalidArgumentIf(part_index >= object->parts.size(), "The SkinnedModelEXT part index is outside the valid range.")' }
cna_skinned_model_ext_copy_part_name_at = { copy = "object->parts[static_cast<std::size_t>(part_index)].name", require = 'InvalidArgumentIf(part_index >= object->parts.size(), "The SkinnedModelEXT part index is outside the valid range.")' }
cna_skinned_model_ext_get_part_diffuse_color_at = { get = "object->parts[static_cast<std::size_t>(part_index)].diffuseColor", require = 'InvalidArgumentIf(part_index >= object->parts.size(), "The SkinnedModelEXT part index is outside the valid range.")' }
cna_skinned_model_ext_set_part_diffuse_color_at = { call = "SetSkinnedPartDiffuseColor(*object, part_index, color)", require = 'InvalidArgumentIf(part_index >= object->parts.size(), "The SkinnedModelEXT part index is outside the valid range.")' }

[skinning_data]
lookup = "GetSkinningData"
object = "std::shared_ptr<SkinningDataResource>"

[skinning_data.routes]
cna_skinning_data_get_type_name_byte_count = { size = "object->value->GetTypeName()" }
cna_skinning_data_copy_type_name = { copy = "object->value->GetTypeName()" }
cna_skinning_data_get_bone_count = { get = "object->value->BoneCount" }
cna_skinning_data_get_clip_count = { get = "object->value->AnimationClips.size()" }
cna_skinning_data_get_skeleton_root_node_index_ext = { get = "object->value->SkeletonRootNodeIndexEXT" }
cna_skinning_data_set_skeleton_root_node_index_ext = { call = "object->value->SkeletonRootNodeIndexEXT = static_cast<int>(value)" }
cna_skinning_data_get_skeleton_root_name_byte_count_ext = { size = "object->value->SkeletonRootNameEXT" }
cna_skinning_data_copy_skeleton_root_name_ext = { copy = "object->value->SkeletonRootNameEXT" }
cna_skinning_data_copy_skeleton_hierarchy = { result = "CopyOutputValues(object->value->SkeletonHierarchy, destination, capacity, out_count, [](const int value) noexcept { return static_cast<int32_t>(value); }, \"The SkinningData hierarchy output is invalid.\", \"The destination cannot hold the complete SkinningData hierarchy.\")" }
cna_skinning_data_copy_bind_pose = { result = "CopyOutputValues(object->value->BindPose, destination, capacity, out_count, [](const Matrix value) noexcept { return ToC(value); }, \"The SkinningData bind-pose output is invalid.\", \"The destination cannot hold all SkinningData bind-pose matrices.\")" }
cna_skinning_data_copy_inverse_bind_pose = { result = "CopyOutputValues(object->value->InverseBindPose, destination, capacity, out_count, [](const Matrix value) noexcept { return ToC(value); }, \"The SkinningData inverse-bind-pose output is invalid.\", \"The destination cannot hold all SkinningData inverse-bind-pose matrices.\")" }
cna_skinning_data_copy_skeleton_root_prefix = { result = "CopyOutputValues(object->value->SkeletonRootPrefix, destination, capacity, out_count, [](const Matrix value) noexcept { return ToC(value); }, \"The SkinningData root-prefix output is invalid.\", \"The destination cannot hold all SkinningData root-prefix matrices.\")" }
cna_skinning_data_set_skeleton_root_name_ext = { call = "object->value->SkeletonRootNameEXT = std::move(name)", refuse_nul = ["name"] }
cna_skinning_data_destroy = { release = true }

[animation_player]
lookup = "GetAnimationPlayer"
object = "std::shared_ptr<AnimationPlayerResource>"

[animation_player.routes]
cna_animation_player_get_current_position = { get = "object->value->getCurrentPositionProperty().getTotalSecondsProperty()" }
cna_animation_player_get_current_clip_name_byte_count = { size = "object->currentClipName" }
cna_animation_player_copy_current_clip_name = { copy = "object->currentClipName" }
cna_animation_player_copy_bone_transforms = { result = "CopyOutputValues(object->value->GetBoneTransforms(), destination, capacity, out_count, [](const Matrix value) noexcept { return ToC(value); }, \"The AnimationPlayer bone-transform output is invalid.\", \"The destination cannot hold all AnimationPlayer bone transforms.\")" }
cna_animation_player_copy_world_transforms = { result = "CopyOutputValues(object->value->GetWorldTransforms(), destination, capacity, out_count, [](const Matrix value) noexcept { return ToC(value); }, \"The AnimationPlayer world-transform output is invalid.\", \"The destination cannot hold all AnimationPlayer world transforms.\")" }
cna_animation_player_copy_skin_transforms = { result = "CopyOutputValues(object->value->GetSkinTransforms(), destination, capacity, out_count, [](const Matrix value) noexcept { return ToC(value); }, \"The AnimationPlayer skin-transform output is invalid.\", \"The destination cannot hold all AnimationPlayer skin transforms.\")" }
cna_animation_player_destroy = { release = true }

[model_animations]
lookup = "GetModelAnimations"
object = "std::shared_ptr<ModelAnimationsResource>"

[model_animations.routes]
cna_model_animations_ext_get_type_name_byte_count = { size = "object->value->GetTypeName()" }
cna_model_animations_ext_copy_type_name = { copy = "object->value->GetTypeName()" }
cna_model_animations_ext_get_clip_count = { get = "object->value->Clips.size()" }
cna_model_animations_ext_destroy = { release = true }

[calls]
[calls.routes]
cna_model_bone_collection_create = { result = "CreateCollectionHandle(std::make_shared<BoneCollectionResource>(BoneCollectionResource{ std::make_shared<ModelBoneCollection>(), nullptr}), out_collection)" }
cna_model_mesh_part_create_default = { result = "CreatePartHandle(std::make_shared<PartResource>(), out_part)" }
cna_model_mesh_create = { result = "CreateMesh(graphics_device, std::string{}, false, parts, part_count, out_mesh)" }
cna_model_create = { result = "CreateModel(graphics_device, bones, bone_count, meshes, mesh_count, nullptr, 0U, 0U, false, out_model)" }
cna_model_create_with_parents = { result = "CreateModel(graphics_device, bones, bone_count, meshes, mesh_count, mesh_parents, mesh_parent_count, root_bone_index, true, out_model)" }
cna_model_get_gltf_import_diagnostic_code_byte_count_ext = { result = "GetDiagnosticStringByteCount(model, index, out_byte_count, SelectCode)" }
cna_model_get_gltf_import_diagnostic_subject_byte_count_ext = { result = "GetDiagnosticStringByteCount(model, index, out_byte_count, SelectSubject)" }
cna_model_get_gltf_import_diagnostic_message_byte_count_ext = { result = "GetDiagnosticStringByteCount(model, index, out_byte_count, SelectMessage)" }
cna_skinned_model_ext_create_default = { result = "CreateSkinnedModelHandle(std::make_shared<SkinnedModelResource>(), out_model)" }

[matrix]
[matrix.routes]
cna_matrix_create_infinite_perspective_field_of_view_ext = { value = "Microsoft::Xna::Framework::Graphics::CreateInfinitePerspectiveFieldOfViewEXT(field_of_view, aspect_ratio, near_plane_distance)" }

[import_diagnostic]
lookup = "GetImportDiagnostic"
object = "const GltfImportDiagnosticEXT*"
owner = "std::shared_ptr<ModelResource>"
arguments = 2

[import_diagnostic.routes]
cna_model_copy_gltf_import_diagnostic_code_ext = { copy = "object->Code" }
cna_model_copy_gltf_import_diagnostic_subject_ext = { copy = "object->Subject" }
cna_model_copy_gltf_import_diagnostic_message_ext = { copy = "object->Message" }
cna_model_get_gltf_import_diagnostic_detail_byte_count_ext = { size = "object->Details[static_cast<std::size_t>(detail_index)]", require = 'InvalidArgumentIf(detail_index >= object->Details.size(), "The glTF import diagnostic detail index is outside the valid range.")' }
cna_model_copy_gltf_import_diagnostic_detail_ext = { copy = "object->Details[static_cast<std::size_t>(detail_index)]", require = 'InvalidArgumentIf(detail_index >= object->Details.size(), "The glTF import diagnostic detail index is outside the valid range.")' }

[model_camera]
lookup = "GetModelCamera"
object = "const ModelCameraEXT*"
owner = "std::shared_ptr<ModelResource>"
arguments = 2

[model_camera.routes]
cna_model_get_camera_name_byte_count_ext = { size = "object->Name" }
cna_model_copy_camera_name_ext = { copy = "object->Name" }

[model_skin]
lookup = "GetModelSkin"
object = "const ModelSkinEXT*"
owner = "std::shared_ptr<ModelResource>"
arguments = 2

[model_skin.routes]
cna_model_get_skin_name_byte_count_ext = { size = "object->Name" }
cna_model_copy_skin_name_ext = { copy = "object->Name" }

[collection_and_bone]
lookup = "GetCollection"
object = "std::shared_ptr<BoneCollectionResource>"
other = { lookup = "GetBone", object = "std::shared_ptr<BoneResource>" }

[collection_and_bone.routes]
cna_model_bone_collection_contains = { get = "std::find(CollectionNodes(*object).begin(), CollectionNodes(*object).end(), other->node) != CollectionNodes(*object).end()" }

[mesh_collection_and_mesh]
lookup = "GetMeshCollection"
object = "std::shared_ptr<MeshCollectionResource>"
other = { lookup = "GetMesh", object = "std::shared_ptr<MeshResource>" }

[mesh_collection_and_mesh.routes]
cna_model_mesh_collection_contains = { get = "std::find(object->meshes.begin(), object->meshes.end(), other) != object->meshes.end()" }

[effect_collection_and_effect]
lookup = "GetEffectCollection"
object = "std::shared_ptr<EffectCollectionResource>"
other = { lookup = "ResolveEffect", object = "std::shared_ptr<EffectResource>" }

[effect_collection_and_effect.routes]
cna_model_effect_collection_contains = { get = "FindMeshEffect(*object->mesh, effect) != object->mesh->effects.end()" }

[model_and_skinning_data]
lookup = "GetModel"
object = "std::shared_ptr<ModelResource>"
other = { lookup = "GetSkinningData", object = "std::shared_ptr<SkinningDataResource>" }

[model_and_skinning_data.routes]
cna_model_apply_bind_pose_bone_transforms_ext = { get = "ApplyBindPoseBoneTransformsEXT(*object->value, *other->value)" }

# The routes whose logic is a hand-written helper of the same name, in CamelCase. The
# generated half refuses null out_* outputs, clears handle outputs and checks CNA_Bool
# inputs first; C structures and text reach the helper as the caller passed them.
[helpers]
raw = true

[helpers.routes]
cna_model_bone_create_default = { result = "ModelBoneCreateDefault(out_bone)" }
cna_model_bone_create = { result = "ModelBoneCreate(index, name, out_bone)" }
cna_model_bone_get_parent = { result = "ModelBoneGetParent(bone, out_has_parent, out_parent)" }
cna_model_bone_collection_get_at = { result = "ModelBoneCollectionGetAt(collection, index, out_bone)" }
cna_model_bone_collection_find = { result = "ModelBoneCollectionFind(collection, name, out_found, out_bone)" }
cna_model_mesh_part_create = { result = "ModelMeshPartCreate(vertex_buffer, index_buffer, num_vertices, primitive_count, start_index, vertex_offset, out_part)" }
cna_model_mesh_part_get_effect = { result = "ModelMeshPartGetEffect(part, out_has_effect, out_effect)" }
cna_model_mesh_part_get_vertex_buffer = { result = "ModelMeshPartGetVertexBuffer(part, out_has_buffer, out_buffer)" }
cna_model_mesh_part_get_index_buffer = { result = "ModelMeshPartGetIndexBuffer(part, out_has_buffer, out_buffer)" }
cna_model_mesh_part_collection_create = { result = "ModelMeshPartCollectionCreate(parts, part_count, out_collection)" }
cna_model_mesh_part_collection_get_at = { result = "ModelMeshPartCollectionGetAt(collection, index, out_part)" }
cna_model_mesh_create_named = { result = "ModelMeshCreateNamed(graphics_device, name, parts, part_count, out_mesh)" }
cna_model_mesh_get_mesh_parts = { result = "ModelMeshGetMeshParts(mesh, out_parts)" }
cna_model_mesh_get_parent_bone = { result = "ModelMeshGetParentBone(mesh, out_has_parent, out_parent)" }
cna_model_mesh_collection_create = { result = "ModelMeshCollectionCreate(meshes, mesh_count, out_collection)" }
cna_model_mesh_collection_find = { result = "ModelMeshCollectionFind(collection, name, out_found, out_mesh)" }
cna_model_effect_collection_get_at = { result = "ModelEffectCollectionGetAt(collection, index, out_effect)" }
cna_model_create_default = { result = "ModelCreateDefault(out_model)" }
cna_model_get_bones = { result = "ModelGetBones(model, out_bones)" }
cna_model_get_meshes = { result = "ModelGetMeshes(model, out_meshes)" }
cna_model_get_root = { result = "ModelGetRoot(model, out_has_root, out_root)" }
cna_model_copy_absolute_bone_transforms = { result = "ModelCopyAbsoluteBoneTransforms(model, destination, capacity, out_count)" }
cna_model_copy_bone_transforms = { result = "ModelCopyBoneTransforms(model, destination, capacity, out_count)" }
cna_morph_target_data_ext_create = { result = "MorphTargetDataExtCreate(descriptor, out_data)" }
cna_morph_target_data_ext_get_weight_track_info = { result = "MorphTargetDataExtGetWeightTrackInfo(data, out_keyframe_count, out_step_interpolation, out_cubic_spline)" }
cna_morph_target_data_ext_blend = { result = "MorphTargetDataExtBlend(data, weights, weight_count, destination, capacity, out_byte_count)" }
cna_morph_weight_track_ext_evaluate = { result = "MorphWeightTrackExtEvaluate(track, time_seconds, destination, capacity, out_weight_count)" }
cna_model_mesh_part_get_morph_target_data_ext = { result = "ModelMeshPartGetMorphTargetDataExt(part, out_has_data, out_data)" }
cna_skinned_model_ext_create = { result = "SkinnedModelExtCreate(descriptor, out_model)" }
cna_skinned_model_ext_create_move = { result = "SkinnedModelExtCreateMove(source, out_model)" }
cna_skinned_model_ext_get_clip_name_byte_count_at = { result = "SkinnedModelExtGetClipNameByteCountAt(model, clip_index, out_byte_count)" }
cna_skinned_model_ext_get_clip_info = { result = "SkinnedModelExtGetClipInfo(model, name, out_found, out_duration_seconds, out_track_count)" }
cna_skinned_model_ext_copy_clip_track = { result = "SkinnedModelExtCopyClipTrack(model, name, track_index, out_bone_index, destination, capacity, out_keyframe_count)" }
cna_skinned_model_ext_compute_bone_transforms = { result = "SkinnedModelExtComputeBoneTransforms(model, clip_name, position_seconds, loop, destination, capacity, out_bone_count)" }
cna_skinned_model_ext_get_part_at = { result = "SkinnedModelExtGetPartAt(model, part_index, out_part, out_has_texture, out_texture)" }
cna_skinned_model_ext_get_owned_resource_counts = { result = "SkinnedModelExtGetOwnedResourceCounts(model, out_vertex_buffers, out_index_buffers, out_parts, out_textures)" }
