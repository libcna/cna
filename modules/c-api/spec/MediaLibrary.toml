# MediaLibrary routes, generated into src/generated/MediaLibrary.inc,
# which src/CnaCApiMediaLibrary.cpp includes. Format: docs/c-api/GENERATED_ROUTES.md.

[album]
lookup = "Borrow<Album>"
object = "std::shared_ptr<MediaChildResource<Album>>"

[album.routes]
cna_album_dispose = { call = "object->value->Dispose()" }
cna_album_get_name_size = { size = "object->value->getNameProperty()" }
# The canonical string conversion returns the name unchanged, so one route is both.
cna_album_copy_name = { copy = "object->value->ToString()" }
cna_album_get_is_disposed = { get = "object->value->getIsDisposedProperty()" }
cna_album_get_hash_code = { get = "object->value->GetHashCode()" }
cna_album_get_type_name_size = { size = "object->value->GetTypeName()" }
cna_album_copy_type_name = { copy = "object->value->GetTypeName()" }
cna_album_get_duration = { get = "object->value->getDurationProperty().getTicksProperty()" }
cna_album_get_has_art = { get = "object->value->getHasArtProperty()" }

