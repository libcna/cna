# Net routes, generated into src/generated/Net.inc,
# which src/CnaCApiNet.cpp includes. Format: docs/c-api/GENERATED_ROUTES.md.

[properties]
lookup = "GetProperties"
object = "std::shared_ptr<NetworkSessionPropertiesResource>"

[properties.routes]
cna_network_session_properties_get_count = { get = "object->value->getCountProperty()" }
cna_network_session_properties_get_is_read_only = { get = "object->value->getIsReadOnlyProperty()" }
cna_network_session_properties_remove_at = { call = "object->value->RemoveAt(static_cast<int>(index))" }
cna_network_session_properties_clear = { call = "object->value->Clear()" }
cna_network_session_properties_destroy = { release = true, require = 'InvalidStateIf(object->activeEnumerators != 0U, "Every enumerator over this property list must be destroyed first.")' }

[reader]
lookup = "GetReader"
object = "std::shared_ptr<PacketReaderResource>"

[reader.routes]
cna_packet_reader_set_position = { call = "object->value->setPositionProperty(static_cast<int>(position))" }
cna_packet_reader_get_length = { get = "object->value->getLengthProperty()" }
cna_packet_reader_get_position = { get = "object->value->getPositionProperty()" }
cna_packet_reader_read_single = { get = "object->value->ReadSingle()" }
cna_packet_reader_read_double = { get = "object->value->ReadDouble()" }
cna_packet_reader_read_color = { get = "object->value->ReadColor()" }
cna_packet_reader_read_matrix = { get = "object->value->ReadMatrix()" }
cna_packet_reader_read_quaternion = { get = "object->value->ReadQuaternion()" }
cna_packet_reader_read_vector2 = { get = "object->value->ReadVector2()" }
cna_packet_reader_read_vector3 = { get = "object->value->ReadVector3()" }
cna_packet_reader_read_vector4 = { get = "object->value->ReadVector4()" }
cna_packet_reader_destroy = { release = true }

[writer]
lookup = "GetWriter"
object = "std::shared_ptr<PacketWriterResource>"

[writer.routes]
cna_packet_writer_get_length = { get = "object->value->getLengthProperty()" }
cna_packet_writer_get_position = { get = "object->value->getPositionProperty()" }
cna_packet_writer_set_position = { call = "object->value->setPositionProperty(static_cast<int>(position))" }
cna_packet_writer_write_matrix = { call = "object->value->Write(value)" }
cna_packet_writer_write_single = { call = "object->value->Write(value)" }
cna_packet_writer_write_double = { call = "object->value->Write(value)" }
cna_packet_writer_write_color = { call = "object->value->Write(value)" }
cna_packet_writer_write_quaternion = { call = "object->value->Write(value)" }
cna_packet_writer_write_vector2 = { call = "object->value->Write(value)" }
cna_packet_writer_write_vector3 = { call = "object->value->Write(value)" }
cna_packet_writer_write_vector4 = { call = "object->value->Write(value)" }
cna_packet_writer_destroy = { release = true }

[calls]
[calls.routes]
cna_quality_of_service_init = { result = "StoreQualityOfService(QualityOfService::CreateInternal(), out_value)" }
cna_quality_of_service_init_measured = { result = "StoreQualityOfService(QualityOfService::CreateInternal(System::TimeSpan(roundtrip_ticks)), out_value)" }
cna_network_session_properties_create = { result = "CreateResourceHandle<NetworkSessionPropertiesResource>(ObjectKind::NetworkSessionProperties, std::make_unique<NetworkSessionProperties>(), out_properties)" }
cna_packet_writer_create = { result = "CreateResourceHandle<PacketWriterResource>(ObjectKind::PacketWriter, std::make_unique<PacketWriter>(static_cast<int>(capacity)), out_writer)" }
cna_packet_reader_create = { result = "CreateResourceHandle<PacketReaderResource>(ObjectKind::PacketReader, std::make_unique<PacketReader>(static_cast<int>(capacity)), out_reader)" }

[enumerator]
lookup = "GetEnumerator"
object = "std::shared_ptr<PropertyEnumeratorResource>"

[enumerator.routes]
cna_network_session_property_enumerator_destroy = { release = true }

# The routes whose logic is a hand-written helper of the same name, in CamelCase. The
# generated half refuses null out_* outputs, clears handle outputs and checks CNA_Bool
# inputs first; C structures and text reach the helper as the caller passed them.
[helpers]
raw = true

[helpers.routes]
cna_net_get_last_join_error = { result = "NetGetLastJoinError(out_join_error, out_has_join_error)" }
cna_network_session_properties_get_item = { result = "NetworkSessionPropertiesGetItem(properties, index, out_value)" }
cna_network_session_properties_index_of = { result = "NetworkSessionPropertiesIndexOf(properties, value, out_index)" }
cna_network_session_properties_remove = { result = "NetworkSessionPropertiesRemove(properties, value, out_removed)" }
cna_network_session_properties_contains = { result = "NetworkSessionPropertiesContains(properties, value, out_contains)" }
cna_network_session_properties_copy_to = { result = "NetworkSessionPropertiesCopyTo(properties, destination, capacity, index, out_count)" }
cna_network_session_properties_create_enumerator = { result = "NetworkSessionPropertiesCreateEnumerator(properties, out_enumerator)" }
cna_network_session_property_enumerator_move_next = { result = "NetworkSessionPropertyEnumeratorMoveNext(enumerator, out_has_current)" }
cna_network_session_property_enumerator_get_current = { result = "NetworkSessionPropertyEnumeratorGetCurrent(enumerator, out_value)" }
cna_packet_writer_copy_data_ext = { result = "PacketWriterCopyDataExt(writer, destination, capacity, out_bytes)" }
cna_packet_reader_copy_data_ext = { result = "PacketReaderCopyDataExt(reader, destination, capacity, out_bytes)" }
cna_network_session_properties_set_item = { result = "NetworkSessionPropertiesSetItem(properties, index, value)" }
cna_network_session_properties_insert = { result = "NetworkSessionPropertiesInsert(properties, index, value)" }
cna_network_session_properties_add = { result = "NetworkSessionPropertiesAdd(properties, value)" }
cna_network_session_property_enumerator_reset = { result = "NetworkSessionPropertyEnumeratorReset(enumerator)" }
cna_packet_reader_set_data_ext = { result = "PacketReaderSetDataExt(reader, data, count)" }
