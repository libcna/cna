# Net routes, generated into src/generated/Net.inc,
# which src/CnaCApiNet.cpp includes. Format: docs/c-api/GENERATED_ROUTES.md.

[properties]
lookup = "GetProperties"
object = "std::shared_ptr<NetworkSessionPropertiesResource>"

[properties.routes]
cna_network_session_properties_get_count = { get = "object->value->getCountProperty()" }
cna_network_session_properties_get_is_read_only = { get = "object->value->getIsReadOnlyProperty()" }
cna_network_session_properties_remove_at = { call = "object->value->RemoveAt(static_cast<int>(index))" }
cna_network_session_properties_clear = { call = "object->value->Clear()" }

[reader]
lookup = "GetReader"
object = "std::shared_ptr<PacketReaderResource>"

[reader.routes]
cna_packet_reader_set_position = { call = "object->value->setPositionProperty(static_cast<int>(position))" }
