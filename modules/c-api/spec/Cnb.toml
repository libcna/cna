cna_cnb_cnj_result_get_asset_type_id = { get = "object->value->assetTypeId" }
cna_cnb_cnj_result_get_asset_type_name_size = { size = "object->value->assetTypeName" }
cna_cnb_cnj_result_get_absorbed_file_count = { get = "object->value->absorbedFiles.size()" }
cna_cnb_cnj_result_get_external_reference_count = { get = "object->value->externalReferences.size()" }
cna_cnb_cnj_result_get_absorbed_file_size = { size = "object->value->absorbedFiles[static_cast<std::size_t>(index)]", require = 'RequireIndex(index, object->value->absorbedFiles.size(), "The absorbed-file index is out of range.")' }
