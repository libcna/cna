cna_cnb_cnj_result_get_external_reference_size = { size = "object->value->externalReferences[static_cast<std::size_t>(index)]", require = 'RequireIndex(index, object->value->externalReferences.size(), "The external-reference index is out of range.")' }
cna_cnb_cnj_result_copy_external_reference = { copy = "object->value->externalReferences[static_cast<std::size_t>(index)]", require = 'RequireIndex(index, object->value->externalReferences.size(), "The external-reference index is out of range.")' }
cna_cnb_cnj_result_copy_bytes = { copy = "object->value->bytes" }

