cna_cnb_checked_multiply = { result = "CnbCheckedMultiply(a, b, out_product)" }
cna_cnb_crc32c_continue = { result = "CnbCrc32cContinue(previous, data, byte_count, out_checksum)" }
cna_cnb_get_compressed_byte_count = { result = "CnbGetCompressedByteCount(raw, raw_byte_count, codec, level, out_byte_count)" }
cna_cnb_copy_compressed = { result = "CnbCopyCompressed(raw, raw_byte_count, codec, level, destination, capacity, out_byte_count)" }
cna_cnb_copy_decompressed = { result = "CnbCopyDecompressed(stored, stored_byte_count, codec, uncompressed_size, max_uncompressed_size, destination, capacity, out_byte_count)" }
cna_cnb_chunk_entry_is_mandatory = { result = "CnbChunkEntryIsMandatory(entry, out_mandatory)" }
cna_cnb_document_parse = { result = "CnbDocumentParse(bytes, byte_count, origin, limits, out_document)" }
cna_cnb_document_parse_file = { result = "CnbDocumentParseFile(path, limits, out_document)" }
