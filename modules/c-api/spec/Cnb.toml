[loader]
lookup = "GetLoader"
object = "std::shared_ptr<CnbLoaderResource>"

[loader.routes]
cna_cnb_loader_destroy = { release = true }

[calls]
[calls.routes]
cna_cnb_get_chunk_id_string_size = { result = "ReportTextSize(Cnb::ChunkIdToString(Cnb::CnbChunkId{id}), out_byte_count)" }
cna_cnb_copy_chunk_id_string = { result = "CopyText(Cnb::ChunkIdToString(Cnb::CnbChunkId{id}), destination, capacity, out_byte_count)" }
cna_cnb_get_asset_type_name_size = { result = "ReportTextSize(Cnb::AssetTypeIdToString(asset_type_id), out_byte_count)" }
cna_cnb_copy_asset_type_name = { result = "CopyText(Cnb::AssetTypeIdToString(asset_type_id), destination, capacity, out_byte_count)" }
cna_cnb_get_compression_name_size = { result = "ReportTextSize(Cnb::CnbCompressionToString(ToCodec(codec)), out_byte_count)" }
cna_cnb_copy_compression_name = { result = "CopyText(Cnb::CnbCompressionToString(ToCodec(codec)), destination, capacity, out_byte_count)" }
cna_cnb_get_texture_format_name_size = { result = "ReportTextSize(Cnb::CnbTextureFormatToString(ToTextureFormat(format)), out_byte_count)" }
cna_cnb_copy_texture_format_name = { result = "CopyText(Cnb::CnbTextureFormatToString(ToTextureFormat(format)), destination, capacity, out_byte_count)" }
cna_cnb_encode_texture2d = { result = "EncodeTexture(texture, content_name, &Cnb::EncodeTexture2DToCnb, destination, capacity, out_byte_count)" }
cna_cnb_encode_texture_cube = { result = "EncodeTexture(texture, content_name, &Cnb::EncodeTextureCubeToCnb, destination, capacity, out_byte_count)" }
cna_cnb_encode_texture3d = { result = "EncodeTexture(texture, content_name, &Cnb::EncodeTexture3DToCnb, destination, capacity, out_byte_count)" }
cna_cnb_decode_texture2d = { result = "DecodeTexture(document, &Cnb::DecodeTexture2DFromCnb, out_texture)" }
cna_cnb_decode_texture_cube = { result = "DecodeTexture(document, &Cnb::DecodeTextureCubeFromCnb, out_texture)" }
cna_cnb_decode_texture3d = { result = "DecodeTexture(document, &Cnb::DecodeTexture3DFromCnb, out_texture)" }
cna_cnb_model_create = { result = "CreateModel(Cnb::CnbModelData{}, out_model)" }
cna_cnb_sprite_font_data_create = { result = "CreateSpriteFont(Cnb::CnbSpriteFontData{}, out_font)" }
cna_cnb_get_audio_format_name_size = { result = "ReportTextSize(Cnb::CnbAudioFormatToString(static_cast<Cnb::CnbAudioFormat>(format)), out_byte_count)" }
cna_cnb_copy_audio_format_name = { result = "CopyText(Cnb::CnbAudioFormatToString(static_cast<Cnb::CnbAudioFormat>(format)), destination, capacity, out_byte_count)" }
cna_cnb_loader_registry_get_registered_type_name_size = { result = "ReportTextSize(CNA::Content::CnbLoaderRegistry::RegisteredTypeName(asset_type_id), out_byte_count)" }
cna_cnb_loader_registry_copy_registered_type_name = { result = "CopyText(CNA::Content::CnbLoaderRegistry::RegisteredTypeName(asset_type_id), destination, capacity, out_byte_count)" }

[bytes]
lookup = "BorrowBytes"
object = "std::span<const uint8_t>"
arguments = 2

[bytes.routes]
cna_cnb_crc32c = { get = "Cnb::Crc32c(object)" }
cna_cnb_crc32c_portable = { get = "Cnb::Crc32cPortableEXT(object)" }
cna_cnb_has_magic = { get = "Cnb::CnbDocument::HasMagic(object)" }

[text]
lookup = "BorrowText"
object = "std::string"

[text.routes]
cna_cnb_import_dds_as_texture_cube = { result = "CreateTextureData(Cnb::ImportDdsAsCnbTextureCube(object), out_texture)" }
cna_cnb_import_wav_as_sound_effect = { result = "CreateSoundEffect(Cnb::ImportWavAsCnbSoundEffect(object), out_sound)" }
