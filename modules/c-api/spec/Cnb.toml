cna_cnb_model_get_bone_name_size = { size = "object->value->bones[static_cast<std::size_t>(index)].name", require = 'RequireIndex(index, object->value->bones.size(), "The bone index is out of range.")' }
cna_cnb_model_copy_bone_name = { copy = "object->value->bones[static_cast<std::size_t>(index)].name", require = 'RequireIndex(index, object->value->bones.size(), "The bone index is out of range.")' }
cna_cnb_model_get_mesh_name_size = { size = "object->value->meshes[static_cast<std::size_t>(index)].name", require = 'RequireIndex(index, object->value->meshes.size(), "The mesh index is out of range.")' }
cna_cnb_model_copy_mesh_name = { copy = "object->value->meshes[static_cast<std::size_t>(index)].name", require = 'RequireIndex(index, object->value->meshes.size(), "The mesh index is out of range.")' }
cna_cnb_model_get_animation_name_size = { size = "object->value->animations[static_cast<std::size_t>(index)].name", require = 'RequireIndex(index, object->value->animations.size(), "The animation index is out of range.")' }
cna_cnb_model_copy_animation_name = { copy = "object->value->animations[static_cast<std::size_t>(index)].name", require = 'RequireIndex(index, object->value->animations.size(), "The animation index is out of range.")' }

