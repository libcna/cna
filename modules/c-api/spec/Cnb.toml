# Cnb routes, generated into src/generated/Cnb.inc,
# which src/CnaCApiCnb.cpp includes. Format: docs/c-api/GENERATED_ROUTES.md.

[document]
lookup = "GetDocument"
object = "std::shared_ptr<CnbDocumentResource>"

[document.routes]
cna_cnb_document_copy_origin = { copy = "object->value->Origin()" }
cna_cnb_document_copy_metadata_asset_type_name = { copy = "object->value->Metadata().assetTypeName" }
cna_cnb_document_copy_metadata_content_name = { copy = "object->value->Metadata().contentName" }
cna_cnb_document_require_asset = { call = "object->value->RequireAsset(expected_asset_type_id, max_schema_version)" }
cna_cnb_decode_song_stream_reference = { copy = "Cnb::DecodeSongFromCnb(*object->value).streamReference" }
cna_cnb_decode_song_name = { copy = "Cnb::DecodeSongFromCnb(*object->value).name" }
cna_cnb_decode_video_stream_reference = { copy = "Cnb::DecodeVideoFromCnb(*object->value).streamReference" }
cna_cnb_document_get_origin_size = { size = "object->value->Origin()" }
cna_cnb_document_get_container_major = { get = "object->value->ContainerMajor()" }
cna_cnb_document_get_container_minor = { get = "object->value->ContainerMinor()" }
cna_cnb_document_get_asset_type_id = { get = "object->value->AssetTypeId()" }
cna_cnb_document_get_asset_schema_version = { get = "object->value->AssetSchemaVersion()" }
cna_cnb_document_get_chunk_count = { get = "object->value->ChunkCount()" }
cna_cnb_document_require_single = { get = "object->value->RequireSingle(Cnb::CnbChunkId{type})" }
cna_cnb_document_get_metadata_asset_type_name_size = { size = "object->value->Metadata().assetTypeName" }
cna_cnb_document_get_metadata_content_name_size = { size = "object->value->Metadata().contentName" }
cna_cnb_document_get_external_reference_count = { get = "object->value->ExternalReferences().size()" }
cna_cnb_decode_song_duration_milliseconds = { get = "Cnb::DecodeSongFromCnb(*object->value).durationMs" }
cna_cnb_decode_song_stream_reference_size = { size = "Cnb::DecodeSongFromCnb(*object->value).streamReference" }
cna_cnb_decode_song_name_size = { size = "Cnb::DecodeSongFromCnb(*object->value).name" }
cna_cnb_decode_video_stream_reference_size = { size = "Cnb::DecodeVideoFromCnb(*object->value).streamReference" }
cna_cnb_decode_model = { result = "CreateModel(Cnb::DecodeModelFromCnb(*object->value), out_model)" }
cna_cnb_decode_sprite_font = { result = "CreateSpriteFont(Cnb::DecodeSpriteFontFromCnb(*object->value), out_font)" }
cna_cnb_decode_sound_effect = { result = "CreateSoundEffect(Cnb::DecodeSoundEffectFromCnb(*object->value), out_sound)" }
cna_cnb_decode_animation_clip = { result = "CreateAnimationClip(Cnb::DecodeAnimationClipFromCnb(*object->value), out_clip)" }
cna_cnb_loader_registry_resolve_for_document = { result = "CreateLoader(CNA::Content::CnbLoaderRegistry::ResolveForDocument(*object->value), out_loader)" }
cna_cnb_document_get_external_reference_name_size = { size = "object->value->ExternalReferences()[static_cast<std::size_t>(index)].logicalName", require = 'RequireIndex(index, object->value->ExternalReferences().size(), "The external-reference index is outside the table.")' }
cna_cnb_document_copy_external_reference_name = { copy = "object->value->ExternalReferences()[static_cast<std::size_t>(index)].logicalName", require = 'RequireIndex(index, object->value->ExternalReferences().size(), "The external-reference index is outside the table.")' }
cna_cnb_decode_curve = { result = "CreateHandle(ObjectKind::Curve, (std::make_shared<Microsoft::Xna::Framework::Curve>(Cnb::DecodeCurveFromCnb(*object->value))), out_curve)" }

[reader]
lookup = "GetReader"
object = "std::shared_ptr<CnbReaderResource>"

[reader.routes]
cna_cnb_reader_copy_context = { copy = "object->value->Context()" }
cna_cnb_reader_skip = { call = "object->value->Skip(byte_count)" }
cna_cnb_reader_require_exhausted = { call = "object->value->RequireExhausted()" }
cna_cnb_reader_destroy = { release = true }
cna_cnb_reader_get_remaining = { get = "object->value->Remaining()" }
cna_cnb_reader_get_position = { get = "object->value->Position()" }
cna_cnb_reader_get_size = { get = "object->value->Size()" }
cna_cnb_reader_get_context_size = { size = "object->value->Context()" }
# The fixed-width reads leave their output untouched on a truncation: the canonical read throws
# before anything is assigned.
cna_cnb_reader_read_u8 = { get = "object->value->ReadU8()" }
cna_cnb_reader_read_u16 = { get = "object->value->ReadU16()" }
cna_cnb_reader_read_u32 = { get = "object->value->ReadU32()" }
cna_cnb_reader_read_u64 = { get = "object->value->ReadU64()" }
cna_cnb_reader_read_i32 = { get = "object->value->ReadI32()" }
cna_cnb_reader_read_f32 = { get = "object->value->ReadF32()" }
cna_cnb_reader_read_f64 = { get = "object->value->ReadF64()" }
cna_cnb_reader_read_count = { get = "object->value->ReadCount(element_size, what_is_being_counted.c_str())" }
cna_cnb_reader_read_seconds = { get = "Cnb::ReadCnbSeconds(*object->value, what.c_str())" }

