# Cnb routes, generated into src/generated/Cnb.inc,
# which src/CnaCApiCnb.cpp includes. Format: docs/c-api/GENERATED_ROUTES.md.

[document]
lookup = "GetDocument"
object = "std::shared_ptr<CnbDocumentResource>"

[document.routes]
cna_cnb_document_copy_origin = { copy = "object->value->Origin()" }
cna_cnb_document_copy_metadata_asset_type_name = { copy = "object->value->Metadata().assetTypeName" }
cna_cnb_document_copy_metadata_content_name = { copy = "object->value->Metadata().contentName" }
cna_cnb_document_require_asset = { call = "object->value->RequireAsset(expected_asset_type_id, max_schema_version)" }
cna_cnb_decode_song_stream_reference = { copy = "Cnb::DecodeSongFromCnb(*object->value).streamReference" }
cna_cnb_decode_song_name = { copy = "Cnb::DecodeSongFromCnb(*object->value).name" }
cna_cnb_decode_video_stream_reference = { copy = "Cnb::DecodeVideoFromCnb(*object->value).streamReference" }
cna_cnb_document_get_origin_size = { result = "ReportTextSize(object->value->Origin(), out_byte_count)" }
cna_cnb_document_get_container_major = { get = "object->value->ContainerMajor()" }
cna_cnb_document_get_container_minor = { get = "object->value->ContainerMinor()" }
cna_cnb_document_get_asset_type_id = { get = "object->value->AssetTypeId()" }
cna_cnb_document_get_asset_schema_version = { get = "object->value->AssetSchemaVersion()" }
cna_cnb_document_get_chunk_count = { get = "object->value->ChunkCount()" }
cna_cnb_document_require_single = { get = "object->value->RequireSingle(Cnb::CnbChunkId{type})" }
cna_cnb_document_get_metadata_asset_type_name_size = { result = "ReportTextSize(object->value->Metadata().assetTypeName, out_byte_count)" }
cna_cnb_document_get_metadata_content_name_size = { result = "ReportTextSize(object->value->Metadata().contentName, out_byte_count)" }
cna_cnb_document_get_external_reference_count = { get = "object->value->ExternalReferences().size()" }
cna_cnb_decode_song_duration_milliseconds = { get = "Cnb::DecodeSongFromCnb(*object->value).durationMs" }
cna_cnb_decode_song_stream_reference_size = { result = "ReportTextSize(Cnb::DecodeSongFromCnb(*object->value).streamReference, out_byte_count)" }
cna_cnb_decode_song_name_size = { result = "ReportTextSize(Cnb::DecodeSongFromCnb(*object->value).name, out_byte_count)" }
cna_cnb_decode_video_stream_reference_size = { result = "ReportTextSize(Cnb::DecodeVideoFromCnb(*object->value).streamReference, out_byte_count)" }

[reader]
