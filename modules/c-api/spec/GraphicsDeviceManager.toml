# GraphicsDeviceManager routes, generated into src/generated/GraphicsDeviceManager.inc,
# which src/CnaCApiGraphicsDeviceManager.cpp includes. Format: docs/c-api/GENERATED_ROUTES.md.

[manager]
lookup = "BorrowManager"
object = "std::shared_ptr<ManagerResource>"

[manager.routes]
cna_graphics_device_manager_get_graphics_profile = { get = "object->value->getGraphicsProfileProperty()" }
cna_graphics_device_manager_get_is_full_screen = { get = "object->value->getIsFullScreenProperty()" }
cna_graphics_device_manager_set_is_full_screen = { call = "object->value->setIsFullScreenProperty(full_screen)" }
cna_graphics_device_manager_get_prefer_multi_sampling = { get = "object->value->getPreferMultiSamplingProperty()" }
cna_graphics_device_manager_set_prefer_multi_sampling = { call = "object->value->setPreferMultiSamplingProperty(prefer)" }
cna_graphics_device_manager_get_preferred_back_buffer_format = { get = "object->value->getPreferredBackBufferFormatProperty()" }
cna_graphics_device_manager_get_preferred_back_buffer_width = { get = "object->value->getPreferredBackBufferWidthProperty()" }
cna_graphics_device_manager_set_preferred_back_buffer_width = { call = "object->value->setPreferredBackBufferWidthProperty(static_cast<SharpRuntime::intcs>(width))" }
cna_graphics_device_manager_get_preferred_back_buffer_height = { get = "object->value->getPreferredBackBufferHeightProperty()" }
cna_graphics_device_manager_set_preferred_back_buffer_height = { call = "object->value->setPreferredBackBufferHeightProperty(static_cast<SharpRuntime::intcs>(height))" }
cna_graphics_device_manager_get_preferred_depth_stencil_format = { get = "object->value->getPreferredDepthStencilFormatProperty()" }
cna_graphics_device_manager_get_synchronize_with_vertical_retrace = { get = "object->value->getSynchronizeWithVerticalRetraceProperty()" }
cna_graphics_device_manager_set_synchronize_with_vertical_retrace = { call = "object->value->setSynchronizeWithVerticalRetraceProperty(synchronize)" }
cna_graphics_device_manager_get_supported_orientations = { get = "object->value->getSupportedOrientationsProperty()" }
cna_graphics_device_manager_set_supported_orientations = { call = "object->value->setSupportedOrientationsProperty(static_cast<DisplayOrientation>(orientations))" }
cna_graphics_device_manager_get_preferred_presentation_mode_ext = { get = "object->value->getPreferredPresentationModeProperty()" }
cna_graphics_device_manager_begin_draw = { get = "object->value->BeginDraw()" }
cna_graphics_device_manager_dispose = { call = "object->value->Dispose()" }
cna_graphics_device_manager_get_type_name_size = { size = "object->value->GetTypeName()" }
cna_graphics_device_manager_copy_type_name = { copy = "object->value->GetTypeName()" }
cna_graphics_device_manager_apply_changes = { result = "RequestDeviceChange([&]() { object->value->ApplyChanges(); })" }
cna_graphics_device_manager_toggle_full_screen = { result = "RequestDeviceChange([&]() { object->value->ToggleFullScreen(); })" }
cna_graphics_device_manager_create_device = { result = "RequestDeviceChange([&]() { object->value->CreateDevice(); })" }
cna_graphics_device_manager_end_draw = { result = "RequestDeviceChange([&]() { object->value->EndDraw(); })" }
cna_graphics_device_manager_set_graphics_profile = { call = "object->value->setGraphicsProfileProperty(static_cast<GraphicsProfile>(profile))", invalid_if = "!IsGraphicsProfile(profile)" }
cna_graphics_device_manager_set_preferred_back_buffer_format = { call = "object->value->setPreferredBackBufferFormatProperty(static_cast<SurfaceFormat>(format))", invalid_if = "!IsSurfaceFormat(format)" }
cna_graphics_device_manager_set_preferred_depth_stencil_format = { call = "object->value->setPreferredDepthStencilFormatProperty(static_cast<DepthFormat>(format))", invalid_if = "!IsDepthFormat(format)" }
cna_graphics_device_manager_set_preferred_presentation_mode_ext = { call = "object->value->setPreferredPresentationModeProperty(static_cast<PresentationMode>(mode))", invalid_if = "mode > CNA_PRESENTATION_MODE_MAXIMUM" }

[values]
[values.routes]
cna_graphics_device_information_get_type_name_size = { size = "GraphicsDeviceInformation().GetTypeName()" }
