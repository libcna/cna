# MediaPlayer routes, generated into src/generated/MediaPlayer.inc,
# which src/CnaCApiMediaPlayer.cpp includes. Format: docs/c-api/GENERATED_ROUTES.md.

[song]
lookup = "BorrowSong"
object = "std::shared_ptr<SongResource>"

[song.routes]
cna_media_player_detect_song_ended_by_elapsed_time_ext = { get = "MediaPlayer::DetectSongEndedByElapsedTime(object->value, System::TimeSpan(static_cast<SharpRuntime::longcs>(elapsed_ticks)))" }

[queue]
lookup = "BorrowQueue"
object = "std::shared_ptr<MediaQueueResource>"

[queue.routes]
cna_media_queue_get_count = { get = "object->value->getCountProperty()" }
cna_media_queue_get_active_song_index = { get = "object->value->getActiveSongIndexProperty()" }
# The canonical setter stores the value unchecked, so C does not invent a range rule.
cna_media_queue_set_active_song_index = { call = "object->value->setActiveSongIndexProperty(static_cast<SharpRuntime::intcs>(index))" }
cna_media_queue_clear = { call = "object->value->Clear()" }
cna_media_queue_get_type_name_size = { size = "object->value->GetTypeName()" }
cna_media_queue_copy_type_name = { copy = "object->value->GetTypeName()" }
cna_media_queue_destroy = { release = true }

[active_game_handle]
lookup = "ValidateActiveGameHandle"

[active_game_handle.routes]
cna_media_player_get_game_has_control = { get = "MediaPlayer::getGameHasControlProperty()" }
cna_media_player_get_is_muted = { get = "MediaPlayer::getIsMutedProperty()" }
cna_media_player_set_is_muted = { call = "MediaPlayer::setIsMutedProperty(muted)" }
cna_media_player_get_is_repeating = { get = "MediaPlayer::getIsRepeatingProperty()" }
cna_media_player_set_is_repeating = { call = "MediaPlayer::setIsRepeatingProperty(repeating)" }
cna_media_player_get_is_shuffled = { get = "MediaPlayer::getIsShuffledProperty()" }
cna_media_player_set_is_shuffled = { call = "MediaPlayer::setIsShuffledProperty(shuffled)" }
cna_media_player_get_play_position_ticks = { get = "MediaPlayer::getPlayPositionProperty().getTicksProperty()" }
cna_media_player_get_state = { get = "MediaPlayer::getStateProperty()" }
cna_media_player_get_volume = { get = "MediaPlayer::getVolumeProperty()" }
# The canonical setter clamps rather than refusing, so C passes the value through.
cna_media_player_set_volume = { call = "MediaPlayer::setVolumeProperty(volume)" }
cna_media_player_get_is_visualization_enabled = { get = "MediaPlayer::getIsVisualizationEnabledProperty()" }
cna_media_player_set_is_visualization_enabled = { call = "MediaPlayer::setIsVisualizationEnabledProperty(enabled)" }
cna_media_player_move_next = { call = "MediaPlayer::MoveNext()" }
cna_media_player_move_previous = { call = "MediaPlayer::MovePrevious()" }
cna_media_player_pause = { call = "MediaPlayer::Pause()" }
cna_media_player_resume = { call = "MediaPlayer::Resume()" }
cna_media_player_stop = { call = "MediaPlayer::Stop()" }
cna_media_player_update_ext = { call = "MediaPlayer::Update()" }
cna_media_player_program_exit_ext = { call = "MediaPlayer::ProgramExit()" }
cna_media_player_raise_active_song_changed_ext = { call = "MediaPlayer::OnActiveSongChanged()" }
cna_media_player_raise_media_state_changed_ext = { call = "MediaPlayer::OnMediaStateChanged()" }

[calls]
[calls.routes]
cna_media_player_subscribe_active_song_changed_ext = { result = "SubscribePlayerEvent(MediaPlayer::ActiveSongChanged, PlayerEventKind::ActiveSongChanged, callback, context, out_registration)" }
cna_media_player_subscribe_media_state_changed_ext = { result = "SubscribePlayerEvent(MediaPlayer::MediaStateChanged, PlayerEventKind::MediaStateChanged, callback, context, out_registration)" }

[queue_and_song]
lookup = "BorrowQueue"
object = "std::shared_ptr<MediaQueueResource>"
other = { lookup = "BorrowSong", object = "std::shared_ptr<SongResource>" }

[queue_and_song.routes]
# The canonical Add adopts the pointer it is given. A handle's object cannot be handed
# away without leaving the caller a stale handle, so C appends a copy -- which is exactly
# what the canonical player does when it enqueues a song.
cna_media_queue_add = { call = "object->value->Add(new Song(other->value->getHandle(), other->value->getNameProperty()))" }

# The routes whose logic is a hand-written helper of the same name, in CamelCase. The
# generated half refuses null out_* outputs, clears handle outputs and checks CNA_Bool
# inputs first; C structures and text reach the helper as the caller passed them.
[helpers]
raw = true

[helpers.routes]
cna_media_player_get_queue = { result = "MediaPlayerGetQueue(game, out_queue)" }
cna_media_queue_get_active_song = { result = "MediaQueueGetActiveSong(queue, out_song, out_available)" }
cna_media_queue_get_at = { result = "MediaQueueGetAt(queue, index, out_song)" }
cna_media_player_get_visualization_data = { result = "MediaPlayerGetVisualizationData(game, data)" }
cna_media_player_play_song = { result = "MediaPlayerPlaySong(game, song)" }
cna_media_player_play_songs = { result = "MediaPlayerPlaySongs(game, songs)" }
cna_media_player_play_songs_from = { result = "MediaPlayerPlaySongsFrom(game, songs, index)" }
cna_media_player_unsubscribe_ext = { result = "MediaPlayerUnsubscribeExt(registration)" }
