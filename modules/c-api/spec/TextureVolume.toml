# TextureVolume routes, generated into src/generated/TextureVolume.inc,
# which src/CnaCApiTextureVolume.cpp includes. Format: docs/c-api/GENERATED_ROUTES.md.

[owned_texture3_d]
lookup = "GetOwnedTexture3D"
object = "std::shared_ptr<Texture3DResource>"

[owned_texture3_d.routes]
cna_texture3d_get_type_name_byte_count = { size = "object->value->GetTypeName()" }
cna_texture3d_copy_type_name = { result = "CopyTypeName(*object->value, destination, capacity, out_byte_count)" }
cna_texture3d_get_info = { versioned = true, get = '''
CNA_Texture3DInfo{
    sizeof(CNA_Texture3DInfo),
    StructureVersion,
    static_cast<uint32_t>(object->value->getWidthProperty()),
    static_cast<uint32_t>(object->value->getHeightProperty()),
    static_cast<uint32_t>(object->value->getDepthProperty()),
    static_cast<uint32_t>(object->value->getLevelCountProperty()),
    static_cast<CNA_SurfaceFormat>(object->value->getFormatProperty()),
    0U
}''' }

[owned_texture_cube]
lookup = "GetOwnedTextureCube"
object = "TextureCubeResourceView"

[owned_texture_cube.routes]
cna_texturecube_get_type_name_byte_count = { size = "object.value->GetTypeName()" }
cna_texturecube_copy_type_name = { result = "CopyTypeName(*object.value, destination, capacity, out_byte_count)" }
cna_texturecube_get_info = { versioned = true, get = '''
CNA_TextureCubeInfo{
    sizeof(CNA_TextureCubeInfo),
    StructureVersion,
    static_cast<uint32_t>(object.value->getSizeProperty()),
    static_cast<uint32_t>(object.value->getLevelCountProperty()),
    static_cast<CNA_SurfaceFormat>(object.value->getFormatProperty()),
    0U
}''' }

# The routes whose logic is a hand-written helper of the same name, in CamelCase. The
# generated half refuses null out_* outputs, clears handle outputs and checks CNA_Bool
# inputs first; C structures and text reach the helper as the caller passed them.
[helpers]
raw = true

[helpers.routes]
cna_texture3d_create = { result = "Texture3dCreate(graphics_device, create_info, out_texture)" }
cna_texture3d_get_data = { result = "Texture3dGetData(texture, transfer, destination, destination_capacity, out_required_elements)" }
cna_texturecube_create = { result = "TexturecubeCreate(graphics_device, create_info, out_texture)" }
cna_texturecube_create_from_dds_memory = { result = "TexturecubeCreateFromDdsMemory(graphics_device, dds_data, dds_byte_count, out_texture)" }
cna_texturecube_get_data = { result = "TexturecubeGetData(texture, transfer, destination, destination_capacity, out_required_elements)" }
cna_texture3d_destroy = { result = "Texture3dDestroy(texture)" }
cna_texture3d_set_data = { result = "Texture3dSetData(texture, transfer, data, data_capacity)" }
cna_texture3d_set_data_bytes = { result = "Texture3dSetDataBytes(texture, transfer, data, data_byte_count)" }
cna_texturecube_destroy = { result = "TexturecubeDestroy(texture)" }
cna_texturecube_set_data = { result = "TexturecubeSetData(texture, transfer, data, data_capacity)" }
