# Display routes, generated into src/generated/Display.inc,
# which src/CnaCApiDisplay.cpp includes. Format: docs/c-api/GENERATED_ROUTES.md.

[adapter_context]
lookup = "GetAdapterContext"
object = "std::shared_ptr<void>"

[adapter_context.routes]
cna_graphics_adapter_get_count = { get = "GraphicsAdapter::getAdaptersProperty().size()" }

[borrowed_graphics_device]
lookup = "GetBorrowedGraphicsDevice"
object = "std::shared_ptr<BorrowedGraphicsDevice>"

[borrowed_graphics_device.routes]
cna_graphics_device_reset = { call = "object->value->Reset()" }
cna_graphics_adapters_refresh = { result = "NotSupported(\"The active C GraphicsDevice retains its adapter; refreshing the global native \" \"adapter cache would invalidate that reference.\")" }

[calls]
[calls.routes]
cna_graphics_adapter_copy_description = { result = "CopyAdapterString(graphics_device, adapter_index, true, destination, capacity, out_bytes)" }
cna_graphics_adapter_copy_device_name = { result = "CopyAdapterString(graphics_device, adapter_index, false, destination, capacity, out_bytes)" }
cna_graphics_adapter_query_render_target_format = { result = "QueryFormat(graphics_device, adapter_index, profile, format, depth_format, multi_sample_count, out_selection, true)" }
cna_graphics_adapter_query_backbuffer_format = { result = "QueryFormat(graphics_device, adapter_index, profile, format, depth_format, multi_sample_count, out_selection, false)" }

[adapter]
lookup = "GetAdapter"
object = "GraphicsAdapter*"
owner = "std::shared_ptr<void>"
arguments = 2

[adapter.routes]
cna_graphics_adapter_is_profile_supported = { get = "object->IsProfileSupported(static_cast<GraphicsProfile>(profile))", invalid_if = "!IsGraphicsProfile(profile)" }
