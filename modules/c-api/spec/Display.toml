# Display routes, generated into src/generated/Display.inc,
# which src/CnaCApiDisplay.cpp includes. Format: docs/c-api/GENERATED_ROUTES.md.

[adapter_context]
lookup = "GetAdapterContext"
object = "std::shared_ptr<void>"

[adapter_context.routes]
cna_graphics_adapter_get_count = { get = "GraphicsAdapter::getAdaptersProperty().size()" }

[borrowed_graphics_device]
lookup = "GetBorrowedGraphicsDevice"
object = "std::shared_ptr<BorrowedGraphicsDevice>"

[borrowed_graphics_device.routes]
cna_graphics_device_reset = { call = "object->value->Reset()" }
cna_graphics_device_get_display_mode = { versioned = true, get = "ToCDisplayMode(object->value->getDisplayModeProperty())" }
cna_graphics_device_get_presentation_parameters = { versioned = true, get = "ToCPresentationParameters(object->value->getPresentationParametersProperty())" }
cna_graphics_adapters_refresh = { result = "NotSupported(\"The active C GraphicsDevice retains its adapter; refreshing the global native \" \"adapter cache would invalidate that reference.\")" }

[calls]
[calls.routes]
cna_display_mode_init = { value = "ToCDisplayMode(DisplayMode(width, height, static_cast<SurfaceFormat>(format)))", invalid_if = "!IsSurfaceFormat(format)" }
cna_presentation_parameters_init = { value = "ToCPresentationParameters(PresentationParameters())" }
cna_presentation_parameters_clone = { value = "ToCPresentationParameters(ToNativePresentationParameters(*source).Clone())", invalid_if = "!IsPresentationParameters(source)" }
cna_presentation_parameters_get_bounds = { value = "ToNativePresentationParameters(*parameters).getBoundsProperty()", invalid_if = "!IsPresentationParameters(parameters)" }
cna_graphics_adapter_copy_description = { result = "CopyAdapterString(graphics_device, adapter_index, true, destination, capacity, out_bytes)" }
cna_graphics_adapter_copy_device_name = { result = "CopyAdapterString(graphics_device, adapter_index, false, destination, capacity, out_bytes)" }
cna_graphics_adapter_query_render_target_format = { result = "QueryFormat(graphics_device, adapter_index, profile, format, depth_format, multi_sample_count, out_selection, true)" }
cna_graphics_adapter_query_backbuffer_format = { result = "QueryFormat(graphics_device, adapter_index, profile, format, depth_format, multi_sample_count, out_selection, false)" }

[adapter]
lookup = "GetAdapter"
object = "GraphicsAdapter*"
owner = "std::shared_ptr<void>"
arguments = 2

[adapter.routes]
cna_graphics_adapter_get_current_display_mode = { versioned = true, get = "ToCDisplayMode(object->getCurrentDisplayModeProperty())" }
cna_graphics_adapter_is_profile_supported = { get = "object->IsProfileSupported(static_cast<GraphicsProfile>(profile))", invalid_if = "!IsGraphicsProfile(profile)" }
cna_graphics_adapter_get_info = { versioned = true, get = '''
CNA_GraphicsAdapterInfo{
    .struct_size = sizeof(CNA_GraphicsAdapterInfo),
    .struct_version = StructureVersion,
    .adapter_index = adapter_index,
    .is_default_adapter = ToCBool(object->getIsDefaultAdapterProperty()),
    .is_wide_screen = ToCBool(object->getIsWideScreenProperty()),
    .use_null_device = ToCBool(object->getUseNullDeviceProperty()),
    .use_reference_device = ToCBool(object->getUseReferenceDeviceProperty()),
    .vendor_id = object->getVendorIdProperty(),
    .device_id = object->getDeviceIdProperty(),
    .revision = object->getRevisionProperty(),
    .subsystem_id = object->getSubSystemIdProperty(),
    .description_byte_length = object->getDescriptionProperty().size(),
    .device_name_byte_length = object->getDeviceNameProperty().size()
}''' }

# The routes whose logic is a hand-written helper of the same name, in CamelCase. The
# generated half refuses null out_* outputs, clears handle outputs and checks CNA_Bool
# inputs first; C structures and text reach the helper as the caller passed them.
[helpers]
raw = true

[helpers.routes]
cna_display_mode_equals = { result = "DisplayModeEquals(left, right, out_equal)" }
cna_graphics_adapter_get_display_mode_count = { result = "GraphicsAdapterGetDisplayModeCount(graphics_device, adapter_index, filter_by_format, format, out_count)" }
cna_graphics_adapter_copy_display_modes = { result = "GraphicsAdapterCopyDisplayModes(graphics_device, adapter_index, filter_by_format, format, destination, capacity, out_count)" }
cna_graphics_adapter_set_device_preferences = { result = "GraphicsAdapterSetDevicePreferences(graphics_device, adapter_index, use_null_device, use_reference_device)" }
cna_graphics_adapter_get_native_monitor_handle = { result = "GraphicsAdapterGetNativeMonitorHandle(graphics_device, adapter_index, out_value)" }
cna_graphics_device_get_native_window_handle = { result = "GraphicsDeviceGetNativeWindowHandle(graphics_device, out_value)" }
cna_graphics_device_create = { result = "GraphicsDeviceCreate(adapter_index, graphics_profile, parameters, out_graphics_device)" }
cna_graphics_device_set_presentation_parameters = { result = "GraphicsDeviceSetPresentationParameters(graphics_device, parameters)" }
cna_graphics_device_destroy = { result = "GraphicsDeviceDestroy(graphics_device)" }
cna_graphics_device_reset_with_parameters = { result = "GraphicsDeviceResetWithParameters(graphics_device, parameters, adapter_index)" }
