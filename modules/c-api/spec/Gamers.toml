# Gamers routes, generated into src/generated/Gamers.inc,
# which src/CnaCApiGamers.cpp includes. Format: docs/c-api/GENERATED_ROUTES.md.

[gamer_base]
lookup = "BorrowGamerBase"
object = "Gamer*"

[gamer_base.routes]
cna_gamer_get_display_name_size = { size = "object->getDisplayNameProperty()" }
cna_gamer_copy_display_name = { copy = "object->getDisplayNameProperty()" }
cna_gamer_get_gamertag_size = { size = "object->getGamertagProperty()" }
cna_gamer_copy_gamertag = { copy = "object->getGamertagProperty()" }
cna_gamer_get_text_size = { size = "object->ToString()" }
cna_gamer_copy_text = { copy = "object->ToString()" }
cna_gamer_get_is_disposed = { get = "object->getIsDisposedProperty()" }
cna_gamer_set_tag = { call = "object->setTagProperty(std::any(tag))" }
# The canonical accessor hands back a profile the caller owns and must delete.
cna_gamer_get_profile = { result = "PublishProfile(std::shared_ptr<GamerProfile>(object->GetProfile()), out_profile)" }
cna_gamer_set_display_name = { call = "object->setDisplayNameProperty(display_name)" }

[signed_in]
lookup = "BorrowSignedIn"
object = "SignedInGamer*"

[signed_in.routes]
cna_signed_in_gamer_get_is_guest = { get = "object->getIsGuestProperty()" }
cna_signed_in_gamer_get_is_signed_in_to_live = { get = "object->getIsSignedInToLiveProperty()" }
cna_signed_in_gamer_get_party_size = { get = "object->getPartySizeProperty()" }
# XNA's setter is internal; a C host without a party service may still drive it, and the
# CNA party service overwrites it at the next gamer-services update.
cna_signed_in_gamer_set_party_size = { call = "CNA::Internal::GamerServices::GamerAccess::setPartySize(*object, static_cast<int>(party_size))" }
cna_signed_in_gamer_get_player_index = { get = "object->getPlayerIndexProperty()" }
cna_signed_in_gamer_set_presence_mode_string_ext = { call = "object->getPresenceProperty().SetPresenceModeStringEXT(mode)" }
cna_signed_in_gamer_award_achievement = { call = "object->AwardAchievement(achievement_key)" }

[profile]
lookup = "BorrowProfile"
object = "std::shared_ptr<GamerProfileResource>"

[profile.routes]
cna_gamer_profile_get_motto_size = { size = "object->value->getMottoProperty()" }
cna_gamer_profile_copy_motto = { copy = "object->value->getMottoProperty()" }
cna_gamer_profile_get_region_name_size = { size = "object->value->getRegionProperty().getNameProperty()" }
cna_gamer_profile_copy_region_name = { copy = "object->value->getRegionProperty().getNameProperty()" }
cna_gamer_profile_destroy = { release = "object->value->Dispose()" }
cna_gamer_profile_get_info = { versioned = true, get = '''
CNA_GamerProfileInfo{
    sizeof(CNA_GamerProfileInfo),
    StructureVersion,
    static_cast<int32_t>(object->value->getGamerScoreProperty()),
    static_cast<CNA_GamerZone>(object->value->getGamerZoneProperty()),
    static_cast<int32_t>(object->value->getTitlesPlayedProperty()),
    static_cast<int32_t>(object->value->getTotalAchievementsProperty()),
    object->value->getReputationProperty(),
    ToCBool(object->value->getIsDisposedProperty()),
    {0U, 0U, 0U}
}''' }
cna_gamer_profile_copy_picture = { result = "CopyPictureStream(std::unique_ptr<System::IO::Stream>(object->value->GetGamerPicture()).get(), destination, capacity, out_bytes)" }

[collection]
lookup = "BorrowCollection"
object = "std::shared_ptr<GamerCollectionResource>"

[collection.routes]
cna_gamer_collection_get_count = { get = "object->friends->getCountProperty()" }
cna_friend_collection_get_is_disposed = { get = "object->friends->getIsDisposedProperty()" }
cna_gamer_collection_destroy = { release = "object->friends->Dispose()" }

[friend]
lookup = "BorrowFriend"
object = "FriendGamer*"
owner = "std::shared_ptr<GamerResource>"

[friend.routes]
cna_friend_gamer_get_presence_size = { size = "object->getPresenceProperty()" }
cna_friend_gamer_copy_presence = { copy = "object->getPresenceProperty()" }
cna_friend_gamer_get_info = { versioned = true, get = '''
CNA_FriendGamerInfo{
    sizeof(CNA_FriendGamerInfo),
    StructureVersion,
    ToCBool(object->getFriendRequestReceivedFromProperty()),
    ToCBool(object->getFriendRequestSentToProperty()),
    ToCBool(object->getHasVoiceProperty()),
    ToCBool(object->getInviteAcceptedProperty()),
    ToCBool(object->getInviteReceivedFromProperty()),
    ToCBool(object->getInviteRejectedProperty()),
    ToCBool(object->getInviteSentToProperty()),
    ToCBool(object->getIsAwayProperty()),
    ToCBool(object->getIsBusyProperty()),
    ToCBool(object->getIsJoinableProperty()),
    ToCBool(object->getIsOnlineProperty()),
    ToCBool(object->getIsPlayingProperty()),
    {0U, 0U, 0U, 0U}
}''' }

[signed_in_and_gamer]
lookup = "BorrowSignedIn"
object = "SignedInGamer*"
other = { lookup = "BorrowGamerBase", object = "Gamer*" }

[signed_in_and_gamer.routes]
cna_signed_in_gamer_is_friend = { get = "object->IsFriend(other)" }

[values]
[values.routes]
cna_gamer_get_partner_token_size = { size = "Gamer::GetPartnerToken(audience_uri)" }
cna_gamer_copy_partner_token = { copy = "Gamer::GetPartnerToken(audience_uri)" }

[calls]
[calls.routes]
# Begin halves this ABI completes at once: the synchronous route, then the callback.
cna_gamer_begin_get_profile = { result = "CompleteAtOnce(cna_gamer_get_profile(gamer, out_profile), callback, context)" }
cna_gamer_begin_get_from_gamertag = { result = "CompleteAtOnce(cna_gamer_get_from_gamertag(gamertag, out_gamer), callback, context)" }
cna_gamer_begin_get_partner_token = { result = "CompleteAtOnce(cna_gamer_copy_partner_token(audience_uri, destination, capacity, out_bytes), callback, context)" }
cna_signed_in_gamer_begin_award_achievement = { result = "CompleteAtOnce(cna_signed_in_gamer_award_achievement(gamer, achievement_key), callback, context)" }

# The routes whose logic is a hand-written helper of the same name, in CamelCase. The
# generated half refuses null out_* outputs, clears handle outputs and checks CNA_Bool
# inputs first; C structures and text reach the helper as the caller passed them.
[helpers]
raw = true

[helpers.routes]
cna_gamer_presence_init = { result = "GamerPresenceInit(out_presence)" }
cna_gamer_get_tag = { result = "GamerGetTag(gamer, out_tag)" }
cna_gamer_get_from_gamertag = { result = "GamerGetFromGamertag(gamertag, out_gamer)" }
cna_gamer_get_signed_in_gamer_at = { result = "GamerGetSignedInGamerAt(index, out_gamer)" }
cna_gamer_signed_in_index_of = { result = "GamerSignedInIndexOf(gamer, out_index)" }
cna_gamer_signed_in_contains = { result = "GamerSignedInContains(gamer, out_contains)" }
cna_gamer_get_signed_in_gamer_at_player_index = { result = "GamerGetSignedInGamerAtPlayerIndex(player_index, out_has_gamer, out_gamer)" }
cna_signed_in_gamer_is_headset = { result = "SignedInGamerIsHeadset(gamer, microphone_index, out_is_headset)" }
cna_signed_in_gamer_get_friends = { result = "SignedInGamerGetFriends(gamer, out_friends)" }
cna_signed_in_gamer_subscribe_signed_in_ext = { result = "SignedInGamerSubscribeSignedInExt(callback, context, out_registration)" }
cna_signed_in_gamer_subscribe_signed_out_ext = { result = "SignedInGamerSubscribeSignedOutExt(callback, context, out_registration)" }
cna_gamer_profile_get_picture_size = { result = "GamerProfileGetPictureSize(profile, out_has_picture, out_bytes)" }
cna_friend_gamer_create_ext = { result = "FriendGamerCreateExt(gamertag, display_name, is_online, is_playing, is_away, is_busy, friend_request_sent_to, friend_request_received_from, out_gamer)" }
cna_friend_collection_create_ext = { result = "FriendCollectionCreateExt(friends, count, out_collection)" }
cna_gamer_collection_get_at = { result = "GamerCollectionGetAt(collection, index, out_gamer)" }
cna_gamer_collection_index_of = { result = "GamerCollectionIndexOf(collection, gamer, out_index)" }
cna_gamer_collection_contains = { result = "GamerCollectionContains(collection, gamer, out_contains)" }
cna_gamer_collection_copy_to = { result = "GamerCollectionCopyTo(collection, destination, capacity, index, out_count)" }
cna_gamer_collection_create_enumerator = { result = "GamerCollectionCreateEnumerator(collection, out_enumerator)" }
cna_gamer_enumerator_move_next = { result = "GamerEnumeratorMoveNext(enumerator, out_has_current)" }
cna_gamer_enumerator_get_current = { result = "GamerEnumeratorGetCurrent(enumerator, out_gamer)" }
cna_signed_in_gamer_get_presence = { result = "SignedInGamerGetPresence(gamer, out_presence)" }
cna_signed_in_gamer_get_privileges = { result = "SignedInGamerGetPrivileges(gamer, out_privileges)" }
cna_gamer_destroy = { result = "GamerDestroy(gamer)" }
cna_signed_in_gamer_set_presence = { result = "SignedInGamerSetPresence(gamer, presence)" }
cna_gamer_unsubscribe_ext = { result = "GamerUnsubscribeExt(registration)" }
cna_gamer_collection_add = { result = "GamerCollectionAdd(collection, gamer)" }
cna_gamer_collection_remove = { result = "GamerCollectionRemove(collection, gamer)" }
cna_gamer_collection_clear = { result = "GamerCollectionClear(collection)" }
cna_gamer_enumerator_reset = { result = "GamerEnumeratorReset(enumerator)" }
cna_gamer_enumerator_destroy = { result = "GamerEnumeratorDestroy(enumerator)" }
