# Media routes, generated into src/generated/Media.inc,
# which src/CnaCApiMedia.cpp includes. Format: docs/c-api/GENERATED_ROUTES.md.

[song]
lookup = "BorrowSong"
object = "std::shared_ptr<SongResource>"

[song.routes]
cna_song_set_duration = { call = "object->value->setDurationProperty(System::TimeSpan(static_cast<SharpRuntime::longcs>(ticks)))" }
cna_song_set_play_count = { call = "object->value->setPlayCountProperty(static_cast<SharpRuntime::intcs>(play_count))" }
cna_song_dispose = { call = "object->value->Dispose()" }
cna_song_get_name_size = { size = "object->value->getNameProperty()" }
cna_song_get_handle_text_size_ext = { size = "object->value->getHandle()" }
cna_song_get_duration = { get = "object->value->getDurationProperty().getTicksProperty()" }
cna_song_get_is_protected = { get = "object->value->getIsProtectedProperty()" }
cna_song_get_is_rated = { get = "object->value->getIsRatedProperty()" }
cna_song_get_play_count = { get = "object->value->getPlayCountProperty()" }
cna_song_get_rating = { get = "object->value->getRatingProperty()" }
cna_song_get_track_number = { get = "object->value->getTrackNumberProperty()" }
cna_song_get_is_disposed = { get = "object->value->getIsDisposedProperty()" }
cna_song_get_hash_code = { get = "object->value->GetHashCode()" }
cna_song_get_type_name_size = { size = "object->value->GetTypeName()" }
cna_song_destroy = { release = true }

[song_collection]
lookup = "BorrowSongCollection"
object = "std::shared_ptr<SongCollectionResource>"

[song_collection.routes]
cna_song_collection_get_count = { get = "object->value->getCountProperty()" }
cna_song_collection_get_is_disposed = { get = "object->value->getIsDisposedProperty()" }
cna_song_collection_dispose = { call = "object->value->Dispose()" }
cna_song_collection_get_type_name_size = { size = "object->value->GetTypeName()" }
cna_song_collection_destroy = { release = true }

[calls]
[calls.routes]
cna_media_source_get_type_at = { result = "ReadEnumeratedSource(game, index, [&](const MediaSource& source) { *out_type = static_cast<CNA_MediaSourceType>(source.getMediaSourceTypeProperty()); return CNA_RESULT_SUCCESS; })" }
cna_media_source_get_name_size_at = { result = "ReadEnumeratedSource(game, index, [&](const MediaSource& source) { *out_bytes = source.getNameProperty().size(); return CNA_RESULT_SUCCESS; })" }
cna_media_source_get_type_name_size_at = { result = "ReadEnumeratedSource(game, index, [&](const MediaSource& source) { *out_bytes = source.GetTypeName().size(); return CNA_RESULT_SUCCESS; })" }

[song_pair]
lookup = "BorrowSong"
object = "std::shared_ptr<SongResource>"
other = { lookup = "BorrowSong", object = "std::shared_ptr<SongResource>" }

[song_pair.routes]
cna_song_equals = { get = "object->value->Equals(other->value)" }

[values]
[values.routes]
cna_visualization_data_get_type_name_size = { size = "VisualizationData().GetTypeName()" }

[active_game_handle]
lookup = "ValidateActiveGameHandle"

[active_game_handle.routes]
cna_media_source_get_available_count = { get = "OwnedMediaSources().Count()" }
