# Packed-vector value routes, generated into src/generated/PackedVectors.inc,
# which src/CnaCApiPackedVectors.cpp includes. Format: docs/c-api/GENERATED_ROUTES.md.

[half]
[half.routes]
cna_half_from_single = { value = "HalfTypeHelper::Convert(value)" }
cna_half_from_single_bits = { value = "HalfTypeHelper::Convert(single_bits)" }
cna_half_to_single = { value = "HalfTypeHelper::Convert(half)" }

# The routes whose logic is a hand-written helper of the same name, in CamelCase. The
# generated half refuses null out_* outputs, clears handle outputs and checks CNA_Bool
# inputs first; C structures and text reach the helper as the caller passed them.
[helpers]
raw = true

[helpers.routes]
cna_packed_vector_pack = { result = "PackedVectorPack(format, vector, out_packed)" }
cna_packed_vector_unpack = { result = "PackedVectorUnpack(format, packed, out_vector)" }
cna_packed_vector_equals = { result = "PackedVectorEquals(format, left, right, out_equal)" }
cna_packed_vector_not_equals = { result = "PackedVectorNotEquals(format, left, right, out_not_equal)" }
