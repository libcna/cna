# Xact routes, generated into src/generated/Xact.inc,
# which src/CnaCApiXact.cpp includes. Format: docs/c-api/GENERATED_ROUTES.md.

[engine]
lookup = "GetEngine"
object = "std::shared_ptr<EngineResource>"

[engine.routes]
cna_audio_engine_get_is_disposed = { get = "object->value->getIsDisposedProperty()" }
cna_audio_engine_get_renderer_count = { get = "object->value->getRendererDetailsProperty().size()" }
cna_audio_engine_update = { call = "object->value->Update()" }
cna_audio_engine_get_type_name_size = { size = "object->value->GetTypeName()" }
cna_audio_engine_copy_type_name = { copy = "object->value->GetTypeName()" }
cna_audio_engine_get_global_variable = { get = "object->value->GetGlobalVariable(name)" }
cna_audio_engine_set_global_variable = { call = "object->value->SetGlobalVariable(name, value)", invalid_if = "!std::isfinite(value)" }

[category]
lookup = "GetCategory"
object = "std::shared_ptr<CategoryResource>"

[category.routes]
cna_audio_category_get_name_size = { size = "object->value->getNameProperty()" }
cna_audio_category_copy_name = { copy = "object->value->getNameProperty()" }
cna_audio_category_pause = { call = "object->value->Pause()" }
cna_audio_category_resume = { call = "object->value->Resume()" }
cna_audio_category_get_hash_code = { get = "object->value->GetHashCode()" }
cna_audio_category_set_volume = { call = "object->value->SetVolume(volume)", invalid_if = "!std::isfinite(volume)" }

[wave_bank]
lookup = "GetWaveBank"
object = "std::shared_ptr<WaveBankResource>"

[wave_bank.routes]
cna_wave_bank_get_is_disposed = { get = "object->value->getIsDisposedProperty()" }
cna_wave_bank_get_is_prepared = { get = "object->value->getIsPreparedProperty()" }
cna_wave_bank_get_is_in_use = { get = "object->value->getIsInUseProperty()" }
cna_wave_bank_get_type_name_size = { size = "object->value->GetTypeName()" }
cna_wave_bank_copy_type_name = { copy = "object->value->GetTypeName()" }

[sound_bank]
lookup = "GetSoundBank"
object = "std::shared_ptr<SoundBankResource>"

[sound_bank.routes]
cna_sound_bank_get_is_disposed = { get = "object->value->getIsDisposedProperty()" }
cna_sound_bank_get_is_in_use = { get = "object->value->getIsInUseProperty()" }
cna_sound_bank_get_type_name_size = { size = "object->value->GetTypeName()" }
cna_sound_bank_copy_type_name = { copy = "object->value->GetTypeName()" }
cna_sound_bank_play_cue = { call = "object->value->PlayCue(name)" }

[cue]
lookup = "GetCue"
object = "std::shared_ptr<CueResource>"

[cue.routes]
cna_cue_get_name_size = { size = "object->value->getNameProperty()" }
cna_cue_copy_name = { copy = "object->value->getNameProperty()" }
cna_cue_play = { call = "object->value->Play()" }
cna_cue_pause = { call = "object->value->Pause()" }
cna_cue_resume = { call = "object->value->Resume()" }
cna_cue_get_type_name_size = { size = "object->value->GetTypeName()" }
cna_cue_copy_type_name = { copy = "object->value->GetTypeName()" }
cna_cue_get_info = { versioned = true, get = '''
CNA_CueInfo{
    sizeof(CNA_CueInfo),
    StructureVersion,
    ToCBool(object->value->getIsCreatedProperty()),
    ToCBool(object->value->getIsDisposedProperty()),
    ToCBool(object->value->getIsPausedProperty()),
    ToCBool(object->value->getIsPlayingProperty()),
    ToCBool(object->value->getIsPreparedProperty()),
    ToCBool(object->value->getIsPreparingProperty()),
    ToCBool(object->value->getIsStoppedProperty()),
    ToCBool(object->value->getIsStoppingProperty())
}''' }
cna_cue_get_variable = { get = "object->value->GetVariable(name)" }
cna_cue_set_variable = { call = "object->value->SetVariable(name, value)", invalid_if = "!std::isfinite(value)" }

[calls]
[calls.routes]
cna_audio_engine_create_with_renderer = { result = "CreateEngine(game, settings_file, true, look_ahead_ticks, renderer_id, out_engine)" }

[renderer_detail]
lookup = "GetRendererDetail"
object = "const Microsoft::Xna::Framework::Audio::RendererDetail*"
owner = "std::shared_ptr<EngineResource>"
arguments = 2

[renderer_detail.routes]
cna_audio_engine_get_renderer_friendly_name_size = { size = "object->getFriendlyNameProperty()" }
cna_audio_engine_copy_renderer_friendly_name = { copy = "object->getFriendlyNameProperty()" }
cna_audio_engine_get_renderer_id_size = { size = "object->getRendererIdProperty()" }
cna_audio_engine_copy_renderer_id = { copy = "object->getRendererIdProperty()" }
cna_audio_engine_get_renderer_text_size = { size = "object->ToString()" }
cna_audio_engine_copy_renderer_text = { copy = "object->ToString()" }
cna_audio_engine_get_renderer_hash_code = { get = "object->GetHashCode()" }

[category_pair]
lookup = "GetCategory"
object = "std::shared_ptr<CategoryResource>"
other = { lookup = "GetCategory", object = "std::shared_ptr<CategoryResource>" }

[category_pair.routes]
# Categories compare by name alone, so two categories from two engines can be equal. Both
# canonical equality operators are this one answer; inequality is its negation.
cna_audio_category_equals = { get = "*object->value == *other->value" }

# The routes whose logic is a hand-written helper of the same name, in CamelCase. The
# generated half refuses null out_* outputs, clears handle outputs and checks CNA_Bool
# inputs first; C structures and text reach the helper as the caller passed them.
[helpers]
raw = true

[helpers.routes]
cna_audio_engine_renderers_equal = { result = "AudioEngineRenderersEqual(engine, renderer_index, other_renderer_index, out_equals)" }
cna_audio_engine_subscribe_disposing_ext = { result = "AudioEngineSubscribeDisposingExt(engine, callback, context, out_registration)" }
cna_audio_engine_get_category = { result = "AudioEngineGetCategory(engine, name, out_category)" }
cna_wave_bank_create = { result = "WaveBankCreate(engine, filename, out_wave_bank)" }
cna_wave_bank_create_streaming = { result = "WaveBankCreateStreaming(engine, filename, offset, packet_size, out_wave_bank)" }
cna_wave_bank_subscribe_disposing_ext = { result = "WaveBankSubscribeDisposingExt(wave_bank, callback, context, out_registration)" }
cna_sound_bank_create = { result = "SoundBankCreate(engine, filename, out_sound_bank)" }
cna_sound_bank_get_cue = { result = "SoundBankGetCue(sound_bank, name, out_cue)" }
cna_sound_bank_subscribe_disposing_ext = { result = "SoundBankSubscribeDisposingExt(sound_bank, callback, context, out_registration)" }
cna_cue_subscribe_disposing_ext = { result = "CueSubscribeDisposingExt(cue, callback, context, out_registration)" }
cna_audio_engine_create = { result = "AudioEngineCreate(game, settings_file, out_engine)", optional = ["out_engine"] }
cna_audio_engine_destroy = { result = "AudioEngineDestroy(engine)" }
cna_audio_category_destroy = { result = "AudioCategoryDestroy(category)" }
cna_audio_category_stop = { result = "AudioCategoryStop(category, options)" }
cna_wave_bank_destroy = { result = "WaveBankDestroy(wave_bank)" }
cna_sound_bank_destroy = { result = "SoundBankDestroy(sound_bank)" }
cna_sound_bank_play_cue_3d = { result = "SoundBankPlayCue3d(sound_bank, name, listener, emitter)" }
cna_cue_destroy = { result = "CueDestroy(cue)" }
cna_cue_apply_3d = { result = "CueApply3d(cue, listener, emitter)" }
cna_cue_stop = { result = "CueStop(cue, options)" }
