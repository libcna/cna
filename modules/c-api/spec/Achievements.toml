# Achievements routes, generated into src/generated/Achievements.inc,
# which src/CnaCApiAchievements.cpp includes. Format: docs/c-api/GENERATED_ROUTES.md.

[achievement]
lookup = "BorrowAchievement"
object = "std::shared_ptr<AchievementResource>"

[achievement.routes]
cna_achievement_get_key_size = { size = "object->value->getKeyProperty()" }
cna_achievement_copy_key = { copy = "object->value->getKeyProperty()" }
cna_achievement_get_name_size = { size = "object->value->getNameProperty()" }
cna_achievement_copy_name = { copy = "object->value->getNameProperty()" }
cna_achievement_get_description_size = { size = "object->value->getDescriptionProperty()" }
cna_achievement_copy_description = { copy = "object->value->getDescriptionProperty()" }
cna_achievement_get_how_to_earn_size = { size = "object->value->getHowToEarnProperty()" }
cna_achievement_copy_how_to_earn = { copy = "object->value->getHowToEarnProperty()" }
cna_achievement_destroy = { release = true }
cna_achievement_get_info = { versioned = true, get = '''
CNA_AchievementInfo{
    sizeof(CNA_AchievementInfo),
    StructureVersion,
    static_cast<int32_t>(object->value->getGamerScoreProperty()),
    ToCBool(object->value->getDisplayBeforeEarnedProperty()),
    ToCBool(object->value->getEarnedOnlineProperty()),
    ToCBool(object->value->getIsEarnedProperty()),
    0U,
    static_cast<int64_t>(object->value->getEarnedDateTimeProperty().getTicksProperty())
}''' }
cna_achievement_copy_picture = { result = "CopyPictureStream(std::unique_ptr<System::IO::Stream>(object->value->GetPicture()).get(), destination, capacity, out_bytes)" }

[collection]
lookup = "BorrowCollection"
object = "std::shared_ptr<AchievementCollectionResource>"

[collection.routes]
cna_achievement_collection_get_count = { get = "object->value->getCountProperty()" }
cna_achievement_collection_get_is_disposed = { get = "object->value->getIsDisposedProperty()" }
cna_achievement_collection_get_is_read_only = { get = "object->value->getIsReadOnlyProperty()" }
cna_achievement_collection_remove_at = { call = "object->value->RemoveAt(static_cast<int>(index))" }
cna_achievement_collection_clear = { call = "object->value->Clear()" }
cna_achievement_collection_destroy = { release = "object->value->Dispose()" }
# The canonical indexer validates the range and throws; letting it do so keeps the rule in
# one place. The copy is deliberate: the reference it answers points into storage that a
# later insert or remove would invalidate.
cna_achievement_collection_get_at = { result = "PublishAchievement((*object->value)[static_cast<int>(index)], out_achievement)" }

[signed_in]
lookup = "BorrowSignedIn"
object = "SignedInGamer*"

[signed_in.routes]
cna_signed_in_gamer_get_achievements = { result = "PublishCollection(object->GetAchievements(), out_achievements)" }

[collection_and_achievement]
lookup = "BorrowCollection"
object = "std::shared_ptr<AchievementCollectionResource>"
other = { lookup = "BorrowAchievement", object = "std::shared_ptr<AchievementResource>" }

[collection_and_achievement.routes]
cna_achievement_collection_index_of = { get = "object->value->IndexOf(*other->value)" }
cna_achievement_collection_contains = { get = "object->value->Contains(*other->value)" }
cna_achievement_collection_add = { call = "object->value->Add(*other->value)" }
cna_achievement_collection_remove = { get = "object->value->Remove(*other->value)" }

[achievement_pair]
lookup = "BorrowAchievement"
object = "std::shared_ptr<AchievementResource>"
other = { lookup = "BorrowAchievement", object = "std::shared_ptr<AchievementResource>" }

[achievement_pair.routes]
# Both canonical equality operators are this one answer; inequality is its negation.
cna_achievement_equals = { get = "*object->value == *other->value" }
