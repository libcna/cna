# Input routes, generated into src/generated/Input.inc,
# which src/CnaCApiInput.cpp includes. Format: docs/c-api/GENERATED_ROUTES.md.

[keyboard_state]
lookup = "ValidateKeyboardState"

[keyboard_state.routes]
cna_keyboard_state_get_pressed_key_count = { get = "CountPressedKeys(*state)" }
cna_keyboard_state_get_hash_code = { get = "NativeKeyboardState(*state).GetHashCode()" }
cna_keyboard_state_get_string_size = { size = "KeyboardState().ToString()" }
cna_keyboard_state_copy_string = { copy = "KeyboardState().ToString()" }
cna_keyboard_state_is_key_down = { get = "IsKeyDown(*state, key)", invalid_if = "key >= KeyboardSlotCount" }
cna_keyboard_state_is_key_up = { get = "!IsKeyDown(*state, key)", invalid_if = "key >= KeyboardSlotCount" }
cna_keyboard_state_get_key_state = { get = "NativeKeyboardState(*state).getItem(static_cast<Keys>(key)) == KeyState::Down ? CNA_KEY_STATE_DOWN : CNA_KEY_STATE_UP", invalid_if = "key >= KeyboardSlotCount" }

[state]
lookup = "ValidateGamePadState"

[state.routes]
cna_gamepad_state_set_packet_number_ext = { call = "state->packet_number = packet_number" }
# The canonical hash mixes only the button set and the packet number.
cna_gamepad_state_get_hash_code = { get = "static_cast<unsigned>(NativeButtons(state->pressed_buttons).GetHashCode()) ^ (static_cast<unsigned>(state->packet_number) * 31U)" }
cna_gamepad_state_get_string_size = { size = "GamePadStateText(*state)" }
cna_gamepad_state_copy_string = { copy = "GamePadStateText(*state)" }
cna_gamepad_state_get_buttons = { get = "state->pressed_buttons" }
cna_gamepad_state_get_dpad = { get = "state->pressed_buttons & DPadMask" }
cna_gamepad_state_get_thumb_sticks = { get = "CNA_GamePadThumbSticks{state->analog.left_thumb_stick, state->analog.right_thumb_stick}" }
cna_gamepad_state_get_triggers = { get = "CNA_GamePadTriggers{state->analog.left_trigger, state->analog.right_trigger}" }
cna_gamepad_state_is_button_down = { get = "(state->pressed_buttons & buttons) == buttons", invalid_if = "(buttons & ~CNA_GAMEPAD_BUTTON_ALL) != 0U" }
cna_gamepad_state_is_button_up = { get = "(state->pressed_buttons & buttons) != buttons", invalid_if = "(buttons & ~CNA_GAMEPAD_BUTTON_ALL) != 0U" }

[mouse_state]
lookup = "ValidateMouseState"

[mouse_state.routes]
cna_mouse_state_get_hash_code = { get = "NativeMouseState(*state).GetHashCode()" }
cna_mouse_state_get_string_size = { size = "NativeMouseState(*state).ToString()" }
cna_mouse_state_copy_string = { copy = "NativeMouseState(*state).ToString()" }

[game]
lookup = "ValidateActiveGameHandle"

[game.routes]
cna_mouse_get_window_handle = { get = "Mouse::getWindowHandleProperty()" }
cna_mouse_set_window_handle = { call = "Mouse::setWindowHandleProperty(static_cast<std::uintptr_t>(window))" }
cna_mouse_set_position = { call = "Mouse::SetPosition(static_cast<int>(x), static_cast<int>(y))" }
cna_mouse_get_is_relative_mouse_mode_ext = { get = "Mouse::getIsRelativeMouseModeEXTProperty()" }
cna_mouse_set_is_relative_mouse_mode_ext = { call = "Mouse::setIsRelativeMouseModeEXTProperty(enabled)" }
cna_mouse_set_capture_ext = { get = "Mouse::SetCaptureEXT(enabled)" }
cna_mouse_warp_global_ext = { get = "Mouse::WarpGlobalEXT(static_cast<int>(x), static_cast<int>(y))" }
cna_mouse_raise_clicked_ext = { call = "Mouse::INTERNAL_onClicked(static_cast<int>(button))" }
cna_mouse_reset_for_tests_ext = { call = "Mouse::ResetForTests()" }
cna_text_input_raise_text_input_ext = { call = "TextInputEXT::INTERNAL_OnTextInput(static_cast<charcs>(code_unit))" }
cna_text_input_get_window_handle_ext = { get = "TextInputEXT::getWindowHandleProperty()" }
cna_text_input_set_window_handle_ext = { call = "TextInputEXT::setWindowHandleProperty(static_cast<std::uintptr_t>(window))" }
cna_text_input_is_active_ext = { get = "TextInputEXT::IsTextInputActive()" }
cna_text_input_is_screen_keyboard_shown_ext = { get = "TextInputEXT::IsScreenKeyboardShown()" }
cna_text_input_is_screen_keyboard_shown_for_window_ext = { get = "TextInputEXT::IsScreenKeyboardShown(static_cast<std::uintptr_t>(window))" }
cna_text_input_start_ext = { call = "TextInputEXT::StartTextInput()" }
cna_text_input_stop_ext = { call = "TextInputEXT::StopTextInput()" }
cna_text_input_reset_for_tests_ext = { call = "TextInputEXT::ResetForTests()" }
cna_touch_panel_get_display_width = { get = "TouchPanel::getDisplayWidthProperty()" }
cna_touch_panel_set_display_width = { call = "TouchPanel::setDisplayWidthProperty(width)" }
cna_touch_panel_get_display_height = { get = "TouchPanel::getDisplayHeightProperty()" }
cna_touch_panel_set_display_height = { call = "TouchPanel::setDisplayHeightProperty(height)" }
cna_touch_panel_get_display_orientation = { get = "TouchPanel::getDisplayOrientationProperty()" }
cna_touch_panel_get_mouse_touch_emulation_enabled_ext = { get = "TouchPanel::getMouseTouchEmulationEnabledEXT()" }
cna_touch_panel_set_mouse_touch_emulation_enabled_ext = { call = "TouchPanel::setMouseTouchEmulationEnabledEXT(enabled)" }
cna_touch_panel_get_enabled_gestures = { get = "TouchPanel::getEnabledGesturesProperty()" }
cna_touch_panel_get_is_gesture_available = { get = "TouchPanel::getIsGestureAvailableProperty()" }
cna_touch_panel_get_window_handle = { get = "TouchPanel::getWindowHandleProperty()" }
cna_touch_panel_set_window_handle = { call = "TouchPanel::setWindowHandleProperty(static_cast<std::uintptr_t>(window))" }
cna_touch_panel_get_touch_device_exists_ext = { get = "TouchPanel::getTouchDeviceExistsProperty()" }
cna_touch_panel_set_touch_device_exists_ext = { call = "TouchPanel::setTouchDeviceExistsProperty(exists)" }
cna_touch_panel_update_ext = { call = "TouchPanel::Update()" }
cna_touch_panel_reset_for_tests_ext = { call = "TouchPanel::ResetForTests()" }
cna_keyboard_get_mod_state_ext = { get = "MapKeyModifiers(Keyboard::GetModStateEXT())" }
cna_keyboard_get_key_from_scancode_ext = { get = "Keyboard::GetKeyFromScancodeEXT(static_cast<Keys>(scancode))", validate = "ValidateKey(scancode)" }
cna_text_input_set_input_rectangle_ext = { call = "TextInputEXT::SetInputRectangle(rectangle)" }
cna_touch_panel_set_finger_ext = { call = "TouchPanel::SetFinger(index, finger_id, position)", invalid_if = "index < 0 || static_cast<uint32_t>(index) >= CNA_TOUCH_MAX_TOUCHES" }
cna_touch_panel_set_enabled_gestures = { call = "TouchPanel::setEnabledGesturesProperty(static_cast<GestureType>(gestures))", validate = "ValidateGestureType(gestures)" }
cna_touch_panel_enqueue_gesture_ext = { call = "TouchPanel::EnqueueGesture(ToNativeGestureSample(*sample))", validate = ['ValidateVersionedStructure(sample, "The gesture-sample structure is invalid.")', "ValidateGestureType(sample->gesture_type)"] }
cna_touch_panel_set_display_orientation = { call = "TouchPanel::setDisplayOrientationProperty(static_cast<DisplayOrientation>(orientation))", invalid_if = "(orientation & ~DisplayOrientationAll) != 0U" }
cna_touch_panel_raise_touch_event_ext = { call = "TouchPanel::INTERNAL_onTouchEvent(finger_id, static_cast<TouchLocationState>(state), x, y, dx, dy)", invalid_if = "!IsValidTouchLocationState(state)" }
# An empty queue throws canonically; the firewall reports that as an invalid state rather
# than inventing a default sample, so "no gesture" stays distinguishable from a real one.
cna_touch_panel_read_gesture = { get = "MapGestureSample(TouchPanel::ReadGesture())", versioned = true }
# Composition text is byte-length delimited on both sides, so an embedded NUL is
# representable and is not rejected; invalid UTF-8 still is.
cna_text_input_raise_text_editing_ext = { call = "TextInputEXT::INTERNAL_OnTextEditing(text, static_cast<int>(start), static_cast<int>(length))" }

[cursor]
lookup = "GetCursorResource"
object = "std::shared_ptr<MouseCursorResource>"

[cursor.routes]
cna_mouse_cursor_dispose = { call = "object->value->Dispose()" }
cna_mouse_cursor_destroy = { release = true }

[touch_state]
lookup = "ValidateTouchState"

[touch_state.routes]
cna_touch_state_get_is_read_only = { get = "TouchCollection().getIsReadOnlyProperty()" }
cna_touch_state_get_is_empty_ext = { get = "state->touch_count == 0U" }
cna_touch_state_clear = { call = "state->touch_count = 0U" }

[mask]
lookup = "ValidateMask"

[mask.routes]
cna_gamepad_buttons_init_from_mask = { get = "buttons" }

[calls]
[calls.routes]
cna_gamepad_get_state = { result = "CaptureGamePadState(game, player_index, CNA_GAMEPAD_DEAD_ZONE_INDEPENDENT_AXES, out_state)" }
cna_gamepad_get_state_with_dead_zone = { result = "CaptureGamePadState(game, player_index, dead_zone_mode, out_state)" }
cna_gamepad_get_guid_size_ext = { result = "ReportDeviceTextSize(&GamePad::GetGUIDEXT, game, player_index, out_bytes)" }
cna_gamepad_copy_guid_ext = { result = "CopyDeviceTextValue(&GamePad::GetGUIDEXT, game, player_index, destination, capacity, out_bytes)" }
cna_gamepad_get_name_size_ext = { result = "ReportDeviceTextSize(&GamePad::GetNameEXT, game, player_index, out_bytes)" }
cna_gamepad_copy_name_ext = { result = "CopyDeviceTextValue(&GamePad::GetNameEXT, game, player_index, destination, capacity, out_bytes)" }
cna_gamepad_get_path_size_ext = { result = "ReportDeviceTextSize(&GamePad::GetPathEXT, game, player_index, out_bytes)" }
cna_gamepad_copy_path_ext = { result = "CopyDeviceTextValue(&GamePad::GetPathEXT, game, player_index, destination, capacity, out_bytes)" }
cna_gamepad_get_serial_size_ext = { result = "ReportDeviceTextSize(&GamePad::GetSerialEXT, game, player_index, out_bytes)" }
cna_gamepad_copy_serial_ext = { result = "CopyDeviceTextValue(&GamePad::GetSerialEXT, game, player_index, destination, capacity, out_bytes)" }
cna_keyboard_get_scancode_name_size_ext = { result = "ReportKeyTextSize(&Keyboard::GetScancodeNameEXT, game, key, out_bytes)" }
cna_keyboard_copy_scancode_name_ext = { result = "CopyKeyTextValue(&Keyboard::GetScancodeNameEXT, game, key, destination, capacity, out_bytes)" }
cna_keyboard_get_scancode_from_name_ext = { result = "LookUpKey(&Keyboard::GetScancodeFromNameEXT, game, name, out_key)" }
cna_keyboard_get_key_name_size_ext = { result = "ReportKeyTextSize(&Keyboard::GetKeyNameEXT, game, key, out_bytes)" }
cna_keyboard_copy_key_name_ext = { result = "CopyKeyTextValue(&Keyboard::GetKeyNameEXT, game, key, destination, capacity, out_bytes)" }
cna_keyboard_get_key_from_name_ext = { result = "LookUpKey(&Keyboard::GetKeyFromNameEXT, game, name, out_key)" }
cna_touch_location_get_string_size = { result = "ReportTouchLocationString(location, nullptr, UINT64_C(0), out_bytes, false)" }
cna_touch_location_copy_string = { result = "ReportTouchLocationString(location, destination, capacity, out_bytes, true)" }

[values]
[values.routes]
cna_gamepad_capabilities_init = { value = "SnapshotCapabilities(GamePadCapabilities{})" }
cna_gamepad_buttons_init = { value = "MaskFromNamedButtons(GamePadButtons())" }
cna_gamepad_buttons_equals = { value = "NativeButtons(left).Equals(NativeButtons(right))" }
cna_gamepad_buttons_not_equals = { value = "NativeButtons(left) != NativeButtons(right)" }
cna_gamepad_buttons_get_hash_code = { value = "NativeButtons(buttons).GetHashCode()" }
cna_gamepad_dpad_init = { value = "CNA_GAMEPAD_BUTTON_NONE" }
cna_gamepad_dpad_equals = { value = "NativeDPad(left).Equals(NativeDPad(right))" }
cna_gamepad_dpad_not_equals = { value = "NativeDPad(left) != NativeDPad(right)" }
cna_gamepad_dpad_get_hash_code = { value = "NativeDPad(dpad).GetHashCode()" }
cna_gamepad_state_init = { value = "SnapshotState(GamePadState())" }
cna_keyboard_state_init = { value = "SnapshotKeyboard(KeyboardState())" }
cna_mouse_state_init = { value = "SnapshotMouse(MouseState())" }
cna_gesture_sample_init = { value = "MapGestureSample(GestureSample())" }
cna_touch_location_init = { value = "MapTouchLocation(TouchLocation())" }
cna_gamepad_exclude_axis_dead_zone = { value = "GamePad::ExcludeAxisDeadZone(value, dead_zone)", invalid_if = "!std::isfinite(value) || !std::isfinite(dead_zone)" }
cna_touch_capabilities_init = { value = '''
CNA_TouchCapabilities{
    sizeof(CNA_TouchCapabilities),
    StructureVersion,
    ToCBool(TouchPanelCapabilities().getIsConnectedProperty()),
    {0U, 0U, 0U},
    static_cast<uint32_t>(TouchPanelCapabilities().getMaximumTouchCountProperty())
}''' }
cna_keyboard_state_equals = { value = "NativeKeyboardState(*left).Equals(NativeKeyboardState(*right))", validate = ["ValidateKeyboardState(left)", "ValidateKeyboardState(right)"] }
cna_keyboard_state_not_equals = { value = "!NativeKeyboardState(*left).Equals(NativeKeyboardState(*right))", validate = ["ValidateKeyboardState(left)", "ValidateKeyboardState(right)"] }
cna_mouse_state_equals = { value = "NativeMouseState(*left).Equals(NativeMouseState(*right))", validate = ["ValidateMouseState(left)", "ValidateMouseState(right)"] }
cna_mouse_state_not_equals = { value = "!NativeMouseState(*left).Equals(NativeMouseState(*right))", validate = ["ValidateMouseState(left)", "ValidateMouseState(right)"] }
cna_mouse_state_init_from_values = { validate = "ValidateMouseButtons(pressed_buttons)", value = '''
SnapshotMouse(MouseState(
    static_cast<int>(x),
    static_cast<int>(y),
    static_cast<int>(scroll_wheel),
    MouseButton(pressed_buttons, CNA_MOUSE_BUTTON_LEFT),
    MouseButton(pressed_buttons, CNA_MOUSE_BUTTON_MIDDLE),
    MouseButton(pressed_buttons, CNA_MOUSE_BUTTON_RIGHT),
    MouseButton(pressed_buttons, CNA_MOUSE_BUTTON_X1),
    MouseButton(pressed_buttons, CNA_MOUSE_BUTTON_X2)))''' }
cna_mouse_state_init_from_values_ext = { validate = "ValidateMouseButtons(pressed_buttons)", value = '''
SnapshotMouse(NativeMouseState(CNA_MouseState{
    sizeof(CNA_MouseState), StructureVersion, x, y, scroll_wheel, horizontal_scroll_wheel,
    pressed_buttons, 0U}))''' }
cna_gamepad_state_equals = { value = "GamePadStatesEqual(*left, *right)", validate = ["ValidateGamePadState(left)", "ValidateGamePadState(right)"] }
cna_gamepad_state_not_equals = { value = "!GamePadStatesEqual(*left, *right)", validate = ["ValidateGamePadState(left)", "ValidateGamePadState(right)"] }
# The C snapshot carries a single button mask, and so does every state CNA itself builds: the
# capture path derives the button set and the directional pad from one raw mask. The pad
# argument is therefore merged into the button set rather than kept beside it, which is what
# makes it readable again through cna_gamepad_state_get_dpad.
cna_gamepad_state_init_from_components = { invalid_if = ["thumb_sticks == nullptr", "triggers == nullptr"], validate = ["ValidateMask(buttons)", "ValidateMask(dpad)"], value = '''
SnapshotState(GamePadState(
    NativeThumbSticks(*thumb_sticks),
    NativeTriggers(*triggers),
    NativeButtons(buttons | dpad),
    NativeDPad(dpad)))''' }
cna_gamepad_thumb_sticks_init = { value = "ToCThumbSticks(GamePadThumbSticks())" }
cna_gamepad_thumb_sticks_init_from_positions = { value = "ToCThumbSticks(GamePadThumbSticks(Vector2(left->x, left->y), Vector2(right->x, right->y)))", invalid_if = ["left == nullptr", "right == nullptr"] }
cna_gamepad_thumb_sticks_equals = { value = "NativeThumbSticks(*left).Equals(NativeThumbSticks(*right))", invalid_if = ["left == nullptr", "right == nullptr"] }
cna_gamepad_thumb_sticks_not_equals = { value = "NativeThumbSticks(*left) != NativeThumbSticks(*right)", invalid_if = ["left == nullptr", "right == nullptr"] }
cna_gamepad_thumb_sticks_get_hash_code = { value = "NativeThumbSticks(*thumb_sticks).GetHashCode()", invalid_if = "thumb_sticks == nullptr" }
cna_gamepad_triggers_init = { value = "ToCTriggers(GamePadTriggers())" }
cna_gamepad_triggers_init_from_positions = { value = "ToCTriggers(GamePadTriggers(left, right))" }
cna_gamepad_triggers_equals = { value = "NativeTriggers(*left).Equals(NativeTriggers(*right))", invalid_if = ["left == nullptr", "right == nullptr"] }
cna_gamepad_triggers_not_equals = { value = "NativeTriggers(*left) != NativeTriggers(*right)", invalid_if = ["left == nullptr", "right == nullptr"] }
cna_gamepad_triggers_get_hash_code = { value = "NativeTriggers(*triggers).GetHashCode()", invalid_if = "triggers == nullptr" }
cna_gamepad_apply_dead_zone = { value = "ApplyDeadZone(*raw, dead_zone_mode)", invalid_if = ["raw == nullptr", "dead_zone_mode > CNA_GAMEPAD_DEAD_ZONE_CIRCULAR", "!IsFinite(*raw)"] }
cna_touch_location_equals = { value = "TouchLocationsEqual(*left, *right)", validate = ['ValidateTouchLocationValue(left, "The first touch location is null.")', 'ValidateTouchLocationValue(right, "The second touch location is null.")'] }
cna_touch_location_get_hash_code = { value = "ToNativeTouchLocation(*location).GetHashCode()", validate = 'ValidateTouchLocationValue(location, "The touch location is null.")' }
cna_touch_capabilities_init_from_values_ext = { value = "CNA_TouchCapabilities{ sizeof(CNA_TouchCapabilities), StructureVersion, ToCBool(is_connected), {0U, 0U, 0U}, static_cast<uint32_t>(maximum_touch_count) }", invalid_if = "maximum_touch_count < 0" }

# The lookup checks the game is active and maps the player index; `object` is that PlayerIndex.
[gamepad]
lookup = "BeginGamePadCall"
object = "PlayerIndex"
arguments = 2

[gamepad.routes]
cna_gamepad_set_vibration = { get = "GamePad::SetVibration(object, left_motor, right_motor)" }
cna_gamepad_set_trigger_vibration_ext = { get = "GamePad::SetTriggerVibrationEXT(object, left_trigger, right_trigger)" }
cna_gamepad_get_player_index_ext = { get = "GamePad::GetPlayerIndexEXT(object)" }
cna_gamepad_set_player_index_ext = { get = "GamePad::SetPlayerIndexEXT(object, static_cast<int>(index))" }
cna_gamepad_get_firmware_version_ext = { get = "GamePad::GetFirmwareVersionEXT(object)" }
cna_gamepad_get_steam_handle_ext = { get = "GamePad::GetSteamHandleEXT(object)" }
cna_gamepad_get_connection_state_ext = { get = "MapConnectionState(GamePad::GetConnectionStateEXT(object))" }
cna_gamepad_get_touchpad_count_ext = { get = "GamePad::GetTouchpadCountEXT(object)" }
cna_gamepad_set_light_bar_ext = { call = "GamePad::SetLightBarEXT(object, color)" }
cna_keyboard_get_state_for_player = { versioned = true, get = "SnapshotKeyboard(Keyboard::GetState(object))" }
cna_gamepad_get_touchpad_finger_count_ext = { get = "GamePad::GetTouchpadFingerCountEXT(object, static_cast<int>(touchpad))" }

# Snapshots built from their fields: the vectors are the C structures themselves.
cna_gamepad_get_button_label_ext = { get = "MapButtonLabel(GamePad::GetButtonLabelEXT(object, static_cast<Buttons>(button)))", validate = "ValidateMask(button)" }
[touch_values]
raw = true

[touch_values.routes]
cna_gesture_sample_init_from_values = { value = "GestureSampleOf(gesture_type, timestamp_ticks, position, position2, delta, delta2, CNA_TOUCH_NO_FINGER, CNA_TOUCH_NO_FINGER)", validate = "ValidateGestureType(gesture_type)" }
cna_gesture_sample_init_from_values_ext = { value = "GestureSampleOf(gesture_type, timestamp_ticks, position, position2, delta, delta2, finger_id, finger_id2)", validate = "ValidateGestureType(gesture_type)" }
cna_touch_location_init_from_values = { value = "CNA_TouchLocation{id, state, position, CNA_TOUCH_LOCATION_INVALID, CNA_Vector2{0.0F, 0.0F}, 0.0F}", invalid_if = "!IsValidTouchLocationState(state)" }
cna_touch_location_init_with_previous = { value = "CNA_TouchLocation{id, state, position, previous_state, previous_position, 0.0F}", invalid_if = ["!IsValidTouchLocationState(state)", "!IsValidTouchLocationState(previous_state)"] }
cna_touch_location_init_from_values_ext = { value = "CNA_TouchLocation{id, state, position, CNA_TOUCH_LOCATION_INVALID, CNA_Vector2{0.0F, 0.0F}, pressure}", invalid_if = "!IsValidTouchLocationState(state)", validate = "ValidatePressure(pressure)" }
cna_touch_location_init_with_previous_ext = { value = "CNA_TouchLocation{id, state, position, previous_state, previous_position, pressure}", invalid_if = ["!IsValidTouchLocationState(state)", "!IsValidTouchLocationState(previous_state)"], validate = "ValidatePressure(pressure)" }

# The routes whose logic is a hand-written helper of the same name, in CamelCase. The
# generated half refuses null out_* outputs, clears handle outputs and checks CNA_Bool
# inputs first; C structures and text reach the helper as the caller passed them.
[helpers]
raw = true

[helpers.routes]
cna_keyboard_state_copy_pressed_keys = { result = "KeyboardStateCopyPressedKeys(state, destination, capacity, out_count)" }
cna_touch_state_find_by_id = { result = "TouchStateFindById(state, id, out_location, out_found)" }
cna_touch_location_try_get_previous = { result = "TouchLocationTryGetPrevious(location, out_previous, out_found)" }
cna_gamepad_buttons_init_from_button_array = { result = "GamepadButtonsInitFromButtonArray(buttons, count, out_buttons)" }
cna_gamepad_buttons_is_pressed = { result = "GamepadButtonsIsPressed(buttons, button, out_is_pressed)" }
cna_gamepad_dpad_init_from_states = { result = "GamepadDpadInitFromStates(up, down, left, right, out_dpad)" }
cna_gamepad_dpad_init_from_button_array = { result = "GamepadDpadInitFromButtonArray(buttons, count, out_dpad)" }
cna_gamepad_dpad_is_pressed = { result = "GamepadDpadIsPressed(dpad, button, out_is_pressed)" }
cna_gamepad_state_init_from_values = { result = "GamepadStateInitFromValues(left_thumb_stick, right_thumb_stick, left_trigger, right_trigger, buttons, count, out_state)" }
cna_gamepad_get_gyro_ext = { result = "GamepadGetGyroExt(game, player_index, out_gyro, out_available)" }
cna_gamepad_get_accelerometer_ext = { result = "GamepadGetAccelerometerExt(game, player_index, out_acceleration, out_available)" }
cna_gamepad_get_power_info_ext = { result = "GamepadGetPowerInfoExt(game, player_index, out_state, out_percent)" }
cna_gamepad_get_touchpad_finger_ext = { result = "GamepadGetTouchpadFingerExt(game, player_index, touchpad, finger, out_finger, out_available)" }
cna_keyboard_state_init_from_keys = { result = "KeyboardStateInitFromKeys(keys, count, out_state)" }
cna_mouse_get_global_position_ext = { result = "MouseGetGlobalPositionExt(game, out_x, out_y)" }
cna_mouse_subscribe_clicked_ext = { result = "MouseSubscribeClickedExt(callback, context, out_registration)" }
cna_mouse_cursor_create_ext = { result = "MouseCursorCreateExt(out_cursor)" }
cna_mouse_cursor_get_stock_ext = { result = "MouseCursorGetStockExt(game, stock, out_cursor)" }
cna_mouse_cursor_create_from_texture2d = { result = "MouseCursorCreateFromTexture2d(game, texture, origin_x, origin_y, out_cursor)" }
cna_text_input_subscribe_text_input_ext = { result = "TextInputSubscribeTextInputExt(callback, context, out_registration)" }
cna_text_input_subscribe_text_editing_ext = { result = "TextInputSubscribeTextEditingExt(callback, context, out_registration)" }
cna_text_input_subscribe_text_editing_candidates_ext = { result = "TextInputSubscribeTextEditingCandidatesExt(callback, context, out_registration)" }
cna_text_input_raise_text_editing_candidates_ext = { result = "TextInputRaiseTextEditingCandidatesExt(game, candidates, candidate_count, selected, horizontal)" }
cna_touch_state_init = { result = "TouchStateInit(out_state)" }
cna_touch_state_init_from_locations = { result = "TouchStateInitFromLocations(locations, count, out_state)" }
cna_touch_state_contains = { result = "TouchStateContains(state, item, out_contains)" }
cna_touch_state_index_of = { result = "TouchStateIndexOf(state, item, out_index)" }
cna_touch_state_copy_to = { result = "TouchStateCopyTo(state, destination, count, capacity, destination_index, out_count)" }
cna_touch_state_remove = { result = "TouchStateRemove(state, item, out_removed)" }
cna_keyboard_get_state = { result = "KeyboardGetState(game, out_state)" }
