# Input routes, generated into src/generated/Input.inc,
# which src/CnaCApiInput.cpp includes. Format: docs/c-api/GENERATED_ROUTES.md.

[keyboard_state]
lookup = "ValidateKeyboardState"

[keyboard_state.routes]
cna_keyboard_state_get_pressed_key_count = { get = "CountPressedKeys(*state)" }
cna_keyboard_state_get_hash_code = { get = "NativeKeyboardState(*state).GetHashCode()" }
cna_keyboard_state_get_string_size = { size = "KeyboardState().ToString()" }
cna_keyboard_state_copy_string = { copy = "KeyboardState().ToString()" }
cna_keyboard_state_is_key_down = { get = "IsKeyDown(*state, key)", invalid_if = "key >= KeyboardSlotCount" }

[state]
lookup = "ValidateState"

[state.routes]
cna_gamepad_state_set_packet_number_ext = { call = "state->packet_number = packet_number" }
# The canonical hash mixes only the button set and the packet number.
cna_gamepad_state_get_hash_code = { get = "static_cast<unsigned>(NativeButtons(state->pressed_buttons).GetHashCode()) ^ (static_cast<unsigned>(state->packet_number) * 31U)" }
cna_gamepad_state_get_string_size = { size = "GamePadState().ToString()" }
cna_gamepad_state_copy_string = { copy = "GamePadState().ToString()" }
cna_gamepad_state_get_buttons = { get = "state->pressed_buttons" }
cna_gamepad_state_get_dpad = { get = "state->pressed_buttons & DPadMask" }

[mouse_state]
lookup = "ValidateMouseState"

[mouse_state.routes]
cna_mouse_state_get_hash_code = { get = "NativeMouseState(*state).GetHashCode()" }
cna_mouse_state_get_string_size = { size = "NativeMouseState(*state).ToString()" }
cna_mouse_state_copy_string = { copy = "NativeMouseState(*state).ToString()" }

[game]
lookup = "ValidateActiveGameHandle"

[game.routes]
cna_mouse_get_window_handle = { get = "Mouse::getWindowHandleProperty()" }
cna_mouse_set_window_handle = { call = "Mouse::setWindowHandleProperty(static_cast<std::uintptr_t>(window))" }
cna_mouse_set_position = { call = "Mouse::SetPosition(static_cast<int>(x), static_cast<int>(y))" }
cna_mouse_get_is_relative_mouse_mode_ext = { get = "Mouse::getIsRelativeMouseModeEXTProperty()" }
cna_mouse_set_is_relative_mouse_mode_ext = { call = "Mouse::setIsRelativeMouseModeEXTProperty(enabled)" }
cna_mouse_set_capture_ext = { get = "Mouse::SetCaptureEXT(enabled)" }
cna_mouse_warp_global_ext = { get = "Mouse::WarpGlobalEXT(static_cast<int>(x), static_cast<int>(y))" }
cna_mouse_raise_clicked_ext = { call = "Mouse::INTERNAL_onClicked(static_cast<int>(button))" }
cna_mouse_reset_for_tests_ext = { call = "Mouse::ResetForTests()" }
cna_text_input_raise_text_input_ext = { call = "TextInputEXT::INTERNAL_OnTextInput(static_cast<charcs>(code_unit))" }
cna_text_input_get_window_handle_ext = { get = "TextInputEXT::getWindowHandleProperty()" }
cna_text_input_set_window_handle_ext = { call = "TextInputEXT::setWindowHandleProperty(static_cast<std::uintptr_t>(window))" }
cna_text_input_is_active_ext = { get = "TextInputEXT::IsTextInputActive()" }
cna_text_input_is_screen_keyboard_shown_ext = { get = "TextInputEXT::IsScreenKeyboardShown()" }
cna_text_input_is_screen_keyboard_shown_for_window_ext = { get = "TextInputEXT::IsScreenKeyboardShown(static_cast<std::uintptr_t>(window))" }
cna_text_input_start_ext = { call = "TextInputEXT::StartTextInput()" }
cna_text_input_stop_ext = { call = "TextInputEXT::StopTextInput()" }
cna_text_input_reset_for_tests_ext = { call = "TextInputEXT::ResetForTests()" }
cna_touch_panel_get_display_width = { get = "TouchPanel::getDisplayWidthProperty()" }
cna_touch_panel_set_display_width = { call = "TouchPanel::setDisplayWidthProperty(width)" }
cna_touch_panel_get_display_height = { get = "TouchPanel::getDisplayHeightProperty()" }
cna_touch_panel_set_display_height = { call = "TouchPanel::setDisplayHeightProperty(height)" }
cna_touch_panel_get_display_orientation = { get = "TouchPanel::getDisplayOrientationProperty()" }
cna_touch_panel_get_mouse_touch_emulation_enabled_ext = { get = "TouchPanel::getMouseTouchEmulationEnabledEXT()" }
cna_touch_panel_set_mouse_touch_emulation_enabled_ext = { call = "TouchPanel::setMouseTouchEmulationEnabledEXT(enabled)" }
cna_touch_panel_get_enabled_gestures = { get = "TouchPanel::getEnabledGesturesProperty()" }
cna_touch_panel_get_is_gesture_available = { get = "TouchPanel::getIsGestureAvailableProperty()" }
cna_touch_panel_get_window_handle = { get = "TouchPanel::getWindowHandleProperty()" }
cna_touch_panel_set_window_handle = { call = "TouchPanel::setWindowHandleProperty(static_cast<std::uintptr_t>(window))" }
cna_touch_panel_get_touch_device_exists_ext = { get = "TouchPanel::getTouchDeviceExistsProperty()" }
cna_touch_panel_set_touch_device_exists_ext = { call = "TouchPanel::setTouchDeviceExistsProperty(exists)" }
cna_touch_panel_update_ext = { call = "TouchPanel::Update()" }
cna_touch_panel_reset_for_tests_ext = { call = "TouchPanel::ResetForTests()" }
cna_keyboard_get_mod_state_ext = { get = "MapKeyModifiers(Keyboard::GetModStateEXT())" }
cna_touch_panel_set_display_orientation = { call = "TouchPanel::setDisplayOrientationProperty(static_cast<DisplayOrientation>(orientation))", invalid_if = "(orientation & ~DisplayOrientationAll) != 0U" }
cna_touch_panel_raise_touch_event_ext = { call = "TouchPanel::INTERNAL_onTouchEvent(finger_id, static_cast<TouchLocationState>(state), x, y, dx, dy)", invalid_if = "!IsValidTouchLocationState(state)" }
# An empty queue throws canonically; the firewall reports that as an invalid state rather
# than inventing a default sample, so "no gesture" stays distinguishable from a real one.
cna_touch_panel_read_gesture = { get = "MapGestureSample(TouchPanel::ReadGesture())", versioned = true }

[cursor]
lookup = "GetCursorResource"
object = "std::shared_ptr<MouseCursorResource>"

[cursor.routes]
cna_mouse_cursor_dispose = { call = "object->value->Dispose()" }

[touch_state]
lookup = "ValidateTouchState"

[touch_state.routes]
cna_touch_state_get_is_read_only = { get = "TouchCollection().getIsReadOnlyProperty()" }
cna_touch_state_get_is_empty_ext = { get = "state->touch_count == 0U" }
cna_touch_state_clear = { call = "state->touch_count = 0U" }

[mask]
lookup = "ValidateMask"

[mask.routes]
cna_gamepad_buttons_init_from_mask = { get = "buttons" }

[calls]
[calls.routes]
cna_gamepad_get_state = { result = "CaptureGamePadState(game, player_index, CNA_GAMEPAD_DEAD_ZONE_INDEPENDENT_AXES, out_state)" }
cna_gamepad_get_state_with_dead_zone = { result = "CaptureGamePadState(game, player_index, dead_zone_mode, out_state)" }
cna_gamepad_get_guid_size_ext = { result = "ReportDeviceTextSize(&GamePad::GetGUIDEXT, game, player_index, out_bytes)" }
cna_gamepad_copy_guid_ext = { result = "CopyDeviceTextValue(&GamePad::GetGUIDEXT, game, player_index, destination, capacity, out_bytes)" }
cna_gamepad_get_name_size_ext = { result = "ReportDeviceTextSize(&GamePad::GetNameEXT, game, player_index, out_bytes)" }
cna_gamepad_copy_name_ext = { result = "CopyDeviceTextValue(&GamePad::GetNameEXT, game, player_index, destination, capacity, out_bytes)" }
cna_gamepad_get_path_size_ext = { result = "ReportDeviceTextSize(&GamePad::GetPathEXT, game, player_index, out_bytes)" }
cna_gamepad_copy_path_ext = { result = "CopyDeviceTextValue(&GamePad::GetPathEXT, game, player_index, destination, capacity, out_bytes)" }
cna_gamepad_get_serial_size_ext = { result = "ReportDeviceTextSize(&GamePad::GetSerialEXT, game, player_index, out_bytes)" }
cna_gamepad_copy_serial_ext = { result = "CopyDeviceTextValue(&GamePad::GetSerialEXT, game, player_index, destination, capacity, out_bytes)" }
cna_keyboard_get_scancode_name_size_ext = { result = "ReportKeyTextSize(&Keyboard::GetScancodeNameEXT, game, key, out_bytes)" }
cna_keyboard_copy_scancode_name_ext = { result = "CopyKeyTextValue(&Keyboard::GetScancodeNameEXT, game, key, destination, capacity, out_bytes)" }
cna_keyboard_get_scancode_from_name_ext = { result = "LookUpKey(&Keyboard::GetScancodeFromNameEXT, game, name, out_key)" }
cna_keyboard_get_key_name_size_ext = { result = "ReportKeyTextSize(&Keyboard::GetKeyNameEXT, game, key, out_bytes)" }
cna_keyboard_copy_key_name_ext = { result = "CopyKeyTextValue(&Keyboard::GetKeyNameEXT, game, key, destination, capacity, out_bytes)" }
cna_keyboard_get_key_from_name_ext = { result = "LookUpKey(&Keyboard::GetKeyFromNameEXT, game, name, out_key)" }
cna_touch_location_get_string_size = { result = "ReportTouchLocationString(location, nullptr, UINT64_C(0), out_bytes, false)" }
cna_touch_location_copy_string = { result = "ReportTouchLocationString(location, destination, capacity, out_bytes, true)" }

[values]
[values.routes]
cna_gamepad_capabilities_init = { value = "SnapshotCapabilities(GamePadCapabilities{})" }
cna_gamepad_buttons_init = { value = "MaskFromNamedButtons(GamePadButtons())" }
cna_gamepad_buttons_equals = { value = "NativeButtons(left).Equals(NativeButtons(right))" }
cna_gamepad_buttons_not_equals = { value = "NativeButtons(left) != NativeButtons(right)" }
cna_gamepad_buttons_get_hash_code = { value = "NativeButtons(buttons).GetHashCode()" }
cna_gamepad_dpad_init = { value = "CNA_GAMEPAD_BUTTON_NONE" }
cna_gamepad_dpad_equals = { value = "NativeDPad(left).Equals(NativeDPad(right))" }
cna_gamepad_dpad_not_equals = { value = "NativeDPad(left) != NativeDPad(right)" }
cna_gamepad_dpad_get_hash_code = { value = "NativeDPad(dpad).GetHashCode()" }
cna_gamepad_state_init = { value = "SnapshotState(GamePadState())" }
cna_keyboard_state_init = { value = "SnapshotKeyboard(KeyboardState())" }
cna_mouse_state_init = { value = "SnapshotMouse(MouseState())" }
cna_gesture_sample_init = { value = "MapGestureSample(GestureSample())" }
cna_touch_location_init = { value = "MapTouchLocation(TouchLocation())" }
cna_gamepad_exclude_axis_dead_zone = { value = "GamePad::ExcludeAxisDeadZone(value, dead_zone)", invalid_if = "!std::isfinite(value) || !std::isfinite(dead_zone)" }
cna_touch_capabilities_init_from_values_ext = { value = "CNA_TouchCapabilities{ sizeof(CNA_TouchCapabilities), StructureVersion, ToCBool(is_connected), {0U, 0U, 0U}, static_cast<uint32_t>(maximum_touch_count) }", invalid_if = "maximum_touch_count < 0" }

[game_pad_state]
lookup = "ValidateGamePadState"

[game_pad_state.routes]
cna_gamepad_state_is_button_down = { get = "(state->pressed_buttons & buttons) == buttons", invalid_if = "(buttons & ~CNA_GAMEPAD_BUTTON_ALL) != 0U" }
cna_gamepad_state_is_button_up = { get = "(state->pressed_buttons & buttons) != buttons", invalid_if = "(buttons & ~CNA_GAMEPAD_BUTTON_ALL) != 0U" }

# The lookup checks the game is active and maps the player index; `object` is that PlayerIndex.
[gamepad]
lookup = "BeginGamePadCall"
object = "PlayerIndex"
arguments = 2

[gamepad.routes]
cna_gamepad_set_vibration = { get = "GamePad::SetVibration(object, left_motor, right_motor)" }
cna_gamepad_set_trigger_vibration_ext = { get = "GamePad::SetTriggerVibrationEXT(object, left_trigger, right_trigger)" }
cna_gamepad_get_player_index_ext = { get = "GamePad::GetPlayerIndexEXT(object)" }
cna_gamepad_set_player_index_ext = { get = "GamePad::SetPlayerIndexEXT(object, static_cast<int>(index))" }
cna_gamepad_get_firmware_version_ext = { get = "GamePad::GetFirmwareVersionEXT(object)" }
cna_gamepad_get_steam_handle_ext = { get = "GamePad::GetSteamHandleEXT(object)" }
cna_gamepad_get_connection_state_ext = { get = "MapConnectionState(GamePad::GetConnectionStateEXT(object))" }
cna_gamepad_get_touchpad_count_ext = { get = "GamePad::GetTouchpadCountEXT(object)" }
cna_gamepad_get_touchpad_finger_count_ext = { get = "GamePad::GetTouchpadFingerCountEXT(object, static_cast<int>(touchpad))" }
