# Audio routes, generated into src/generated/Audio.inc,
# which src/CnaCApiAudio.cpp includes. Format: docs/c-api/GENERATED_ROUTES.md.

[sound_effect]
lookup = "GetSoundEffect"
object = "std::shared_ptr<SoundEffectResource>"

[sound_effect.routes]
cna_sound_effect_get_duration_ticks = { get = "object->value->getDurationProperty().getTicksProperty()" }
cna_sound_effect_get_is_disposed = { get = "object->value->getIsDisposedProperty()" }
cna_sound_effect_get_name_size = { size = "object->value->getNameProperty()" }
cna_sound_effect_copy_name = { copy = "object->value->getNameProperty()" }
cna_sound_effect_get_type_name_size = { size = "object->value->GetTypeName()" }
cna_sound_effect_copy_type_name = { copy = "object->value->GetTypeName()" }
cna_sound_effect_set_name = { call = "object->value->setNameProperty(std::move(name))" }

[sound_effect_instance]
lookup = "GetSoundEffectInstance"
object = "std::shared_ptr<SoundEffectInstanceResource>"

[sound_effect_instance.routes]
cna_sound_effect_instance_play = { call = "object->value->Play()" }
cna_sound_effect_instance_pause = { call = "object->value->Pause()" }
cna_sound_effect_instance_resume = { call = "object->value->Resume()" }
cna_sound_effect_instance_get_is_disposed = { get = "object->value->getIsDisposedProperty()" }
cna_sound_effect_instance_get_type_name_size = { size = "object->value->GetTypeName()" }
cna_sound_effect_instance_copy_type_name = { copy = "object->value->GetTypeName()" }
cna_sound_effect_instance_stop = { call = "object->value->Stop(immediate)" }
cna_sound_effect_instance_set_volume = { call = "object->value->setVolumeProperty(volume)", invalid_if = "!std::isfinite(volume)" }
cna_sound_effect_instance_set_pitch = { call = "object->value->setPitchProperty(pitch)", invalid_if = "!std::isfinite(pitch)" }
cna_sound_effect_instance_set_pan = { call = "object->value->setPanProperty(pan)", invalid_if = "!std::isfinite(pan) || pan < -1.0F || pan > 1.0F" }
cna_sound_effect_instance_get_info = { versioned = true, get = '''
CNA_SoundEffectInstanceInfo{
    sizeof(CNA_SoundEffectInstanceInfo),
    StructureVersion,
    MapSoundState(object->value->getStateProperty()),
    ToCBool(object->value->getIsLoopedProperty()),
    {0U, 0U, 0U},
    object->value->getVolumeProperty(),
    object->value->getPitchProperty(),
    object->value->getPanProperty(),
    0U
}''' }

[game]
lookup = "ValidateActiveGameHandle"

[game.routes]
cna_sound_effect_get_master_volume = { get = "SoundEffect::getMasterVolumeProperty()" }
cna_sound_effect_set_master_volume = { call = "SoundEffect::setMasterVolumeProperty(volume)" }
cna_sound_effect_get_distance_scale = { get = "SoundEffect::getDistanceScaleProperty()" }
cna_sound_effect_set_distance_scale = { call = "SoundEffect::setDistanceScaleProperty(scale)" }
cna_sound_effect_get_doppler_scale = { get = "SoundEffect::getDopplerScaleProperty()" }
cna_sound_effect_set_doppler_scale = { call = "SoundEffect::setDopplerScaleProperty(scale)" }
cna_sound_effect_get_speed_of_sound = { get = "SoundEffect::getSpeedOfSoundProperty()" }
cna_sound_effect_set_speed_of_sound = { call = "SoundEffect::setSpeedOfSoundProperty(speed)" }
cna_microphone_get_count = { get = "Microphone::getAllProperty().size()" }
cna_microphone_check_all_buffers_ext = { call = "Microphone::CheckAllBuffers()" }
# The name belongs to the type, so a machine with no microphone still answers it.
cna_microphone_get_type_name_size = { size = "MicrophoneTypeName" }
cna_microphone_copy_type_name = { copy = "MicrophoneTypeName" }

[sound_effect_to_play]
lookup = "GetSoundEffectToPlay"
object = "std::shared_ptr<SoundEffectResource>"

[sound_effect_to_play.routes]
cna_sound_effect_play = { get = "object->value->Play()" }
# Pan is range-checked by the canonical route and pitch is clamped; the asymmetry is
# reported rather than evened out here.
cna_sound_effect_play_with_settings = { get = "object->value->Play(volume, pitch, pan)" }

[microphone]
lookup = "BorrowMicrophone"
object = "Microphone*"
arguments = 2

[microphone.routes]
cna_microphone_get_name_size_at = { get = "object->Name.size()" }
cna_microphone_copy_name_at = { copy = "object->Name" }
cna_microphone_get_buffer_duration_ticks_at = { get = "object->getBufferDurationProperty().getTicksProperty()" }
cna_microphone_set_buffer_duration_ticks_at = { call = "object->setBufferDurationProperty(System::TimeSpan(static_cast<SharpRuntime::longcs>(ticks)))" }
cna_microphone_get_is_headset_at = { get = "object->getIsHeadsetProperty()" }
cna_microphone_get_sample_rate_at = { get = "object->getSampleRateProperty()" }
cna_microphone_get_state_at = { get = "object->getStateProperty()" }
cna_microphone_start_at = { call = "object->Start()" }
cna_microphone_stop_at = { call = "object->Stop()" }
cna_microphone_get_sample_duration_ticks_at = { get = "object->GetSampleDuration(static_cast<SharpRuntime::intcs>(size_in_bytes)) .getTicksProperty()" }
cna_microphone_get_sample_size_in_bytes_at = { get = "object->GetSampleSizeInBytes(System::TimeSpan(static_cast<SharpRuntime::longcs>(duration_ticks)))" }

[dynamic_instance]
lookup = "BorrowDynamicInstance"
object = "DynamicSoundEffectInstance*"
owner = "std::shared_ptr<SoundEffectInstanceResource>"

[dynamic_instance.routes]
cna_dynamic_sound_effect_instance_get_pending_buffer_count = { get = "object->getPendingBufferCountProperty()" }
cna_dynamic_sound_effect_instance_queue_initial_buffers_ext = { call = "object->QueueInitialBuffers()" }
cna_dynamic_sound_effect_instance_clear_buffers_ext = { call = "object->ClearBuffers()" }
cna_dynamic_sound_effect_instance_update_ext = { call = "object->Update()" }
cna_dynamic_sound_effect_instance_get_sample_duration_ticks = { get = "object->GetSampleDuration(static_cast<SharpRuntime::intcs>(size_in_bytes)).getTicksProperty()" }
cna_dynamic_sound_effect_instance_get_sample_size_in_bytes = { get = "object->GetSampleSizeInBytes(System::TimeSpan(static_cast<SharpRuntime::longcs>(duration_ticks)))" }
cna_dynamic_sound_effect_instance_get_type_name_size = { size = "object->GetTypeName()" }
cna_dynamic_sound_effect_instance_copy_type_name = { copy = "object->GetTypeName()" }

[values]
[values.routes]
cna_audio_emitter_init = { value = "ToCAudioEmitter(AudioEmitter())" }
cna_audio_listener_init = { value = "ToCAudioListener(AudioListener())" }
