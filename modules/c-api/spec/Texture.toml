# Texture routes, generated into src/generated/Texture.inc,
# which src/CnaCApiTexture.cpp includes. Format: docs/c-api/GENERATED_ROUTES.md.

[owned_texture2_d]
lookup = "GetOwnedTexture2D"
object = "std::shared_ptr<Texture2DResource>"

[owned_texture2_d.routes]
cna_texture2d_get_type_name_byte_count = { size = "object->value->GetTypeName()" }
cna_texture2d_get_storage_info = { versioned = true, get = '''
CNA_Texture2DStorageInfo{
    sizeof(CNA_Texture2DStorageInfo),
    StructureVersion,
    ToCBool(object->value->HasRenderer()),
    object->value->GetCpuPixelsWeak().expired() ? CNA_FALSE : CNA_TRUE,
    {0U, 0U, 0U, 0U, 0U, 0U}
}''' }

[calls]
[calls.routes]
cna_texture2d_create_standalone = { result = "CreateStandaloneTexture2D(std::make_shared<Texture2D>(), out_texture)" }
cna_texture2d_copy_type_name = { result = "CopyTypeName(texture, destination, capacity, out_byte_count)" }

[values]
[values.routes]
cna_texture_get_block_size_squared = { value = "Texture::GetBlockSizeSquaredEXT(static_cast<SurfaceFormat>(format))", invalid_if = "!IsSurfaceFormat(format)" }
cna_texture_get_format_size = { value = "Texture::GetFormatSizeEXT(static_cast<SurfaceFormat>(format))", invalid_if = "!IsSurfaceFormat(format)" }
cna_texture_get_pixel_store_alignment = { value = "Texture::GetPixelStoreAlignment(static_cast<SurfaceFormat>(format))", invalid_if = "!IsSurfaceFormat(format)" }
cna_texture_validate_get_data_format = { call = "Texture::ValidateGetDataFormat(static_cast<SurfaceFormat>(format), element_size_in_bytes)", invalid_if = "!IsSurfaceFormat(format) || element_size_in_bytes <= 0" }

[owned_texture]
lookup = "GetOwnedTexture"
object = "TextureResourceView"

[owned_texture.routes]
cna_texture_get_info = { versioned = true, get = '''
CNA_TextureInfo{
    sizeof(CNA_TextureInfo),
    StructureVersion,
    static_cast<uint32_t>(object.value->getLevelCountProperty()),
    static_cast<CNA_SurfaceFormat>(object.value->getFormatProperty())
}''' }

# The routes whose logic is a hand-written helper of the same name, in CamelCase. The
# generated half refuses null out_* outputs, clears handle outputs and checks CNA_Bool
# inputs first; C structures and text reach the helper as the caller passed them.
[helpers]
raw = true

[helpers.routes]
cna_texture2d_create_from_file = { result = "Texture2dCreateFromFile(path, out_texture)" }
cna_texture2d_create_from_file_with_device = { result = "Texture2dCreateFromFileWithDevice(graphics_device, path, out_texture)" }
cna_texture2d_create_from_rgba8 = { result = "Texture2dCreateFromRgba8(graphics_device, width, height, pixels, pixel_count, out_texture)" }
cna_texture2d_create_cpu_only_rgba8 = { result = "Texture2dCreateCpuOnlyRgba8(width, height, format, pixels, pixel_count, out_texture)" }
cna_texture2d_get_data = { result = "Texture2dGetData(texture, data_type, transfer, destination, destination_capacity, out_required_elements)" }
cna_texture2d_create_from_encoded_memory = { result = "Texture2dCreateFromEncodedMemory(graphics_device, encoded_data, encoded_byte_count, decode_info, out_texture)" }
cna_texture2d_get_encoded_byte_count = { result = "Texture2dGetEncodedByteCount(texture, image_format, target_width, target_height, out_byte_count)" }
cna_texture2d_copy_encoded = { result = "Texture2dCopyEncoded(texture, image_format, target_width, target_height, destination, capacity, out_byte_count)" }
cna_texture_validate_format = { result = "TextureValidateFormat(format)" }
cna_texture2d_set_data_rgba8_bytes = { result = "Texture2dSetDataRgba8Bytes(texture, rgba_bytes, pixel_count)" }
cna_texture2d_set_data = { result = "Texture2dSetData(texture, data_type, transfer, data, data_capacity)" }
cna_texture2d_save_file = { result = "Texture2dSaveFile(texture, image_format, path)" }
