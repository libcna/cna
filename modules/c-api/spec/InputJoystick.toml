# InputJoystick routes, generated into src/generated/InputJoystick.inc,
# which src/CnaCApiInputJoystick.cpp includes. Format: docs/c-api/GENERATED_ROUTES.md.

[game]
lookup = "ValidateActiveGameHandle"

[game.routes]
cna_joysticks_get_count = { get = "Joysticks::GetJoysticksEXT().size()" }
cna_joysticks_raise_connected_ext = { call = "Joysticks::ConnectedEXT.Invoke(id)" }
cna_joysticks_raise_disconnected_ext = { call = "Joysticks::DisconnectedEXT.Invoke(id)" }
cna_joysticks_reset_for_tests_ext = { call = "Joysticks::ResetForTests()" }

[state]
lookup = "BorrowState"
object = "std::shared_ptr<JoystickStateEXT>"

[state.routes]
cna_joystick_state_destroy = { release = true }
cna_joystick_state_copy_axes = { result = "CopyElements(object->axes, destination, capacity, out_count, [](const std::int16_t value) { return static_cast<int16_t>(value); })" }
cna_joystick_state_copy_buttons = { result = "CopyElements(object->buttons, destination, capacity, out_count, [](const bool value) { return ToCBool(value); })" }
cna_joystick_state_copy_hats = { result = "CopyElements(object->hats, destination, capacity, out_count, [](const JoystickHatPositionEXT value) { return static_cast<CNA_JoystickHatPosition>(value); })" }
cna_joystick_state_copy_balls = { result = "CopyElements(object->balls, destination, capacity, out_count, [](const Microsoft::Xna::Framework::Point& value) { return CNA::C::Detail::ToC(value); })" }

[enumerated_joystick]
lookup = "BorrowEnumeratedJoystick"
object = "JoystickInfoEXT"
arguments = 2

[enumerated_joystick.routes]
cna_joysticks_get_name_size_at = { get = "object.name.size()" }
cna_joysticks_get_info_at = { get = "MapInfo(object)" }
cna_joysticks_copy_name_at = { copy = "object.name" }

[capabilities]
lookup = "BorrowCapabilities"
object = "JoystickCapabilitiesEXT"
arguments = 2

[capabilities.routes]
cna_joysticks_get_capabilities_name_size = { size = "object.name" }
cna_joysticks_get_capabilities_guid_size = { size = "object.guid" }
cna_joysticks_get_capabilities = { get = "MapCapabilities(object)" }
cna_joysticks_copy_capabilities_name = { copy = "object.name" }
cna_joysticks_copy_capabilities_guid = { copy = "object.guid" }

[calls]
[calls.routes]
cna_joystick_state_get_axis_count = { result = "CountElements(state, out_count, [](const JoystickStateEXT& value) { return value.axes.size(); })" }
cna_joystick_state_get_button_count = { result = "CountElements(state, out_count, [](const JoystickStateEXT& value) { return value.buttons.size(); })" }
cna_joystick_state_get_hat_count = { result = "CountElements(state, out_count, [](const JoystickStateEXT& value) { return value.hats.size(); })" }
cna_joystick_state_get_ball_count = { result = "CountElements(state, out_count, [](const JoystickStateEXT& value) { return value.balls.size(); })" }
cna_joysticks_subscribe_connected_ext = { result = "SubscribeHotplug(Joysticks::ConnectedEXT, JoystickEventKind::Connected, callback, context, out_registration)" }
cna_joysticks_subscribe_disconnected_ext = { result = "SubscribeHotplug(Joysticks::DisconnectedEXT, JoystickEventKind::Disconnected, callback, context, out_registration)" }

[values]
[values.routes]
cna_joystick_info_init = { value = "MapInfo(JoystickInfoEXT())" }
cna_joystick_capabilities_init = { value = "MapCapabilities(JoystickCapabilitiesEXT())" }

[state_pair]
lookup = "BorrowState"
object = "std::shared_ptr<JoystickStateEXT>"
other = { lookup = "BorrowState", object = "std::shared_ptr<JoystickStateEXT>" }

[state_pair.routes]
cna_joystick_state_equals = { get = "*object == *other" }

# The routes whose logic is a hand-written helper of the same name, in CamelCase. The
# generated half refuses null out_* outputs, clears handle outputs and checks CNA_Bool
# inputs first; C structures and text reach the helper as the caller passed them.
[helpers]
raw = true

[helpers.routes]
cna_joystick_info_equals = { result = "JoystickInfoEquals(left, left_name, right, right_name, out_equal)" }
cna_joystick_capabilities_equals = { result = "JoystickCapabilitiesEquals(left, left_name, left_guid, right, right_name, right_guid, out_equal)" }
cna_joysticks_capture_state = { result = "JoysticksCaptureState(game, id, out_state)" }
cna_joysticks_unsubscribe_ext = { result = "JoysticksUnsubscribeExt(registration)" }
