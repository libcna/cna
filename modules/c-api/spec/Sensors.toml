[accelerometer]
lookup = "BorrowSensor<Accelerometer>"
object = "std::shared_ptr<SensorResource<Accelerometer>>"

[accelerometer.routes]
cna_accelerometer_get_state = { get = "object->value->getStateProperty()" }
cna_accelerometer_start = { call = "object->value->Start()" }
cna_accelerometer_stop = { call = "object->value->Stop()" }
cna_accelerometer_dispose = { call = "object->value->Dispose()" }
cna_accelerometer_get_is_data_valid = { get = "object->value->getIsDataValidProperty()" }
cna_accelerometer_get_time_between_updates_ticks = { get = "object->value->getTimeBetweenUpdatesProperty().getTicksProperty()" }
cna_accelerometer_set_time_between_updates_ticks = { call = "object->value->setTimeBetweenUpdatesProperty(System::TimeSpan(static_cast<SharpRuntime::longcs>(ticks)))" }
cna_accelerometer_inject_synthetic_update_ext = { call = "object->value->InjectSyntheticSensorUpdate(x, y, z)" }
cna_accelerometer_set_started_for_tests_ext = { call = "object->value->SetStartedForTesting(started)" }
cna_accelerometer_set_supported_for_tests_ext = { call = "object->value->SetSupportedForTesting(supported)" }
cna_accelerometer_get_subsystem_held_for_tests_ext = { get = "object->value->GetSubsystemHeldForTesting()" }
cna_accelerometer_register_started_instance_for_tests_ext = { call = "Accelerometer::RegisterStartedInstanceForTesting(*object->value)" }
cna_accelerometer_unregister_started_instance_for_tests_ext = { call = "Accelerometer::UnregisterStartedInstanceForTesting(*object->value)" }
cna_accelerometer_get_type_name_size = { size = "object->value->GetTypeName()" }
cna_accelerometer_copy_type_name = { copy = "object->value->GetTypeName()" }
cna_accelerometer_destroy = { release = true }
cna_accelerometer_get_current_value = { get = "MapAccelerometerReadingValue(object->value->getCurrentValueProperty())" }

