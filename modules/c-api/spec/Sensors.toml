# Sensors routes, generated into src/generated/Sensors.inc,
# which src/CnaCApiSensors.cpp includes. Format: docs/c-api/GENERATED_ROUTES.md.

[accelerometer_reading]
lookup = "ToAccelerometerReading"
object = "AccelerometerReading"

[accelerometer_reading.routes]
cna_accelerometer_reading_get_hash_code = { get = "object.GetHashCode()" }
cna_accelerometer_reading_get_string_size = { size = "object.ToString()" }
cna_accelerometer_reading_copy_string = { copy = "object.ToString()" }

