cna_sensors_get_last_error_id_ext = { result = "SensorsGetLastErrorIdExt(out_error_id, out_has_error_id)" }
cna_accelerometer_subscribe_current_value_changed = { result = "AccelerometerSubscribeCurrentValueChanged(sensor, callback, context, out_registration)" }
cna_gyroscope_subscribe_current_value_changed = { result = "GyroscopeSubscribeCurrentValueChanged(sensor, callback, context, out_registration)" }
cna_accelerometer_reading_event_info_equals = { result = "AccelerometerReadingEventInfoEquals(left, right, out_equal)" }
cna_accelerometer_subscribe_reading_changed = { result = "AccelerometerSubscribeReadingChanged(sensor, callback, context, out_registration)" }
cna_compass_subscribe_current_value_changed = { result = "CompassSubscribeCurrentValueChanged(sensor, callback, context, out_registration)" }
cna_compass_set_test_backend_ext = { result = "CompassSetTestBackendExt(sensor, installed, supported)" }
