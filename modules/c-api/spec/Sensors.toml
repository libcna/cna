# Readings built from C fields; the timestamp has no conversion of its own.
[reading_values]
raw = true

[reading_values.routes]
cna_attitude_reading_init_from_values = { value = "MapAttitudeReading(AttitudeReading(pitch, roll, yaw, ToQuaternion(quaternion), ToMatrix(rotation_matrix), ToTimestamp(timestamp)))" }
cna_accelerometer_reading_event_info_init_from_values = { value = "MapAccelerometerReadingEventArgs(AccelerometerReadingEventArgs(x, y, z, ToTimestamp(timestamp)))" }

# The routes whose logic is a hand-written helper of the same name, in CamelCase. The
# generated half refuses null out_* outputs, clears handle outputs and checks CNA_Bool
# inputs first; C structures and text reach the helper as the caller passed them.
[helpers]
raw = true

[helpers.routes]
cna_accelerometer_reading_init = { result = "AccelerometerReadingInit(out_reading)" }
cna_accelerometer_reading_init_from_values = { result = "AccelerometerReadingInitFromValues(timestamp, acceleration, out_reading)" }
cna_gyroscope_reading_init = { result = "GyroscopeReadingInit(out_reading)" }
cna_gyroscope_reading_init_from_values = { result = "GyroscopeReadingInitFromValues(rotation_rate, timestamp, out_reading)" }
cna_compass_reading_init = { result = "CompassReadingInit(out_reading)" }
cna_compass_reading_init_from_values = { result = "CompassReadingInitFromValues(heading_accuracy, magnetic_heading, magnetometer_reading, timestamp, true_heading, out_reading)" }
cna_motion_reading_init = { result = "MotionReadingInit(out_reading)" }
cna_motion_reading_init_from_values = { result = "MotionReadingInitFromValues(attitude, device_acceleration, device_rotation_rate, gravity, timestamp, out_reading)" }
cna_accelerometer_reading_equals = { result = "AccelerometerReadingEquals(left, right, out_equal)" }
cna_gyroscope_reading_equals = { result = "GyroscopeReadingEquals(left, right, out_equal)" }
cna_attitude_reading_equals = { result = "AttitudeReadingEquals(left, right, out_equal)" }
cna_compass_reading_equals = { result = "CompassReadingEquals(left, right, out_equal)" }
