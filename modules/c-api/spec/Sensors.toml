cna_gyroscope_get_is_supported = { get = "Gyroscope::getIsSupportedProperty()" }
cna_gyroscope_set_event_watch_registration_failure_for_tests_ext = { call = "Gyroscope::SetEventWatchRegistrationFailureForTesting(should_fail)" }
cna_gyroscope_get_dispatch_exception_count_for_tests_ext = { get = "Gyroscope::GetDispatchExceptionCountForTesting()" }
