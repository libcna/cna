# Effect, effect-parameter and stock-effect routes, generated into src/generated/Effects.inc,
# which src/CnaCApiEffects.cpp includes. Format: docs/c-api/GENERATED_ROUTES.md.

[annotation]
lookup = "GetAnnotation"
object = "std::shared_ptr<AnnotationResource>"

[annotation.routes]
cna_effect_annotation_copy_name = { copy = "object->value->getNameProperty()" }
cna_effect_annotation_copy_semantic = { copy = "object->value->getSemanticProperty()" }
cna_effect_annotation_get_value_boolean = { get = "object->value->GetValueBoolean()" }
cna_effect_annotation_get_value_int32 = { get = "object->value->GetValueInt32()" }
cna_effect_annotation_get_value_single = { get = "object->value->GetValueSingle()" }
cna_effect_annotation_copy_value_string = { copy = "object->value->GetValueString()" }
cna_effect_annotation_get_value_vector2 = { get = "object->value->GetValueVector2()" }
cna_effect_annotation_get_value_vector3 = { get = "object->value->GetValueVector3()" }
cna_effect_annotation_get_value_vector4 = { get = "object->value->GetValueVector4()" }
cna_effect_annotation_get_value_matrix = { get = "object->value->GetValueMatrix()" }
cna_effect_annotation_get_name_byte_count = { size = "object->value->getNameProperty()" }
cna_effect_annotation_get_semantic_byte_count = { size = "object->value->getSemanticProperty()" }
cna_effect_annotation_get_value_string_byte_count = { size = "object->value->GetValueString()" }

[collection]
lookup = "GetCollection"
object = "std::shared_ptr<AnnotationCollectionResource>"

[collection.routes]
cna_effect_annotation_collection_get_count = { get = "object->value->getCountProperty()" }

[parameter]
lookup = "GetParameter"
object = "std::shared_ptr<ParameterResource>"

[parameter.routes]
cna_effect_parameter_copy_name = { copy = "object->value->getNameProperty()" }
cna_effect_parameter_copy_semantic = { copy = "object->value->getSemanticProperty()" }
cna_effect_parameter_copy_value_string = { copy = "object->value->GetValueString()" }
cna_effect_parameter_get_name_byte_count = { size = "object->value->getNameProperty()" }
cna_effect_parameter_get_semantic_byte_count = { size = "object->value->getSemanticProperty()" }
cna_effect_parameter_get_value_string_byte_count = { size = "object->value->GetValueString()" }

[parameter_collection]
lookup = "GetParameterCollection"
object = "std::shared_ptr<ParameterCollectionResource>"

[parameter_collection.routes]
cna_effect_parameter_collection_get_count = { get = "object->state->value->getCountProperty()" }

[pass]
lookup = "GetPass"
object = "std::shared_ptr<PassResource>"

[pass.routes]
cna_effect_pass_get_index_ext = { get = "object->value->getIndexInternal()" }
cna_effect_pass_copy_name = { copy = "object->value->getNameProperty()" }
cna_effect_pass_apply = { call = "object->value->Apply()" }
cna_effect_pass_get_name_byte_count = { size = "object->value->getNameProperty()" }
cna_effect_pass_get_annotations = { result = "CreateAnnotationCollectionAlias(object->value, &object->value->getAnnotationsProperty(), out_collection)" }

[pass_collection]
lookup = "GetPassCollection"
object = "std::shared_ptr<PassCollectionResource>"

[pass_collection.routes]
cna_effect_pass_collection_get_count = { get = "object->state->value->getCountProperty()" }

[technique]
lookup = "GetTechnique"
object = "std::shared_ptr<TechniqueResource>"

[technique.routes]
cna_effect_technique_get_index_ext = { get = "object->value->getIndexInternal()" }
cna_effect_technique_copy_name = { copy = "object->value->getNameProperty()" }
cna_effect_technique_get_identity = { get = "object->value->getIdInternal()" }
cna_effect_technique_get_name_byte_count = { size = "object->value->getNameProperty()" }
cna_effect_technique_get_annotations = { result = "CreateAnnotationCollectionAlias(object->value, &object->value->getAnnotationsProperty(), out_collection)" }

[technique_collection]
lookup = "GetTechniqueCollection"
object = "std::shared_ptr<TechniqueCollectionResource>"

[technique_collection.routes]
cna_effect_technique_collection_get_count = { get = "object->state->value->getCountProperty()" }

[effect]
lookup = "GetEffect"
object = "std::shared_ptr<EffectResource>"

[effect.routes]
cna_effect_apply = { call = "object->value->Apply()" }
# The runtime itself is renderer-owned implementation, so its presence is what crosses.
cna_effect_get_is_compiled_ext = { get = "object->value->GetCompiledRuntimePtr() != nullptr" }
cna_effect_has_renderer = { get = "object->value->GetEffectRendererPtr() != nullptr" }
cna_effect_is_exact_stock_sprite_effect = { get = "object->value->IsExactStockSpriteEffectEXT()" }
cna_effect_material_create = { result = "CreateEffectHandle(std::make_shared<EffectMaterial>(*object->value), object->parentGame, out_effect)" }
cna_effect_get_parameters = { result = "CreateParameterCollectionHandle(GetEffectState(object)->parameters, out_collection)" }
cna_effect_get_techniques = { result = "CreateTechniqueCollectionHandle(GetEffectState(object)->techniques, out_collection)" }

