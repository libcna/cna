[create_native_parameter]
lookup = "CreateNativeParameter"
object = "std::unique_ptr<EffectParameter>"

[create_native_parameter.routes]
cna_effect_parameter_create = { result = "CreateParameterHandle(std::shared_ptr<EffectParameter>(std::move(object)), std::make_shared<ParameterState>(), out_parameter)" }

[calls]
[calls.routes]
cna_effect_technique_create_default = { result = "CreateTechniqueHandle(std::make_shared<EffectTechnique>(), std::make_shared<TechniqueState>(), out_technique)" }
cna_effect_get_type_name_byte_count = { result = "GetEffectStringByteCount(effect, out_byte_count, [](Effect& effect) -> const std::string& { return effect.GetTypeName(); })" }
cna_effect_copy_type_name = { result = "CopyEffectString(effect, destination, capacity, out_byte_count, [](Effect& effect) -> const std::string& { return effect.GetTypeName(); })" }
cna_effect_get_vertex_source_byte_count = { result = "GetEffectStringByteCount(effect, out_byte_count, [](Effect& effect) -> const std::string& { return effect.GetVertexSource(); })" }
cna_effect_copy_vertex_source = { result = "CopyEffectString(effect, destination, capacity, out_byte_count, [](Effect& effect) -> const std::string& { return effect.GetVertexSource(); })" }
cna_effect_get_fragment_source_byte_count = { result = "GetEffectStringByteCount(effect, out_byte_count, [](Effect& effect) -> const std::string& { return effect.GetFragmentSource(); })" }
cna_effect_copy_fragment_source = { result = "CopyEffectString(effect, destination, capacity, out_byte_count, [](Effect& effect) -> const std::string& { return effect.GetFragmentSource(); })" }
cna_directional_light_create = { result = "CreateDirectionalLightHandle(std::make_shared<DirectionalLight>(), nullptr, out_light)" }

