[pbr_effect]
lookup = "GetPbrEffect"
object = "PbrEffectView"

[pbr_effect.routes]
cna_pbr_effect_get_diffuse_color = { get = "object.pbr != nullptr ? object.pbr->getDiffuseColorProperty() : object.skinned->getDiffuseColorProperty()" }
cna_pbr_effect_get_alpha = { get = "object.pbr != nullptr ? object.pbr->getAlphaProperty() : object.skinned->getAlphaProperty()" }
cna_pbr_effect_get_metallic_factor = { get = "object.pbr != nullptr ? object.pbr->getMetallicFactorProperty() : object.skinned->getMetallicFactorProperty()" }
cna_pbr_effect_get_roughness_factor = { get = "object.pbr != nullptr ? object.pbr->getRoughnessFactorProperty() : object.skinned->getRoughnessFactorProperty()" }
cna_pbr_effect_get_emissive_factor = { get = "object.pbr != nullptr ? object.pbr->getEmissiveFactorProperty() : object.skinned->getEmissiveFactorProperty()" }
cna_pbr_effect_get_ior_ext = { get = "object.pbr != nullptr ? object.pbr->getIorEXTProperty() : object.skinned->getIorEXTProperty()" }
cna_pbr_effect_get_specular_factor_ext = { get = "object.pbr != nullptr ? object.pbr->getSpecularFactorEXTProperty() : object.skinned->getSpecularFactorEXTProperty()" }
cna_pbr_effect_get_specular_color_factor_ext = { get = "object.pbr != nullptr ? object.pbr->getSpecularColorFactorEXTProperty() : object.skinned->getSpecularColorFactorEXTProperty()" }
cna_pbr_effect_get_normal_scale_ext = { get = "object.pbr != nullptr ? object.pbr->getNormalScaleEXTProperty() : object.skinned->getNormalScaleEXTProperty()" }
cna_pbr_effect_get_occlusion_strength_ext = { get = "object.pbr != nullptr ? object.pbr->getOcclusionStrengthEXTProperty() : object.skinned->getOcclusionStrengthEXTProperty()" }
cna_pbr_effect_get_alpha_mode_ext = { get = "object.pbr != nullptr ? object.pbr->getAlphaModeEXTProperty() : object.skinned->getAlphaModeEXTProperty()" }
cna_pbr_effect_get_alpha_cutoff_ext = { get = "object.pbr != nullptr ? object.pbr->getAlphaCutoffEXTProperty() : object.skinned->getAlphaCutoffEXTProperty()" }
cna_pbr_effect_get_vertex_color_enabled_ext = { get = "static_cast<bool>(object.pbr != nullptr ? object.pbr->VertexColorEnabledEXT : object.skinned->VertexColorEnabledEXT)" }
cna_pbr_effect_get_texture = { result = "GetRetainedEffectTexture(GetEffectState(object.resource)->lifetime->pbrTextures[slot], out_has_texture, out_texture, \"The PBR texture outputs are null.\")", invalid_if = "slot > CNA_PBR_TEXTURE_MAXIMUM" }

