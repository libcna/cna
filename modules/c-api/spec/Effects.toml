cna_shader_effect_get_world = { get = "object->getWorldProperty()" }
cna_shader_effect_set_world = { call = "object->setWorldProperty(value)" }
cna_shader_effect_get_view = { get = "object->getViewProperty()" }
cna_shader_effect_set_view = { call = "object->setViewProperty(value)" }
cna_shader_effect_get_projection = { get = "object->getProjectionProperty()" }
cna_shader_effect_set_projection = { call = "object->setProjectionProperty(value)" }

