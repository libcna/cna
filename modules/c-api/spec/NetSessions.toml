# NetSessions routes, generated into src/generated/NetSessions.inc,
# which src/CnaCApiNetSessions.cpp includes. Format: docs/c-api/GENERATED_ROUTES.md.

[session]
lookup = "GetSession"
object = "std::shared_ptr<AvailableSessionResource>"

[session.routes]
cna_available_network_session_copy_host_gamertag = { copy = "object->value->getHostGamertagProperty()" }
cna_available_network_session_copy_connect_address_ext = { copy = "object->value->GetConnectAddress()" }
cna_available_network_session_get_current_gamer_count = { get = "object->value->getCurrentGamerCountProperty()" }
cna_available_network_session_get_host_gamertag_size = { size = "object->value->getHostGamertagProperty()" }
cna_available_network_session_get_open_private_gamer_slots = { get = "object->value->getOpenPrivateGamerSlotsProperty()" }
cna_available_network_session_get_open_public_gamer_slots = { get = "object->value->getOpenPublicGamerSlotsProperty()" }
cna_available_network_session_get_connect_address_size_ext = { size = "object->value->GetConnectAddress()" }
cna_available_network_session_get_connect_port_ext = { get = "object->value->GetConnectPort()" }
cna_available_network_session_get_session_type_ext = { get = "object->value->GetSessionType()" }
cna_available_network_session_copy_session_properties = { result = "CreateOwnedNetworkSessionProperties(object->value->getSessionPropertiesProperty(), out_properties)" }
cna_network_session_join = { result = "CreateSessionResourceHandle(NetworkSession::Join(object->value.get()), out_session)" }
cna_available_network_session_destroy = { release = true }

[collection]
lookup = "GetCollection"
object = "std::shared_ptr<AvailableSessionCollectionResource>"

[collection.routes]
cna_available_network_session_collection_get_count = { get = "object->value->getCountProperty()" }
cna_available_network_session_collection_get_is_disposed = { get = "object->value->getIsDisposedProperty()" }
cna_available_network_session_collection_dispose = { call = "object->value->Dispose()" }
cna_available_network_session_collection_destroy = { release = "object->value->Dispose()" }
cna_available_network_session_collection_copy_session = { result = "CreateSessionHandle(object->value->getItem(index), out_session)", require = 'RequireIndex(index, object->value->getCountProperty(), "The discovered-session index is outside the collection.")' }

[session_network_session]
lookup = "GetSessionResource"
object = "std::shared_ptr<NetworkSessionResource>"

[session_network_session.routes]
cna_network_session_copy_type_name = { copy = "object->value->GetTypeName()" }
cna_network_session_get_is_disposed = { get = "object->value->getIsDisposedProperty()" }
cna_network_session_get_allow_host_migration = { get = "object->value->getAllowHostMigrationProperty()" }
cna_network_session_set_allow_host_migration = { call = "object->value->setAllowHostMigrationProperty(value)" }
cna_network_session_get_allow_join_in_progress = { get = "object->value->getAllowJoinInProgressProperty()" }
cna_network_session_set_allow_join_in_progress = { call = "object->value->setAllowJoinInProgressProperty(value)" }
cna_network_session_get_bytes_per_second_received = { get = "object->value->getBytesPerSecondReceivedProperty()" }
cna_network_session_get_bytes_per_second_sent = { get = "object->value->getBytesPerSecondSentProperty()" }
cna_network_session_get_is_everyone_ready = { get = "object->value->getIsEveryoneReadyProperty()" }
cna_network_session_get_is_host = { get = "object->value->getIsHostProperty()" }
cna_network_session_get_max_gamers = { get = "object->value->getMaxGamersProperty()" }
cna_network_session_set_max_gamers = { call = "object->value->setMaxGamersProperty(static_cast<int>(value))" }
cna_network_session_get_private_gamer_slots = { get = "object->value->getPrivateGamerSlotsProperty()" }
cna_network_session_set_private_gamer_slots = { call = "object->value->setPrivateGamerSlotsProperty(static_cast<int>(value))" }
cna_network_session_get_session_state = { get = "object->value->getSessionStateProperty()" }
cna_network_session_get_session_type = { get = "object->value->getSessionTypeProperty()" }
cna_network_session_get_simulated_latency_ticks = { get = "object->value->getSimulatedLatencyProperty().getTicksProperty()" }
cna_network_session_set_simulated_latency_ticks = { call = "object->value->setSimulatedLatencyProperty(System::TimeSpan(ticks))" }
cna_network_session_get_simulated_packet_loss = { get = "object->value->getSimulatedPacketLossProperty()" }
cna_network_session_set_simulated_packet_loss = { call = "object->value->setSimulatedPacketLossProperty(value)" }
cna_network_session_get_type_name_size = { size = "object->value->GetTypeName()" }
cna_network_session_update = { call = "object->value->Update()" }
cna_network_session_reset_ready = { call = "object->value->ResetReady()" }
cna_network_session_start_game = { call = "object->value->StartGame()" }
cna_network_session_end_game = { call = "object->value->EndGame()" }
cna_network_session_get_owned_gamer_count_ext = { get = "object->value->GetOwnedGamerCountForTesting()" }
cna_network_session_dispose = { call = "object->value->Dispose()" }
cna_network_session_copy_session_properties = { result = "CreateOwnedNetworkSessionProperties(object->value->getSessionPropertiesProperty(), out_properties)" }
cna_network_session_destroy = { release = true, require = 'InvalidStateIf(object->activeGamerViews != 0U, "Every gamer view taken from this session must be released first.")' }

[local_gamer]
lookup = "BorrowLocalGamer"
object = "LocalNetworkGamer*"

[local_gamer.routes]
cna_local_network_gamer_get_is_data_available = { get = "object->getIsDataAvailableProperty()" }
cna_local_network_gamer_send_party_invites = { call = "object->SendPartyInvites()" }
cna_local_network_gamer_clear_packet_queue_ext = { call = "object->ClearPacketQueue()" }
cna_local_network_gamer_get_signed_in_gamer = { result = "CNA::C::Detail::CreateBorrowedSignedInGamer(object->getSignedInGamerProperty(), out_signed_in_gamer)" }

[session_type]
lookup = "ValidateSessionType"

[session_type.routes]
cna_network_session_create = { result = "CreateSessionResourceHandle(NetworkSession::Create(static_cast<NetworkSessionType>(session_type), static_cast<int>(max_local_gamers), static_cast<int>(max_gamers)), out_session)" }

[calls]
[calls.routes]
cna_network_session_join_invited = { result = "CreateSessionResourceHandle(NetworkSession::JoinInvited(static_cast<int>(max_local_gamers)), out_session)" }

[signed_in_gamers]
lookup = "BorrowSignedInGamers"
object = "SignedInGamerList"
arguments = 2

[signed_in_gamers.routes]
cna_network_session_join_invited_with_local_gamers = { result = "CreateSessionResourceHandle(NetworkSession::JoinInvited(object), out_session)" }

[values]
[values.routes]
cna_network_session_get_instance_count_ext = { value = "NetworkSession::GetInstanceCountForTesting()" }
cna_network_session_get_active_action_count_ext = { value = "NetworkSession::GetActiveActionInstanceCountForTesting()" }

[session_pair]
lookup = "GetSession"
object = "std::shared_ptr<AvailableSessionResource>"
other = { lookup = "GetSession", object = "std::shared_ptr<AvailableSessionResource>" }

[session_pair.routes]
cna_available_network_session_equals = { get = "*object->value == *other->value" }
cna_available_network_session_not_equals = { get = "*object->value != *other->value" }

[local_gamer_and_optional_gamer]
lookup = "BorrowLocalGamer"
object = "LocalNetworkGamer*"
other = { lookup = "BorrowOptionalGamer", object = "NetworkGamer*" }

[local_gamer_and_optional_gamer.routes]
cna_local_network_gamer_enable_send_voice = { call = "object->EnableSendVoice(other, enable)" }

[local_gamer_and_packet_writer]
lookup = "BorrowLocalGamer"
object = "LocalNetworkGamer*"
other = { lookup = "CNA::C::Detail::BorrowPacketWriter", object = "Microsoft::Xna::Framework::Net::PacketWriter*" }

[local_gamer_and_packet_writer.routes]
cna_local_network_gamer_send_packet_writer = { call = "object->SendData(*other, static_cast<SendDataOptions>(options))", validate = "ValidateSendOptions(options)" }
