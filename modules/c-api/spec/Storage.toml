# Storage routes, generated into src/generated/Storage.inc,
# which src/CnaCApiStorage.cpp includes. Format: docs/c-api/GENERATED_ROUTES.md.

[device]
lookup = "GetDevice"
object = "std::shared_ptr<StorageDeviceResource>"

[device.routes]
cna_storage_device_get_free_space = { get = "object->value->getFreeSpaceProperty()" }
cna_storage_device_get_is_connected = { get = "object->value->getIsConnectedProperty()" }
cna_storage_device_get_total_space = { get = "object->value->getTotalSpaceProperty()" }
cna_storage_device_destroy = { release = true, require = 'InvalidStateIf(object->openContainers != 0U, "Every container opened from this StorageDevice must be destroyed first.")' }

[container]
lookup = "GetContainer"
object = "std::shared_ptr<StorageContainerResource>"

[container.routes]
cna_storage_container_get_display_name_size = { size = "object->value->getDisplayNameProperty()" }
cna_storage_container_copy_display_name = { copy = "object->value->getDisplayNameProperty()" }
cna_storage_container_get_type_name_size = { size = "object->value->GetTypeName()" }
cna_storage_container_copy_type_name = { copy = "object->value->GetTypeName()" }
cna_storage_container_get_is_disposed = { get = "object->value->getIsDisposedProperty()" }
cna_storage_container_dispose = { call = "object->value->Dispose()" }

[stream]
lookup = "GetStream"
object = "std::shared_ptr<StorageStreamResource>"

[stream.routes]
cna_storage_stream_flush = { call = "object->value->Flush()" }
cna_storage_stream_get_position = { get = "object->value->getPositionProperty()" }
cna_storage_stream_get_length = { get = "object->value->getLengthProperty()" }
cna_storage_stream_get_can_read = { get = "object->value->getCanReadProperty()" }
cna_storage_stream_get_can_write = { get = "object->value->getCanWriteProperty()" }
cna_storage_stream_get_can_seek = { get = "object->value->getCanSeekProperty()" }

[calls]
[calls.routes]
cna_storage_copy_root_ext = { copy = "StorageDevice::GetStorageRootEXT()" }
cna_storage_device_show_selector = { result = "ShowSelector(false, 0U, false, 0, 0, callback, context, out_device)" }
cna_storage_device_show_selector_for_player = { result = "ShowSelector(true, player, false, 0, 0, callback, context, out_device)" }
cna_storage_device_show_selector_with_space = { result = "ShowSelector(false, 0U, true, size_in_bytes, directory_count, callback, context, out_device)" }
cna_storage_device_show_selector_for_player_with_space = { result = "ShowSelector(true, player, true, size_in_bytes, directory_count, callback, context, out_device)" }
cna_storage_container_get_directory_name_count = { result = "CountNames(container, search_pattern, true, out_count)" }
cna_storage_container_copy_directory_name = { result = "CopyName(container, search_pattern, index, true, destination, capacity, out_bytes)" }
cna_storage_container_get_file_name_count = { result = "CountNames(container, search_pattern, false, out_count)" }
cna_storage_container_copy_file_name = { result = "CopyName(container, search_pattern, index, false, destination, capacity, out_bytes)" }
cna_storage_container_open_file = { result = "OpenFileHandle(container, file, file_mode, CNA_FILE_ACCESS_READ_WRITE, CNA_FILE_SHARE_READ_WRITE, 1, out_stream)" }
cna_storage_container_open_file_access = { result = "OpenFileHandle(container, file, file_mode, file_access, CNA_FILE_SHARE_READ_WRITE, 2, out_stream)" }
cna_storage_container_open_file_share = { result = "OpenFileHandle(container, file, file_mode, file_access, file_share, 3, out_stream)" }

[values]
[values.routes]
cna_storage_get_root_size_ext = { size = "StorageDevice::GetStorageRootEXT()" }
cna_storage_set_app_name_ext = { call = "StorageDevice::SetAppNameEXT(app_name)", refuse_nul = ["app_name"] }
