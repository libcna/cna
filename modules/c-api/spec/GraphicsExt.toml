# GraphicsExt routes, generated into src/generated/GraphicsExt.inc,
# which src/CnaCApiGraphicsExt.cpp includes. Format: docs/c-api/GENERATED_ROUTES.md.

[ascii_effect]
lookup = "GetAsciiEffect"
object = "std::shared_ptr<AsciiEffectResource>"
feature = "CNA_CNAEXT"
unavailable = "ExtensionUnavailable()"

[ascii_effect.routes]
cna_ascii_post_process_effect_set_cell_size = { call = "object->value->setCellSize(static_cast<int>(width), static_cast<int>(height))" }
cna_ascii_post_process_effect_get_quantize_mode = { get = "NativeOrdinal(object->value->getQuantizeMode())" }
