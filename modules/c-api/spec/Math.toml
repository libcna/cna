# MathHelper, Point and Rectangle value routes, generated into src/generated/Math.inc,
# which src/CnaCApiMath.cpp includes. Format: docs/c-api/GENERATED_ROUTES.md.

[math]
[math.routes]
cna_math_barycentric = { value = "MathHelper::Barycentric(value1, value2, value3, amount1, amount2)" }
cna_math_catmull_rom = { value = "MathHelper::CatmullRom(value1, value2, value3, value4, amount)" }
cna_math_clamp_float = { value = "MathHelper::Clamp(value, minimum, maximum)" }
cna_math_distance = { value = "MathHelper::Distance(value1, value2)" }
cna_math_hermite = { value = "MathHelper::Hermite(value1, tangent1, value2, tangent2, amount)" }
cna_math_lerp = { value = "MathHelper::Lerp(value1, value2, amount)" }
cna_math_max = { value = "MathHelper::Max(value1, value2)" }
cna_math_min = { value = "MathHelper::Min(value1, value2)" }
cna_math_smooth_step = { value = "MathHelper::SmoothStep(value1, value2, amount)" }
cna_math_to_degrees = { value = "MathHelper::ToDegrees(radians)" }
cna_math_to_radians = { value = "MathHelper::ToRadians(degrees)" }
cna_math_wrap_angle = { value = "MathHelper::WrapAngle(angle)" }
cna_math_clamp_int32 = { value = "MathHelper::Clamp(value, minimum, maximum)" }
cna_math_within_epsilon = { value = "MathHelper::WithinEpsilon(value1, value2)" }

[point]
[point.routes]
cna_point_equals = { value = "left.Equals(right)" }
cna_point_not_equals = { value = "left != right" }
cna_point_get_hash_code = { value = "value.GetHashCode()" }
cna_point_get_string_size = { size = "value.ToString()" }
cna_point_copy_string = { copy = "value.ToString()" }

[rectangle]
[rectangle.routes]
cna_rectangle_equals = { value = "left.Equals(right)" }
cna_rectangle_not_equals = { value = "left != right" }
cna_rectangle_get_hash_code = { value = "value.GetHashCode()" }
cna_rectangle_get_string_size = { size = "value.ToString()" }
cna_rectangle_copy_string = { copy = "value.ToString()" }

# Point and Rectangle arithmetic wraps like XNA's 32-bit integers and is written over the C
# structures themselves (WrapAdd, RectangleRight and their neighbours in CnaCApiMath.cpp).
[point_values]
raw = true

[point_values.routes]
cna_point_init = { value = "CNA_Point{0, 0}" }
cna_point_init_xy = { value = "CNA_Point{x, y}" }
cna_point_add = { value = "CNA_Point{WrapAdd(left.x, right.x), WrapAdd(left.y, right.y)}" }
cna_point_subtract = { value = "CNA_Point{WrapSubtract(left.x, right.x), WrapSubtract(left.y, right.y)}" }
cna_point_multiply = { value = "CNA_Point{WrapMultiply(left.x, right.x), WrapMultiply(left.y, right.y)}" }

[rectangle_values]
raw = true

[rectangle_values.routes]
cna_rectangle_init = { value = "CNA_Rectangle{0, 0, 0, 0}" }
cna_rectangle_init_xywh = { value = "CNA_Rectangle{x, y, width, height}" }
cna_rectangle_get_left = { value = "value.x" }
cna_rectangle_get_right = { value = "RectangleRight(value)" }
cna_rectangle_get_top = { value = "value.y" }
cna_rectangle_get_bottom = { value = "RectangleBottom(value)" }
cna_rectangle_get_location = { value = "CNA_Point{value.x, value.y}" }
cna_rectangle_get_center = { value = "CNA_Point{WrapAdd(value.x, value.width / 2), WrapAdd(value.y, value.height / 2)}" }
cna_rectangle_get_is_empty = { value = "value.x == 0 && value.y == 0 && value.width == 0 && value.height == 0" }
cna_rectangle_contains_xy = { value = "RectangleContainsPoint(value, x, y)" }
cna_rectangle_contains_rectangle = { value = "value.x <= candidate.x && RectangleRight(candidate) <= RectangleRight(value) && value.y <= candidate.y && RectangleBottom(candidate) <= RectangleBottom(value)" }
cna_rectangle_intersects = { value = "RectanglesIntersect(left, right)" }
