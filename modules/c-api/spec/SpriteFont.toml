# SpriteFont routes, generated into src/generated/SpriteFont.inc,
# which src/CnaCApiSpriteFont.cpp includes. Format: docs/c-api/GENERATED_ROUTES.md.

[sprite_font]
lookup = "GetSpriteFont"
object = "std::shared_ptr<SpriteFontResource>"

[sprite_font.routes]
cna_sprite_font_set_default_character = { call = "object->value->setDefaultCharacterProperty(has_value ? std::optional<SharpRuntime::charcs>(static_cast<SharpRuntime::charcs>(value)) : std::nullopt)" }
cna_sprite_font_set_line_spacing = { call = "object->value->setLineSpacingProperty(line_spacing)" }
cna_sprite_font_set_spacing = { call = "object->value->setSpacingProperty(spacing)", invalid_if = "!std::isfinite(spacing)" }

# The routes whose logic is a hand-written helper of the same name, in CamelCase. The
# generated half refuses null out_* outputs, clears handle outputs and checks CNA_Bool
# inputs first; C structures and text reach the helper as the caller passed them.
[helpers]
raw = true

[helpers.routes]
cna_sprite_font_create = { result = "SpriteFontCreate(create_info, out_sprite_font)" }
cna_sprite_font_copy_characters = { result = "SpriteFontCopyCharacters(sprite_font, destination, capacity, out_count)" }
cna_sprite_font_copy_glyphs = { result = "SpriteFontCopyGlyphs(sprite_font, destination, capacity, out_count)" }
cna_sprite_font_measure_utf8 = { result = "SpriteFontMeasureUtf8(sprite_font, text, out_size)" }
cna_sprite_font_get_info = { result = "SpriteFontGetInfo(sprite_font, out_info)" }
cna_sprite_font_destroy = { result = "SpriteFontDestroy(sprite_font)" }
