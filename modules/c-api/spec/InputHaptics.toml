# InputHaptics routes, generated into src/generated/InputHaptics.inc,
# which src/CnaCApiInputHaptics.cpp includes. Format: docs/c-api/GENERATED_ROUTES.md.

[game]
lookup = "ValidateActiveGameHandle"

[game.routes]
cna_haptics_get_count = { get = "Haptics::GetHapticsEXT().size()" }
cna_haptics_get_is_joystick_haptic = { get = "Haptics::IsJoystickHapticEXT(joystick_id)" }
cna_haptics_get_is_mouse_haptic = { get = "Haptics::IsMouseHapticEXT()" }
cna_haptics_open = { result = "PublishDevice(Haptics::OpenEXT(id), out_device)" }
cna_haptics_open_from_joystick = { result = "PublishDevice(Haptics::OpenFromJoystickEXT(joystick_id), out_device)" }
cna_haptics_open_from_mouse = { result = "PublishDevice(Haptics::OpenFromMouseEXT(), out_device)" }

[device]
lookup = "BorrowDevice"
object = "std::shared_ptr<HapticDevice>"

[device.routes]
cna_haptic_device_get_is_open = { get = "object->IsOpenEXT()" }
cna_haptic_device_get_name_size = { size = "object->GetNameEXT()" }
cna_haptic_device_play_rumble = { get = "object->PlayRumbleEXT(strength, length_ms)" }
cna_haptic_device_run_effect = { get = "object->RunEffectEXT(effect_id, iterations)" }
cna_haptic_device_stop_effect = { get = "object->StopEffectEXT(effect_id)" }
cna_haptic_device_destroy_effect = { call = "object->DestroyEffectEXT(effect_id)" }
cna_haptic_device_get_effect_status = { get = "object->GetEffectStatusEXT(effect_id)" }
cna_haptic_device_set_gain = { get = "object->SetGainEXT(gain)" }
cna_haptic_device_set_autocenter = { get = "object->SetAutocenterEXT(autocenter)" }
cna_haptic_device_dispose = { call = "object->Dispose()" }
cna_haptic_device_destroy = { release = true }

[enumerated_haptic]
lookup = "BorrowEnumeratedHaptic"
object = "HapticInfoEXT"
arguments = 2

[enumerated_haptic.routes]
cna_haptics_get_id_at = { get = "object.id" }
cna_haptics_get_name_size_at = { get = "object.name.size()" }

[calls]
[calls.routes]
cna_haptic_device_init_rumble = { result = "ApplyDeviceAction(device, &HapticDevice::InitRumbleEXT, out_applied, \"The rumble initialization output is null.\")" }
cna_haptic_device_stop_rumble = { result = "ApplyDeviceAction(device, &HapticDevice::StopRumbleEXT, out_applied, \"The rumble stop output is null.\")" }
cna_haptic_device_stop_all_effects = { result = "ApplyDeviceAction(device, &HapticDevice::StopAllEffectsEXT, out_applied, \"The stop-all-effects output is null.\")" }
cna_haptic_device_pause = { result = "ApplyDeviceAction(device, &HapticDevice::PauseEXT, out_applied, \"The pause output is null.\")" }
cna_haptic_device_resume = { result = "ApplyDeviceAction(device, &HapticDevice::ResumeEXT, out_applied, \"The resume output is null.\")" }

[values]
[values.routes]
cna_haptic_direction_init = { value = "MapDirection(HapticDirectionEXT())" }
cna_haptic_capabilities_init = { value = "MapCapabilities(HapticCapabilitiesEXT())" }
