cna_bounding_box_contains_point = { value = "value.Contains(point)" }
cna_bounding_box_contains_frustum = { value = "value.Contains(frustum)" }
cna_bounding_box_intersects_frustum = { value = "value.Intersects(frustum)" }
cna_bounding_box_intersects_sphere = { value = "value.Intersects(sphere)" }
cna_bounding_box_intersects_box = { value = "value.Intersects(box)" }
cna_bounding_box_intersects_plane = { value = "value.Intersects(plane)" }
cna_bounding_box_equals = { value = "left.Equals(right)" }
cna_bounding_box_not_equals = { value = "left != right" }
cna_bounding_box_get_hash_code = { value = "value.GetHashCode()" }
cna_bounding_box_get_string_size = { size = "value.ToString()" }
cna_bounding_box_copy_string = { copy = "value.ToString()" }
cna_bounding_box_create_merged = { value = "BoundingBox::CreateMerged(original, additional)" }
