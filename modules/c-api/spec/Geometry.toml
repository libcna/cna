# Plane, Ray and bounding-volume value routes, generated into src/generated/Geometry.inc,
# which src/CnaCApiGeometry.cpp includes. Format: docs/c-api/GENERATED_ROUTES.md.

[plane]
[plane.routes]
cna_plane_init = { value = "Plane()" }
cna_plane_init_abcd = { value = "Plane(a, b, c, d)" }
cna_plane_dot = { value = "plane.Dot(value)" }
cna_plane_dot_coordinate = { value = "plane.DotCoordinate(value)" }
cna_plane_dot_normal = { value = "plane.DotNormal(value)" }
cna_plane_intersects_box = { value = "plane.Intersects(box)" }
cna_plane_intersects_sphere = { value = "plane.Intersects(sphere)" }
cna_plane_intersects_frustum = { value = "plane.Intersects(frustum)" }
cna_plane_equals = { value = "left.Equals(right)" }
cna_plane_not_equals = { value = "left != right" }
cna_plane_get_hash_code = { value = "value.GetHashCode()" }
cna_plane_get_string_size = { size = "value.ToString()" }
cna_plane_copy_string = { copy = "value.ToString()" }
cna_plane_normalize = { value = "Plane::Normalize(value)" }
cna_plane_transform_matrix = { value = "Plane::Transform(value, matrix)" }
cna_plane_transform_quaternion = { value = "Plane::Transform(value, rotation)" }

[vector4]
[vector4.routes]
cna_plane_init_vector4 = { value = "Plane(value)" }

[vector3]
[vector3.routes]
cna_plane_init_normal_d = { value = "Plane(normal, d)" }
cna_plane_init_points = { value = "Plane(a, b, c)" }
cna_ray_init_position_direction = { value = "Ray(position, direction)" }
cna_bounding_box_init_min_max = { value = "BoundingBox(min, max)" }
cna_bounding_sphere_init_center_radius = { value = "BoundingSphere(center, radius)" }

[ray]
[ray.routes]
cna_ray_init = { value = "Ray()" }
cna_ray_equals = { value = "left.Equals(right)" }
cna_ray_not_equals = { value = "left != right" }
cna_ray_get_hash_code = { value = "value.GetHashCode()" }
cna_ray_get_string_size = { size = "value.ToString()" }
cna_ray_copy_string = { copy = "value.ToString()" }

[bounding_box]
[bounding_box.routes]
