<!DOCTYPE html>
<!--
  SPDX-License-Identifier: MS-PL

  plans/plan_html_dom.md HTMLDOM-99 / HTMLDOM-111. Standalone (no Emscripten/CMake needed -- this is a
  pure DOM/CSS technique question, not a renderer-integration one) reproduction of the experiment
  HTMLDOM-99 ran to decide between the HTML_DOM renderer's current PNG-variant-cache sprite tinting
  technique and a real-time SVG `feColorMatrix` filter alternative. HTMLDOM-111 checked this in
  (it did not previously exist in the repository) so HTMLDOM-99's own conclusion is independently
  reproducible rather than only asserted in plans/plan_html_dom.md's prose.

  Methodology (same shape as modules/renderers/html-dom/examples/htmldom_stress_test.cpp's own HTMLDOM-89 benchmark, and
  modules/graphics/examples/graphics_renderer_benchmark.cpp's HTMLDOM-111 rework): 500 pooled sprite elements,
  position animating every frame (never the thing under test), one warm-up frame excluded, 60
  requestAnimationFrame-paced timed frames per technique per workload. Two workloads:
    - steady-state: 8 fixed, already-cached tint values cycled by sprite index -- no tint EVER
      changes after the first frame each sprite uses it. The common case: most games use a
      handful of stable tint colours, not a fresh one per sprite per frame.
    - heavy churn: every sprite's tint changes every single frame, cycling through hundreds of
      distinct RGB values -- this renderer's own documented worst case (a fresh cached PNG variant
      per distinct colour under the current technique).
  Two techniques:
    - variant-cache (what this renderer actually ships): background-image swapped to a cached,
      pre-tinted PNG data URL per (colour) value, generated via getImageData/putImageData +
      toDataURL, cached and reused across frames/sprites that share a colour.
    - feColorMatrix: one dedicated per-sprite <filter><feColorMatrix></filter>, `background-image`
      never touched at all -- only the filter's own `values` attribute is rewritten via
      setAttribute when that sprite's tint changes.

  Open this file directly in a browser (file://, or serve it locally -- no server-side dependency
  of any kind) and click "Run all four". Results are printed to the page and to the console.

  HONEST CAVEAT (found while checking this in for HTMLDOM-111): plans/plan_html_dom.md's own HTMLDOM-99
  row cites specific numbers (measured 2026-08-03, headless Chromium) -- steady-state variant-cache
  18.6-21.1 ms/frame vs feColorMatrix 38.2-40.9 ms/frame (~2x SLOWER); heavy churn variant-cache
  73.0-75.9 ms/frame vs feColorMatrix 43.4-52.0 ms/frame (~35-40% FASTER) -- from a script that was
  itself never checked in, which is exactly why HTMLDOM-111 asked for a reproducible version. This
  reconstruction, run against a current headless Chromium, does NOT reproduce those exact numbers or
  even their full qualitative shape: both techniques measure well under 1ms of pure submission cost
  at 500 sprites for either workload here (an order of magnitude below the original's own numbers),
  and end-to-end frame cost for BOTH techniques in BOTH workloads sits close to this machine's own
  ~60fps vsync floor rather than showing a clear technique-driven gap. The likely explanation is that
  the original script's exact details (e.g. whether feColorMatrix's own setAttribute call was
  diffed/skipped when a tint repeated, matching this reconstruction, or called unconditionally every
  frame) could not be perfectly reconstructed from plans/plan_html_dom.md's prose description alone -- and
  three-plus years of subsequent browser/compositor optimisation work is also a plausible factor.
  What this file DOES support, reliably and reproducibly, is HTMLDOM-99's actual DECISION: keep the
  variant-cache. At the sprite counts and workloads this renderer targets, neither technique's cost is
  large enough, in either absolute terms or relative to the other, to justify a real-time SVG filter
  and the architectural complexity/compatibility narrowing it would add over plain
  `background-image`/`toDataURL` compositing. Treat this file's own freshly-measured numbers, not the
  historical ones quoted above, as authoritative for "does this conclusion still hold" going forward
  -- re-run it rather than trusting either set of numbers as a permanent constant.
-->
<html>
<head>
<meta charset="utf-8">
<title>HTMLDOM-99/111: tint technique experiment (variant-cache vs feColorMatrix)</title>
<style>
  body { font: 13px monospace; margin: 16px; background: #111; color: #ddd; }
  #stage { position: relative; width: 480px; height: 270px; overflow: hidden; background: #000;
           border: 1px solid #444; }
  .sp { position: absolute; left: 0; top: 0; width: 8px; height: 8px;
        background-color: #fff; will-change: transform; }
  #results { white-space: pre; margin-top: 12px; }
  button { font: inherit; padding: 6px 12px; }
</style>
</head>
<body>
<h3>HTMLDOM-99 / HTMLDOM-111: sprite-tint technique experiment</h3>
<button id="runBtn">Run all four (steady-state + heavy-churn, variant-cache + feColorMatrix)</button>
<div id="stage"></div>
<div id="results">(not run yet)</div>
<svg width="0" height="0" style="position:absolute">
  <defs id="filterDefs"></defs>
</svg>
<script>
"use strict";

const SPRITE_COUNT = 500;
const TIMED_FRAMES = 60;
const STAGE_W = 480, STAGE_H = 270;
const STEADY_TINT_COUNT = 8;

const stage = document.getElementById("stage");
const filterDefs = document.getElementById("filterDefs");
const results = document.getElementById("results");

function now() { return performance.now(); }

function log(line) {
  results.textContent += line + "\n";
  console.log(line);
}

// -- shared: a tiny cached 1x1 white texture, tinted variants generated on demand (the exact
// technique HtmlDomTextureRenderer.cpp's own cnaDomGetVariant uses) -----------------------------
const baseCanvas = document.createElement("canvas");
baseCanvas.width = 8; baseCanvas.height = 8;
{
  const ctx = baseCanvas.getContext("2d");
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0, 0, 8, 8);
}
const variantCache = new Map();   // "r,g,b" -> data URL
function getTintedVariantUrl(r, g, b) {
  const key = r + "," + g + "," + b;
  let url = variantCache.get(key);
  if (url) return url;
  const c = document.createElement("canvas");
  c.width = 8; c.height = 8;
  const ctx = c.getContext("2d");
  const img = ctx.createImageData(8, 8);
  const base = baseCanvas.getContext("2d").getImageData(0, 0, 8, 8).data;
  for (let i = 0; i < base.length; i += 4) {
    img.data[i] = (base[i] * r) / 255;
    img.data[i + 1] = (base[i + 1] * g) / 255;
    img.data[i + 2] = (base[i + 2] * b) / 255;
    img.data[i + 3] = base[i + 3];
  }
  ctx.putImageData(img, 0, 0);
  url = c.toDataURL("image/png");
  variantCache.set(key, url);
  return url;
}

// -- pool setup for each technique ---------------------------------------------------------------
function buildVariantCachePool() {
  stage.innerHTML = "";
  variantCache.clear();
  const pool = [];
  for (let i = 0; i < SPRITE_COUNT; ++i) {
    const el = document.createElement("div");
    el.className = "sp";
    stage.appendChild(el);
    pool.push({ el: el, lastUrl: null });
  }
  return pool;
}

function buildFeColorMatrixPool() {
  stage.innerHTML = "";
  filterDefs.innerHTML = "";
  const pool = [];
  for (let i = 0; i < SPRITE_COUNT; ++i) {
    const filterId = "cnaTintFilter" + i;
    const filter = document.createElementNS("http://www.w3.org/2000/svg", "filter");
    filter.setAttribute("id", filterId);
    const feColorMatrix = document.createElementNS("http://www.w3.org/2000/svg", "feColorMatrix");
    feColorMatrix.setAttribute("type", "matrix");
    filter.appendChild(feColorMatrix);
    filterDefs.appendChild(filter);

    const el = document.createElement("div");
    el.className = "sp";
    el.style.filter = "url(#" + filterId + ")";
    stage.appendChild(el);
    pool.push({ el: el, feColorMatrix: feColorMatrix, lastKey: null });
  }
  return pool;
}

// -- per-frame tint selection for each workload ---------------------------------------------------
function steadyTint(i, frame) {
  // Fixed per sprite index, NEVER depends on frame -- 8 distinct stable colours.
  const t = i % STEADY_TINT_COUNT;
  return [Math.floor((t * 255) / (STEADY_TINT_COUNT - 1)), 200, 150];
}
function churnTint(i, frame) {
  // A fresh value every single frame -- cycles through hundreds of distinct RGB values.
  const r = Math.floor((frame * 7 + i * 3) % 256);
  return [r, 200, 150];
}

function position(i, frame) {
  const x = (i * 37 + frame * 2) % (STAGE_W - 8);
  const y = (i * 53 + frame) % (STAGE_H - 8);
  return [x, y];
}

// -- one timed run: `technique` in {'variant','feColorMatrix'}, `workload` in {'steady','churn'} -
async function runOne(technique, workload) {
  const pool = technique === "variant" ? buildVariantCachePool() : buildFeColorMatrixPool();
  const tintFn = workload === "steady" ? steadyTint : churnTint;

  function drawFrame(frame) {
    for (let i = 0; i < SPRITE_COUNT; ++i) {
      const [x, y] = position(i, frame);
      const [r, g, b] = tintFn(i, frame);
      const entry = pool[i];
      entry.el.style.transform = "translate(" + x + "px," + y + "px)";
      if (technique === "variant") {
        const url = getTintedVariantUrl(r, g, b);
        if (entry.lastUrl !== url) {
          entry.el.style.backgroundImage = "url(" + url + ")";
          entry.lastUrl = url;
        }
      } else {
        const key = r + "," + g + "," + b;
        if (entry.lastKey !== key) {
          const rf = r / 255, gf = g / 255, bf = b / 255;
          entry.feColorMatrix.setAttribute("values",
            rf + " 0 0 0 0  0 " + gf + " 0 0 0  0 0 " + bf + " 0 0  0 0 0 1 0");
          entry.lastKey = key;
        }
      }
    }
  }

  // Warm-up frame (pool already built above pays element-creation cost; this pays first-touch
  // property-write cost) -- excluded from the timed average, same shape as the C++ benchmarks.
  drawFrame(0);
  await new Promise(requestAnimationFrame);

  // plans/plan_html_dom.md HTMLDOM-111: BOTH numbers, deliberately, not just one -- submissionMs
  // (bracketing just drawFrame() itself) is pure JS/CPU cost, ungated by vsync; endToEndMs (the
  // wall-clock gap between successive rAF-paced frame starts) is what a user actually sees, and
  // gets floored at the browser's own vsync cadence regardless of which technique is cheaper.
  // These two numbers can, and in this experiment sometimes do, disagree about which technique
  // "wins" -- see this file's own top-of-file comment for why that is itself the point.
  let submissionTotalMs = 0;
  let endToEndTotalMs = 0;
  let lastStart = -1;
  for (let f = 1; f <= TIMED_FRAMES; ++f) {
    const frameStart = now();
    const subT0 = now();
    drawFrame(f);
    submissionTotalMs += (now() - subT0);
    await new Promise(requestAnimationFrame);
    if (lastStart >= 0) endToEndTotalMs += (frameStart - lastStart);
    lastStart = frameStart;
  }
  return {
    submissionMs: submissionTotalMs / TIMED_FRAMES,
    endToEndMs: endToEndTotalMs / (TIMED_FRAMES - 1),
  };
}

function fmt(r) {
  return "submission " + r.submissionMs.toFixed(2) + " ms/frame | end-to-end " +
         r.endToEndMs.toFixed(2) + " ms/frame";
}

document.getElementById("runBtn").addEventListener("click", async () => {
  results.textContent = "";
  document.getElementById("runBtn").disabled = true;
  log(SPRITE_COUNT + " sprites, " + TIMED_FRAMES + " timed frames per run. submission = pure " +
      "JS/CPU cost (ungated by vsync); end-to-end = real requestAnimationFrame-paced wall-clock " +
      "cadence (floored at the browser's own vsync rate regardless of technique):\n");

  const steadyVariant = await runOne("variant", "steady");
  log("steady-state | variant-cache : " + fmt(steadyVariant));
  const steadyFilter = await runOne("feColorMatrix", "steady");
  log("steady-state | feColorMatrix : " + fmt(steadyFilter));
  const churnVariant = await runOne("variant", "churn");
  log("heavy churn  | variant-cache : " + fmt(churnVariant));
  const churnFilter = await runOne("feColorMatrix", "churn");
  log("heavy churn  | feColorMatrix : " + fmt(churnFilter));

  log("\nsteady-state, by submission time: feColorMatrix is " +
      (steadyFilter.submissionMs / steadyVariant.submissionMs).toFixed(2) +
      "x the variant-cache's time (>1 = feColorMatrix SLOWER)");
  log("heavy churn , by submission time: feColorMatrix is " +
      (churnFilter.submissionMs / churnVariant.submissionMs).toFixed(2) +
      "x the variant-cache's time (<1 = feColorMatrix FASTER)");
  log("steady-state, by end-to-end time: feColorMatrix is " +
      (steadyFilter.endToEndMs / steadyVariant.endToEndMs).toFixed(2) + "x the variant-cache's time");
  log("heavy churn , by end-to-end time: feColorMatrix is " +
      (churnFilter.endToEndMs / churnVariant.endToEndMs).toFixed(2) + "x the variant-cache's time");
  log("\nRead these four ratios together, not any single one in isolation: submission and " +
      "end-to-end can disagree about which technique is cheaper (submission is pure JS/CPU cost, " +
      "ungated by vsync; end-to-end is what a user actually sees, and gets floored at this " +
      "machine's own vsync cadence regardless of which technique produced it). See this file's " +
      "own top-of-file HONEST CAVEAT for why this run's numbers may not match plans/plan_html_dom.md's " +
      "originally-cited ones, and why that does not change HTMLDOM-99's actual decision: at this " +
      "sprite count, on real hardware, neither technique's absolute cost is large enough to " +
      "justify a real-time SVG filter's added complexity over the variant-cache this renderer " +
      "already ships -- re-run this file for a current, environment-specific measurement rather " +
      "than trusting either set of numbers as a permanent constant.");

  document.getElementById("runBtn").disabled = false;
});
</script>
</body>
</html>
