name: Devices and Sensors Tests

# DEV-BUILD-003 (devices plan): builds and runs the focused Devices test
# executables on a desktop Linux runner. Hardware-dependent tests remain in
# the executables and self-skip when the corresponding device is unavailable.
#
# Also covers CNA::Devices (Clipboard/FileDialog/MessageBox/
# SystemTray/Camera/DisplayInfo/PowerInfo/SystemInfo/Locale/UrlLauncher —
# modules/devices-ext/tests/CNA/Devices/), the CNAEXT extension surface gated by CNA_DEVICES. Before
# this fix, this job silently never compiled that surface at all (the
# devices-ubsan preset never set CNA_DEVICES=ON). Every CNA::Devices
# test here exercises an injectable device backend (SetBackendForTesting()), not
# real camera/dialog/tray hardware. Camera texture-upload tests still create an OPENGLES3
# GraphicsDevice, so that suite runs against Xvfb below.

on:
  push:
    branches: [next, develop, main]
    paths:
      - 'modules/devices/include/Microsoft/Devices/**'
      - 'modules/devices/src/**'
      - 'modules/devices/tests/Microsoft/Devices/**'
      - 'modules/devices-ext/include/CNA/Devices/**'
      - 'modules/devices-ext/src/**'
      - 'modules/devices-ext/tests/CNA/Devices/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'cmake/**'
      - '.github/workflows/devices-tests.yml'
  pull_request:
    branches: [next, develop, main]
    paths:
      - 'modules/devices/include/Microsoft/Devices/**'
      - 'modules/devices/src/**'
      - 'modules/devices/tests/Microsoft/Devices/**'
      - 'modules/devices-ext/include/CNA/Devices/**'
      - 'modules/devices-ext/src/**'
      - 'modules/devices-ext/tests/CNA/Devices/**'
      - 'CMakeLists.txt'
      - 'CMakePresets.json'
      - 'cmake/**'
      - '.github/workflows/devices-tests.yml'
  workflow_dispatch: {}

concurrency:
  group: devices-tests-${{ github.ref }}
  cancel-in-progress: true

# Read-only: no job here writes to the repository, its releases or its packages.
permissions:
  contents: read

jobs:
  build-and-test:
    name: Build + test (devices-ubsan preset)
    runs-on: ubuntu-latest
    # A cold UBSan build of CnaTests on the hosted runner had reached 90 % when the former
    # 45-minute budget cancelled it (run 37922925862), so no run could finish -- or ever save the
    # compiler cache below that makes the next one warm (CNA Apple M4 AM4-281).
    timeout-minutes: 75
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 2G
    steps:
      # Sibling repos (sharp-runtime, easy-gl, meta-gl) are plain sibling
      # checkouts referenced via add_subdirectory(../x) in CMakeLists.txt, not
      # git submodules of this repo (DEV-BUILD-001) — check each out next to
      # this repo's own checkout so the relative paths resolve.
      - name: Checkout cna_devices
        uses: actions/checkout@v4
        with:
          path: cna_devices
          submodules: true # non-recursive on purpose (DEV-BUILD-001) — avoids
                            # unneeded nested SDL_mixer codec
                            # submodules this project's own CMake args disable

      - name: Choose the sharp-runtime branch
        id: sharp_runtime_branch
        # The branch CNA's own clone_siblings.sh would use, not a pinned commit: the pins here
        # predated components CNA requests (Apple M4 AM4-234).
        run: echo "ref=$(bash cna_devices/scripts/ci/sibling_branch.sh "${{ github.head_ref }} ${{ github.base_ref }} ${{ github.ref_name }}" sharp-runtime)" >> "$GITHUB_OUTPUT"

      - name: Checkout sharp-runtime sibling
        uses: actions/checkout@v4
        with:
          repository: libcna/sharp-runtime
          ref: ${{ steps.sharp_runtime_branch.outputs.ref }}
          path: sharp-runtime

      - name: Checkout easy-gl
        uses: actions/checkout@v4
        with:
          repository: openeggbert/easy-gl
          path: easy-gl

      - name: Checkout meta-gl
        uses: actions/checkout@v4
        with:
          repository: openeggbert/meta-gl
          path: meta-gl

      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev nlohmann-json3-dev \
            build-essential ninja-build pkg-config ccache \
            libasound2-dev libpulse-dev libaudio-dev libfribidi-dev libjack-dev \
            libsndio-dev libx11-dev libxext-dev libxrandr-dev libxcursor-dev \
            libxfixes-dev libxi-dev libxss-dev libxtst-dev libxkbcommon-dev \
            libdrm-dev libgbm-dev libgl1-mesa-dev libgles2-mesa-dev \
            libegl1-mesa-dev libdbus-1-dev libibus-1.0-dev libudev-dev \
            libthai-dev libwayland-dev libdecor-0-dev xvfb xauth \
            libavcodec-dev libavformat-dev libavutil-dev libswresample-dev

      # Vendored SDL3/SDL_mixer are built from source on first
      # configure (~6-7 minutes, DEV-BUILD-001) into .sdl-prebuilt-Linux-x86_64/;
      # every later configure/build reuses that cache. Key it off the exact
      # submodule commits so a submodule bump invalidates it automatically.
      - name: Cache vendored SDL prebuilt tree
        uses: actions/cache@v4
        with:
          path: cna_devices/.sdl-prebuilt-Linux-x86_64
          key: sdl-prebuilt-linux-x86_64-${{ hashFiles('cna_devices/third_party/SDL/**', 'cna_devices/third_party/SDL_mixer/**') }}

      - name: Cache the compiler cache
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-devices-ubsan-${{ github.sha }}
          restore-keys: ccache-devices-ubsan-

      - name: Configure (devices-ubsan preset)
        working-directory: cna_devices
        run: cmake --preset devices-ubsan

      - name: Build focused Devices targets
        working-directory: cna_devices
        run: >-
          cmake --build --preset devices-ubsan --parallel 2 --target
          CnaDevicesTests CnaDevicesExtTests cna_strict_xna_api_check

      - name: Run Devices/Sensors test suite
        working-directory: cna_devices
        env:
          SDL_AUDIODRIVER: dummy
        run: ./cmake-build-devices-ubsan/CnaDevicesTests

      # Separate step (not merged into the filter above) so a failure here is
      # attributable to the CNA::Devices surface specifically, not the Microsoft::Devices one.
      - name: Run CNA::Devices test suite
        working-directory: cna_devices
        env:
          SDL_VIDEODRIVER: x11
          SDL_AUDIODRIVER: dummy
        run: xvfb-run -a ./cmake-build-devices-ubsan/CnaDevicesExtTests

      # Task DEVPERF-001: this job is this project's clean-room reproducibility
      # evidence -- a fresh actions/checkout (no access to any contributor's
      # own working tree), submodules initialized via the checkout step above,
      # configuring every step CMake itself would refuse to skip (both
      # cmake/ThirdPartySDL.cmake and cmake/UnitTests.cmake now hard-fail with
      # an actionable FATAL_ERROR if a required vendored directory is empty --
      # e.g. from a plain ZIP/tarball export, which structurally cannot
      # contain submodule content at all). Building and running the strict
      # XNA API surface check here, in addition to the gtest suite above, is
      # the other half of the required work this task calls for.
      - name: Run strict XNA API surface check
        working-directory: cna_devices
        run: ./cmake-build-devices-ubsan/cna_strict_xna_api_check
