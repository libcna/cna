# plan_dx.md DX-90/DX-114 and plan_direct2d.md D2D-22: this job provides ONLY the "MSVC-compile/unit-test/shader-generation-
# check" subset those rows explicitly call out as something a GitHub-hosted Windows CI runner CAN
# usefully cover -- it is NOT a substitute for DX-90/DX-114 themselves, which need real swap-chain/
# tearing/device-lost/driver-parity verification on a machine with a real display and a real GPU
# driver (a typical CI runner doesn't reliably provide either). What this job DOES provide is
# genuinely new, real information no amount of Wine+DXVK/vkd3d-proton testing could: the D3D11/
# D3D12 renderers have, until now, only ever been built with MinGW-w64 g++ and run through Wine's
# translation layers. This job builds with native MSVC (a completely different compiler) and runs
# the renderer's off-screen smoke/common CTest suites directly against real Windows D3D11/D3D12
# runtime DLLs (no Wine involved at all). The Direct2D leg additionally runs the public 2D parity
# executable with ColorMatrix/Premultiply and bounded-copy/Porter-Duff composites enabled; it is a native-runtime
# regression gate, not a claim of physical-display, DPI, or driver-parity coverage. The D3D legs
# also recompile every checked-in HLSL shader against a real D3DCOMPILER_47.dll.
#
# Deliberately workflow_dispatch-only (manual): Windows GitHub-hosted runners are slower and more
# expensive than this project's existing Linux CI (devices-tests.yml/input-ci.yml). This workflow
# itself is a narrow, project-owner-approved exception to this project's general "no CI
# automation" stance, scoped specifically to D3D11/D3D12 MSVC verification -- not a precedent for
# broader automatic-trigger CI elsewhere in this project.
#
# CnaTests (the full gtest suite) is a KNOWN, pre-existing, deliberately out-of-scope gap on any
# Windows toolchain, MSVC included -- roughly 10 test files call POSIX-only ::setenv(), which MSVC
# also lacks (see plan_dx.md DX-15's own row; fixing this project-wide is a separate, much larger
# task, not attempted here). This job does not build or run CnaTests -- only the D3D11/D3D12
# renderers' own self-contained smoke/common CTest executables (registered by the cna_directx11_test()/
# cna_directx12_test() CMake macros), which do not depend on CnaTests at all.

name: Windows graphics CI (D3D11/D3D12/Direct2D, MSVC)

on:
  workflow_dispatch: {}

jobs:
  msvc-build-and-test:
    name: ${{ matrix.renderer }} (native MSVC, windows-latest)
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        renderer: [DIRECTX11, DIRECTX12, DIRECT2D]
    defaults:
      run:
        shell: bash
    steps:
      # Sibling repos (sharp-runtime, easy-gl, meta-gl) are plain sibling checkouts referenced via
      # add_subdirectory(../x) in CMakeLists.txt, not git submodules of this repo -- same pattern
      # devices-tests.yml/input-ci.yml already use.
      - name: Checkout cna_graphics
        uses: actions/checkout@v4
        with:
          path: cna_graphics
          submodules: true

      - name: Checkout sharp-runtime
        uses: actions/checkout@v4
        with:
          repository: openeggbert/sharp-runtime
          path: sharp-runtime

      - name: Checkout easy-gl
        uses: actions/checkout@v4
        with:
          repository: openeggbert/easy-gl
          path: easy-gl

      - name: Checkout meta-gl
        uses: actions/checkout@v4
        with:
          repository: openeggbert/meta-gl
          path: meta-gl

      # Sets up cl.exe/link.exe/nmake (and D3DCOMPILER_47.dll's own import lib, d3dcompiler.lib)
      # on PATH for every later step in this job, not just one -- writes to GITHUB_PATH/GITHUB_ENV.
      - name: Set up MSVC developer environment (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up Ninja
        uses: seanmiddleditch/gha-setup-ninja@v4

      - name: Record SDL submodule commit (for the cache key)
        id: sdlsha
        run: echo "sha=$(git -C cna_graphics/third_party/SDL rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # SDL3/SDL3_image/SDL3_mixer are built once from the vendored third_party/SDL* submodules at
      # CMake-configure time (cmake/ThirdPartySDL.cmake's cna_configure_vendored_sdl(), a general,
      # non-MinGW-specific mechanism keyed on CMAKE_SYSTEM_NAME/CMAKE_SYSTEM_PROCESSOR) -- cache it
      # the same way the existing Linux workflows cache theirs, since it's a genuine multi-minute
      # one-time build untested until now on a native-MSVC path.
      - name: Cache vendored SDL prebuilt tree
        uses: actions/cache@v4
        with:
          path: cna_graphics/.sdl-prebuilt-Windows-*
          key: sdl-prebuilt-windows-msvc-${{ steps.sdlsha.outputs.sha }}

      # D2D-123: fail fast, before spending any build time, if a Direct2D-relevant build command
      # regresses to an unbounded (or >2) parallel job count. Runs once regardless of matrix.renderer
      # since the checked files are not renderer-specific.
      - name: Verify Direct2D build commands cap parallelism at 2
        if: matrix.renderer == 'DIRECT2D'
        working-directory: cna_graphics
        run: bash scripts/verify-direct2d-parallel-jobs.sh

      # D2D-132: a plan row whose evidence no longer exists is worse than no row at all, so the
      # status/evidence consistency of plan_direct2d.md is a build step, not a review habit.
      - name: Verify the Direct2D plan matches its evidence
        if: matrix.renderer == 'DIRECT2D'
        working-directory: cna_graphics
        run: python scripts/validate_direct2d_plan.py .

      # D2D-127: a mutation whose anchor text no longer exists is a silent no-op that would
      # "survive" for a reason unrelated to test coverage. The dry run needs no build, so it fails
      # fast here; the full apply/build/expect-failure pass is a deliberate manual run.
      - name: Verify the Direct2D mutation anchors still apply
        if: matrix.renderer == 'DIRECT2D'
        working-directory: cna_graphics
        run: python scripts/direct2d_mutation_check.py --dry-run .

      # D2D-113/D2D-124: prove the debug-layer/live-object parser itself still classifies its
      # committed positive and negative fixtures correctly before it is trusted to gate this run.
      - name: Self-test the Direct2D debug-layer log gate
        if: matrix.renderer == 'DIRECT2D'
        working-directory: cna_graphics
        run: python scripts/verify-direct2d-debug-log.py --self-test .

      # CNA_BUILD_EXAMPLES=OFF / CNA_ENABLE_NET=OFF: keeps this job scoped to exactly what it's
      # meant to verify (CNA core + the D3D11/D3D12 renderer + their own CTest executables) --
      # demos/tools (cna_reference_dump, cna_demo_2d, ...) and networking are real, separate parts
      # of this project not relevant to a D3D11/D3D12 MSVC-verification job, and needlessly widen
      # the surface a first-ever native-MSVC configure could fail on for unrelated reasons.
      - name: Configure (native MSVC, ${{ matrix.renderer }})
        working-directory: cna_graphics
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCNA_GRAPHICS_RENDERER=${{ matrix.renderer }} \
            -DCNA_BUILD_TESTS=ON \
            -DCNA_BUILD_EXAMPLES=OFF \
            -DCNA_ENABLE_NET=OFF

      # D2D-123: never an unbounded job count, even on a dedicated hosted runner -- capped the same
      # as every locally documented Direct2D build command.
      - name: Build CNA + ${{ matrix.renderer }} renderer + CTest executables
        working-directory: cna_graphics
        run: cmake --build build --parallel 2

      # D3D11_CREATE_DEVICE_DEBUG depends on Windows' Graphics Tools capability. Hosted-image
      # contents change over time, so make the native audit deterministic instead of assuming the
      # SDK layers happen to be preinstalled on the current windows-latest image.
      - name: Ensure DirectX Graphics Tools debug layers
        if: matrix.renderer == 'DIRECT2D'
        shell: pwsh
        run: |
          $graphicsTools = Get-WindowsCapability -Online |
            Where-Object Name -Like 'Tools.Graphics.DirectX*' |
            Select-Object -First 1
          if ($null -eq $graphicsTools) {
            throw 'Windows did not expose the Tools.Graphics.DirectX capability.'
          }
          if ($graphicsTools.State -ne 'Installed') {
            Add-WindowsCapability -Online -Name $graphicsTools.Name
          }

      # D2D-125: this runner is a headless, non-interactive Windows session. Record what it can
      # and cannot physically observe, so no later reading of the artifact can mistake a green run
      # here for display, DPI, or multi-monitor evidence. The facts are recorded rather than
      # asserted: a runner image that gains a real interactive desktop should be visible as a
      # change in this file, not silently absorbed.
      - name: Record display and session limitations of this runner
        if: matrix.renderer == 'DIRECT2D'
        shell: pwsh
        working-directory: cna_graphics
        run: |
          New-Item -ItemType Directory -Force build/direct2d-native-diagnostics | Out-Null
          $output = @()
          $output += "InteractiveSession=$([Environment]::UserInteractive)"
          $output += "SessionName=$($env:SESSIONNAME)"
          Add-Type -AssemblyName System.Windows.Forms
          $screens = [System.Windows.Forms.Screen]::AllScreens
          $output += "MonitorCount=$($screens.Count)"
          foreach ($screen in $screens) {
            $output += "Monitor=$($screen.DeviceName);Bounds=$($screen.Bounds);Primary=$($screen.Primary)"
          }
          $output += "SystemDpiHint=$([System.Windows.Forms.SystemInformation]::IconSize)"
          $output += "ProvesPhysicalPresentation=false"
          $output += "ProvesDpiScaling=false"
          $output += "ProvesMultiMonitor=false"
          $output += "Rationale=headless non-interactive CI session; see docs/direct2d-release-gate.md criteria 4 and 5"
          $output | Tee-Object -FilePath build/direct2d-native-diagnostics/runner-limits.txt

      - name: Record native Direct2D runtime and adapter environment
        if: matrix.renderer == 'DIRECT2D'
        shell: pwsh
        working-directory: cna_graphics
        run: |
          New-Item -ItemType Directory -Force build/direct2d-native-diagnostics | Out-Null
          $output = @()
          $os = Get-CimInstance Win32_OperatingSystem
          $output += "WindowsCaption=$($os.Caption)"
          $output += "WindowsVersion=$($os.Version)"
          $output += "WindowsBuild=$($os.BuildNumber)"
          foreach ($dllName in @('d2d1.dll', 'd3d11.dll', 'dxgi.dll')) {
            $dll = Get-Item (Join-Path $env:WINDIR "System32/$dllName")
            $output += "$dllName=$($dll.VersionInfo.FileVersion)"
          }
          foreach ($adapter in Get-CimInstance Win32_VideoController) {
            $output += "Adapter=$($adapter.Name);PNPDeviceID=$($adapter.PNPDeviceID);DriverVersion=$($adapter.DriverVersion)"
          }
          $output | Tee-Object -FilePath build/direct2d-native-diagnostics/environment.txt

      # CMAKE_CROSSCOMPILING is false here (native MSVC, not the MinGW cross-compile toolchain
      # file), so every renderer's registered CTest executable runs directly against Windows DLLs
      # with no Wine wrapper. Direct2D consequently does not set its Wine/Proton skip variables.
      - name: Run ${{ matrix.renderer }} CTest suite (real Windows, no Wine)
        if: matrix.renderer != 'DIRECT2D'
        working-directory: cna_graphics
        run: ctest --test-dir build -L ${{ matrix.renderer }} --output-on-failure

      # D2D-22/D2D-27: require the native debug layers instead of silently dropping their flags.
      # Verbose output preserves effect/composite probes, adapter selection, transient-resource
      # high-water counts and ReportLiveDeviceObjects messages in the uploaded audit artifact.
      - name: Run Direct2D native debug-layer suite (no compatibility skips)
        if: matrix.renderer == 'DIRECT2D'
        working-directory: cna_graphics
        run: |
          CNA_DIRECT2D_DEBUG_LAYER=1 \
          CNA_DIRECT2D_DIAGNOSTICS=1 \
          ctest --test-dir build -L Direct2D --verbose 2>&1 \
            | tee build/direct2d-native-diagnostics/hardware-debug-ctest.log

      # Force the software adapter explicitly as a second lifetime pass. This proves that the
      # documented hardware->WARP fallback is not merely dead code and gives its own timing/live-
      # object log without doubling every pixel test in the main native gate.
      - name: Run Direct2D lifetime audit on forced WARP
        if: matrix.renderer == 'DIRECT2D'
        working-directory: cna_graphics
        run: |
          CNA_DIRECT2D_DEBUG_LAYER=1 \
          CNA_DIRECT2D_DIAGNOSTICS=1 \
          CNA_DIRECT2D_FORCE_WARP=1 \
          ctest --test-dir build -R '^Direct2D_Lifetime$' --verbose 2>&1 \
            | tee build/direct2d-native-diagnostics/warp-debug-lifetime-ctest.log

      # D2D-113/D2D-124: the two logs above are a GATE, not just an artifact. The parser fails the
      # job on a debug-layer ERROR/CORRUPTION message, on a live D3D11 object outside the
      # documented whitelist, and on a run whose diagnostics/debug layer silently never engaged.
      - name: Gate on Direct2D debug-layer errors and live objects
        if: matrix.renderer == 'DIRECT2D'
        working-directory: cna_graphics
        run: |
          python scripts/verify-direct2d-debug-log.py \
            build/direct2d-native-diagnostics/hardware-debug-ctest.log \
            build/direct2d-native-diagnostics/warp-debug-lifetime-ctest.log

      - name: Upload Direct2D native validation artifact
        if: always() && matrix.renderer == 'DIRECT2D'
        uses: actions/upload-artifact@v4
        with:
          name: direct2d-native-debug-${{ github.run_id }}-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            cna_graphics/build/direct2d-native-diagnostics/
            cna_graphics/build/Testing/Temporary/LastTest.log

      # DX-90/DX-114's own "shader-generation check" -- only needs to run once (the HLSL sources
      # and hlsl_compiler_tool.cpp are shared D3DCommon content, not renderer-specific), so gated to
      # the D3D11 matrix leg to avoid doing it twice.
      - name: Verify all 20 HLSL shaders against a real D3DCOMPILER_47.dll
        if: matrix.renderer == 'DIRECTX11'
        working-directory: cna_graphics
        run: python scripts/verify_hlsl_shaders_native_msvc.py
