# DX9 plan (D9-*): builds the DIRECTX9 renderer with native MSVC (a completely different compiler from
# the MinGW-w64 cross-builds this project otherwise uses) and runs its off-screen smoke CTest suite
# directly against the real Windows D3D9 runtime, with no Wine involved. RRC-051 added an SDLGPU
# leg: SDLGPU is the default renderer on Windows, SDL drives Direct3D 12 underneath it, and after
# the retired DIRECTX11 no CI built it with native MSVC at all. It is NOT a substitute for
# real swap-chain/device-lost/driver-parity verification on a machine with a display and a GPU
# driver, which a hosted runner does not reliably provide.
#
# Deliberately workflow_dispatch-only (manual): this remains the focused DIRECTX9 qualification
# workflow. The automatic current-head compiler and SDLGPU baseline is
# windows-msvc-ci.yml and consumes the same checked-in CMake presets developers use locally.
#
# The DIRECTX9 leg builds only the renderer's own self-contained CTest executables (label
# DIRECTX9), not CnaTests. The SDLGPU leg builds and runs the focused smoke set in
# scripts/ci/run-sdlgpu-smoke.sh -- device, swapchain, drawing and read-back through SDL3's windows
# video driver and its Direct3D 12 backend, on whatever Direct3D 12 adapter the hosted runner
# offers -- and fails unless every program exits 0, so a runner on which the device cannot be created
# fails the leg instead of skipping. It is a smoke set; the full native-Windows SDLGPU (Direct3D
# 12) qualification is a separate campaign (handoff.md section 5.2).

name: Windows graphics CI (D3D9 + SDLGPU, MSVC)

on:
  workflow_dispatch: {}

# Read-only: no job here writes to the repository, its releases or its packages.
permissions:
  contents: read

jobs:
  msvc-build-and-test:
    name: ${{ matrix.renderer }} (native MSVC, windows-latest)
    runs-on: windows-latest
    # Measured 2026-10-06: two jobs of a cold MSVC build reach ~1950 of ~2160 steps in 55 minutes,
    # so the former 60-minute limit cancelled the build before any test ran.
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include:
          - renderer: DIRECTX9
          - renderer: SDLGPU
    defaults:
      run:
        shell: bash
    steps:
      # Sibling repos (sharp-runtime, easy-gl, meta-gl) are plain sibling checkouts referenced via
      # add_subdirectory(../x) in CMakeLists.txt, not git submodules of this repo. They are cloned
      # at the branch matching this run (scripts/ci/clone_siblings.sh, as every other workflow
      # does), not at their default branches: a default-branch sharp-runtime lacked the
      # `Resources` component CNA has required since 2026-09-20, and this job failed at configure.
      - name: Checkout cna_graphics
        uses: actions/checkout@v4
        with:
          path: cna_graphics
          submodules: true

      - name: Clone public sibling repositories
        run: |
          set -euo pipefail
          # The script clones beside the CNA checkout it is handed, i.e. into the workspace root.
          GITHUB_WORKSPACE="${GITHUB_WORKSPACE}/cna_graphics" bash cna_graphics/scripts/ci/clone_siblings.sh \
            "${{ github.head_ref }} ${{ github.base_ref }} ${{ github.ref_name }}" sharp-runtime easy-gl meta-gl

      # Sets up cl.exe/link.exe/nmake (and D3DCOMPILER_47.dll's own import lib, d3dcompiler.lib)
      # on PATH for every later step in this job, not just one -- writes to GITHUB_PATH/GITHUB_ENV.
      - name: Set up MSVC developer environment (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up Ninja
        uses: seanmiddleditch/gha-setup-ninja@v4

      - name: Record SDL submodule commit (for the cache key)
        id: sdlsha
        run: echo "sha=$(git -C cna_graphics/third_party/SDL rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # SDL3/SDL3_mixer are built once from the vendored third_party/SDL* submodules at
      # CMake-configure time (cmake/ThirdPartySDL.cmake's cna_configure_vendored_sdl(), a general,
      # non-MinGW-specific mechanism keyed on CMAKE_SYSTEM_NAME/CMAKE_SYSTEM_PROCESSOR) -- cache it
      # the same way the existing Linux workflows cache theirs, since it's a genuine multi-minute
      # one-time build untested until now on a native-MSVC path.
      - name: Cache vendored SDL prebuilt tree
        uses: actions/cache@v4
        with:
          path: cna_graphics/.sdl-prebuilt-Windows-*
          key: sdl-prebuilt-windows-msvc-${{ steps.sdlsha.outputs.sha }}

      # CNA_BUILD_EXAMPLES=OFF / CNA_ENABLE_NET=OFF: keeps this job scoped to exactly what it's
      # meant to verify (CNA core + the renderer + its own CTest executables) -- demos/tools and
      # networking are separate parts of this project that only widen the surface a native-MSVC
      # configure could fail on for unrelated reasons.
      - name: Configure (native MSVC, ${{ matrix.renderer }})
        working-directory: cna_graphics
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCNA_GRAPHICS_RENDERER=${{ matrix.renderer }} \
            -DCNA_BUILD_TESTS=ON \
            -DCNA_BUILD_EXAMPLES=OFF \
            -DCNA_ENABLE_NET=OFF

      # Never an unbounded job count, even on a dedicated hosted runner.
      - name: Build CNA + ${{ matrix.renderer }} renderer + CTest executables
        if: matrix.renderer == 'DIRECTX9'
        working-directory: cna_graphics
        run: cmake --build build --parallel 2

      # The SDLGPU leg builds only its smoke set: every SDLGPU example would be ~200 more links.
      - name: Build CNA + the SDLGPU smoke set
        if: matrix.renderer == 'SDLGPU'
        working-directory: cna_graphics
        run: cmake --build build --parallel 2 --target $(bash scripts/ci/run-sdlgpu-smoke.sh --targets)

      # CMAKE_CROSSCOMPILING is false here (native MSVC, not the MinGW cross-compile toolchain
      # file), so every renderer's registered CTest executable runs directly against Windows DLLs
      # with no Wine wrapper.
      - name: Run ${{ matrix.renderer }} CTest suite (real Windows, no Wine)
        if: matrix.renderer == 'DIRECTX9'
        working-directory: cna_graphics
        run: ctest --test-dir build -L ${{ matrix.renderer }} --output-on-failure

      - name: Run the SDLGPU smoke set on Direct3D 12 (real Windows, no Wine)
        if: matrix.renderer == 'SDLGPU'
        working-directory: cna_graphics
        env:
          SDL_VIDEODRIVER: windows
          SDL_AUDIODRIVER: dummy
          SDL_GPU_DRIVER: direct3d12
        run: bash scripts/ci/run-sdlgpu-smoke.sh build
