# plan_binding.md CBIND-043: the C API coverage matrix as a gate.
#
# The coverage inventory is generated from every public Microsoft/** and CNA/** header in the
# repository. Its value is entirely in being CURRENT. Only its compact summary and full-inventory
# hash are tracked; the multi-megabyte per-symbol Markdown is a CI/local build artifact.
#
# So the rule this job enforces is the one CBIND-043 states: new public C++ API cannot land without
# its C API row. A change that adds a public symbol and not its mapping makes this fail before any
# report is written.
#
# Deliberately build-free. The check reads headers and Doxygen's XML inventory and compiles nothing,
# so it needs no renderer, no display or C API build -- which is what lets it run on every relevant
# integration push instead of being reserved for a nightly.

name: C API coverage gate

on:
  push:
    branches: [next, develop, main]
    paths:
      - 'modules/**/include/Microsoft/**'
      - 'modules/**/include/CNA/**'
      - 'docs/c-api/COVERAGE.md'
      - 'tools/c-api/coverage_mappings.json'
      - 'tools/c-api/generate_coverage_inventory.py'
      - 'plans/plan_binding.md'
      - '.github/workflows/c-api-coverage-gate.yml'
  pull_request:
    branches: [next, develop, main]
    paths:
      - 'modules/**/include/Microsoft/**'
      - 'modules/**/include/CNA/**'
      - 'docs/c-api/COVERAGE.md'
      - 'tools/c-api/coverage_mappings.json'
      - 'tools/c-api/generate_coverage_inventory.py'
      - 'plans/plan_binding.md'
  workflow_dispatch:

concurrency:
  group: c-api-coverage-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  coverage-matrix:
    name: C API mappings cover the public headers
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # The inventory preprocesses CNA headers rather than merely grepping declarations.
      # Prop.hpp defines DEF_PROP's embedded public: labels, so omitting the sibling changes the
      # apparent visibility of members and produces a different, invalid public-surface inventory.
      - name: Clone sharp-runtime parser dependency
        run: |
          git clone --depth 1 --branch develop \
            https://github.com/openeggbert/sharp-runtime.git \
            "${GITHUB_WORKSPACE}/../sharp-runtime"

      - name: Install Doxygen inventory dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends doxygen

      # This rebuilds and validates the complete inventory in memory, then checks only the compact
      # tracked summary and the hash of that full matrix.
      - name: Check the coverage inventory is current
        run: python3 tools/c-api/generate_coverage_inventory.py --check

      # Regenerating must leave the tracked summary unchanged and emit the full ignored artifact.
      - name: Verify regeneration is deterministic
        run: |
          set -euo pipefail
          python3 tools/c-api/generate_coverage_inventory.py --write
          if ! git diff --quiet -- docs/c-api/COVERAGE.md; then
            echo "::error::--write changed COVERAGE.md even though --check passed; the generator is not deterministic" >&2
            git --no-pager diff --stat -- docs/c-api/COVERAGE.md
            exit 1
          fi
          test -s build/c-api/COVERAGE_FULL.md
          sha256sum build/c-api/COVERAGE_FULL.md
          echo "tracked summary is unchanged; full inventory was generated outside Git"
