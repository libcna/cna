name: Platform implementation matrix

on:
  push:
    branches: [next, develop, main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [next, develop, main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: platform-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform-contract:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # GPU profiles exercise separate context/surface paths; the CPU cells prove that a
          # game does not accidentally inherit SDL3 or a window-system requirement.
          - name: SDL3 + OpenGLES3
            platform: SDL3
            renderer: OPENGLES3
            audio: SDL3
            display: true
          # Exercises the SDL2 implementation's real GL/ES context path, not sdl2-compat. Audio is
          # SDL2 as well, deliberately: that pair is the one selection cmake/Sdl2OnlyConfiguration
          # .cmake calls SDL2-only, and it is what keeps SDL3 off every link line in the build --
          # including CnaTests', where linking both generations would put two libraries exporting
          # SDL_Init/SDL_GetError into one process and quietly invalidate the conformance run.
          - name: SDL2 + OpenGLES3
            platform: SDL2
            renderer: OPENGLES3
            audio: SDL2
            display: true
          - name: SDL3 + Vulkan
            platform: SDL3
            renderer: VULKAN
            audio: SDL3
            display: true
          - name: SDL3 + Software
            platform: SDL3
            renderer: SOFTWARE
            audio: SDL3
            display: true
          # This is the load-bearing independence cell: no graphical display and no SDL audio
          # implementation are selected. It must not inherit DISPLAY from runner configuration.
          - name: Headless + Headless + Null audio
            platform: HEADLESS
            renderer: HEADLESS
            audio: "NULL"
            display: false
          # A pseudo-TTY test runs a real 2D game, keyboard byte, resize and terminal restore;
          # no X11/Wayland service is involved.
          - name: Terminal + Blend2D + Null audio
            platform: TERMINAL
            renderer: BLEND2D
            audio: "NULL"
            display: false
    env:
      CC: gcc-14
      CXX: g++-14

    steps:
      - name: Checkout CNA (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Clone public sibling repositories
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}/.."
          bash "${GITHUB_WORKSPACE}/scripts/ci/clone_siblings.sh" "${{ github.head_ref }} ${{ github.base_ref }} ${{ github.ref_name }}" sharp-runtime easy-gl meta-gl

      - name: Install build and native dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++-14 cmake ninja-build ccache pkg-config xvfb x11-utils \
            libavcodec-dev libavformat-dev libavutil-dev libswresample-dev \
            libvulkan-dev mesa-vulkan-drivers \
            libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev \
            libx11-dev libxext-dev libxrandr-dev libxi-dev libxcursor-dev \
            libxfixes-dev libxss-dev libxtst-dev libwayland-dev \
            wayland-protocols libxkbcommon-dev libasound2-dev libpulse-dev \
            libudev-dev libdbus-1-dev

      - name: Record SDL submodule commit
        id: sdlsha
        run: echo "sha=$(git -C third_party/SDL rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache vendored SDL build
        uses: actions/cache@v4
        with:
          path: .sdl-prebuilt-Linux-x86_64
          key: platform-sdl-${{ runner.os }}-${{ steps.sdlsha.outputs.sha }}

      - name: Cache compiler outputs
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: platform-ccache-${{ runner.os }}-${{ matrix.platform }}-${{ matrix.renderer }}-${{ github.sha }}
          restore-keys: |
            platform-ccache-${{ runner.os }}-${{ matrix.platform }}-${{ matrix.renderer }}-

      - name: Start an isolated X11 display
        if: matrix.display
        run: |
          set -euo pipefail
          Xvfb :99 -screen 0 1280x720x24 &
          disown
          for i in $(seq 1 40); do
            if xdpyinfo -display :99 >/dev/null 2>&1; then
              echo "DISPLAY=:99" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 0.5
          done
          echo "Xvfb did not become ready" >&2
          exit 1

      - name: Configure selected platform tuple
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCNA_PLATFORM=${{ matrix.platform }} \
            -DCNA_GRAPHICS_RENDERER=${{ matrix.renderer }} \
            -DCNA_AUDIO_PLATFORM=${{ matrix.audio }} \
            -DCNA_BUILD_TESTS=ON \
            -DCNA_BUILD_EXAMPLES=ON \
            -DCNA_ENABLE_NET=OFF \
            -DCNA_USE_CCACHE=ON \
            -DCNA_TEST_DISPLAY=:99

      - name: Build the contract, consumer tests and 2D integration demo
        run: cmake --build build --target CnaTests cna_demo_2d --parallel 3

      # PLAT-SDL2-6/PLAT-SDL2-8: both SDL2-native suites live in their own executables, because
      # SDL2 and SDL3 publish mutually exclusive interface requirements and CnaTests still carries
      # SDL3-native fixtures in every other selection.
      - name: Build SDL2 native-queue platform and audio tests
        if: matrix.platform == 'SDL2'
        run: cmake --build build --target cna_platform_sdl2_tests cna_audio_sdl2_tests --parallel 3

      - name: Run platform CTest entries (graphical tuples)
        if: matrix.display
        env:
          SDL_AUDIODRIVER: dummy
        run: ctest --test-dir build -R '^Cna(Platform(Tests|WindowTests)|Sdl2(Platform|AudioDevice)Tests)$' --output-on-failure

      - name: Run platform CTest entries with no display (Headless tuple)
        if: matrix.display == false
        env:
          SDL_AUDIODRIVER: dummy
        # A HEADLESS or TERMINAL tuple deliberately owns no platform window. The window-ownership
        # executable is exercised by the graphical tuples; only the platform contract applies here.
        run: env -u DISPLAY -u WAYLAND_DISPLAY ctest --test-dir build -R '^CnaPlatformTests$' --output-on-failure

      - name: Run cross-implementation event oracle (graphical tuples)
        if: matrix.display
        env:
          SDL_AUDIODRIVER: dummy
        run: ./build/CnaTests --gtest_filter='EveryImplementation/GameEventSemanticsGoldenTest.*' --gtest_brief=1

      - name: Run cross-implementation event oracle with no display (Headless tuple)
        if: matrix.display == false
        env:
          SDL_AUDIODRIVER: dummy
        run: env -u DISPLAY -u WAYLAND_DISPLAY ./build/CnaTests --gtest_filter='EveryImplementation/GameEventSemanticsGoldenTest.*' --gtest_brief=1

      - name: Run 2D demo through the selected graphical platform
        if: matrix.display
        working-directory: build
        env:
          SDL_AUDIODRIVER: dummy
        run: ./cna_demo_2d --smoke 6

      - name: Run 2D demo without a display
        if: matrix.platform == 'HEADLESS'
        working-directory: build
        run: env -u DISPLAY -u WAYLAND_DISPLAY ./cna_demo_2d --smoke 6

      - name: Run terminal 2D demo integration through a pseudo-TTY
        if: matrix.platform == 'TERMINAL'
        run: ctest --test-dir build -R '^TerminalBlend2DDemoIntegration$' --output-on-failure

      # Run once rather than six times; configure already invokes the same checks for every
      # matrix cell, while this explicit step keeps their commands visible in the CI log.
      #
      # All seven gates, matching docs/platform-abstraction.md's checklist and plan_platform.md's
      # definition of done. Two were missing here and are not optional: the ratchet needs --strict
      # (PLAT-121 made exceeding the 0/0 floor a hard error, and without the flag the script warns
      # and exits 0), and the non-production manifest is what stops a new native reference from
      # being parked in a test file instead of being fixed.
      - name: Run platform source gates
        if: matrix.platform == 'HEADLESS'
        run: |
          python3 tools/platform/sdl_inventory.py --check
          python3 tools/platform/sdl_classify.py --check
          python3 tools/platform/renderer_sdl_audit.py --check
          python3 tools/platform/sdl_ratchet.py --check --strict
          python3 tools/platform/hot_path_lint.py
          python3 tools/platform/nonproduction_sdl_audit.py --check
          python3 tools/platform/check_contract.py

  # ---------------------------------------------------------------------------------------------
  # plans/plan_win32.md WIN32-0065: the native Win32 backend's CI cell.
  #
  # It is a separate job rather than a row in the matrix above, because it does something none of
  # those cells does: it builds for a target that is not the runner. `CNA_PLATFORM=WIN32` is
  # available only where the target is Windows, so this cross-compiles with mingw-w64 and executes
  # the result under Wine on a virtual display.
  #
  # Wine is not Windows, and this job does not pretend otherwise -- plans/plan_win32.md section 16
  # records exactly which behaviours it can and cannot establish. What it does establish, on every
  # push, is the part that regresses silently: that the backend still compiles for Windows, that
  # the whole platform contract suite still passes against it alongside Headless, and that its
  # source tree has not grown an SDL reference. The behaviours Wine cannot reach are covered by the
  # manual native-Windows job below.
  #
  # It uses tools/platform/standalone_tests rather than a full configure: the platform module
  # depends on nothing but the C++ standard library, so this needs no sibling checkout, no vendored
  # SDL and no renderer -- which is also what keeps a Windows cell affordable on a Linux runner.
  win32-cross:
    name: Win32 (mingw-w64 cross-build, executed under Wine)
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout CNA
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install the cross toolchain and Wine
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo dpkg --add-architecture i386
          sudo apt-get update
          # `wine`, not only `wine64`: on Ubuntu 24.04 the wine64 package no longer puts a `wine64`
          # command on PATH (the job failed with "wine64: command not found"); the `wine`
          # launcher picks the 64-bit loader for a PE32+ executable itself.
          sudo apt-get install -y --no-install-recommends \
            g++-mingw-w64-x86-64 cmake ninja-build xvfb wine wine64

      - name: Configure the standalone platform harness for WIN32
        run: |
          set -euo pipefail
          cmake -S tools/platform/standalone_tests -B build-win32 -G Ninja \
            -DCMAKE_TOOLCHAIN_FILE="${GITHUB_WORKSPACE}/cmake/toolchains/mingw-w64.cmake" \
            -DCNA_PLATFORM=WIN32 \
            -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build-win32 --parallel

      - name: Run the platform contract and Win32 suites under Wine
        run: |
          set -euo pipefail
          Xvfb :99 -screen 0 1280x720x24 &
          disown
          sleep 3
          export DISPLAY=:99
          export WINEDEBUG=-all
          export WINEPREFIX="${RUNNER_TEMP}/wineprefix"
          # Let Wine create and settle its prefix before the run, so first-boot chatter is not
          # mistaken for a test failure.
          wine wineboot --init || true
          wine build-win32/cna_platform_tests.exe

      - name: Probe real Direct3D on the produced window
        # Wine's D3D12 needs vkd3d over a Vulkan driver and its D3D11 needs a GL or Vulkan path, so
        # a hosted runner may have neither. The probe reports that as exit status 2 -- an
        # environment limitation, distinct from the exit 1 it uses for an actual defect -- and only
        # the latter fails this step.
        run: |
          set -euo pipefail
          export DISPLAY=:99
          export WINEDEBUG=-all
          export WINEPREFIX="${RUNNER_TEMP}/wineprefix"
          set +e
          wine build-win32/cna_win32_directx_probe.exe
          status=$?
          set -e
          if [ "$status" -eq 2 ]; then
            echo "::notice::No Direct3D device on this runner; the handle contract was still verified."
            exit 0
          fi
          exit "$status"

  # ---------------------------------------------------------------------------------------------
  # The behaviours Wine cannot establish, on a real Windows runner and a real MSVC.
  #
  # workflow_dispatch-only, matching the precedent d3d-windows-ci.yml set and for the same reasons
  # recorded there: Windows runners are slower and more expensive than this project's Linux CI, and
  # automatic Windows triggering is a deliberate exception rather than the default here.
  #
  # What it adds over the cross job: a second compiler (MSVC, which the backend has never been
  # built with on this worker), a real per-monitor-DPI desktop, a real Direct3D 11 and 12 runtime,
  # real shell dialogs and a real clipboard.
  win32-native:
    name: Win32 (native MSVC, windows-latest)
    runs-on: windows-latest
    timeout-minutes: 45
    if: github.event_name == 'workflow_dispatch'
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout CNA
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configure the standalone platform harness for WIN32
        run: |
          set -euo pipefail
          cmake -S tools/platform/standalone_tests -B build-win32 \
            -DCNA_PLATFORM=WIN32 -DCMAKE_BUILD_TYPE=Debug

      - name: Build
        run: cmake --build build-win32 --config Debug --parallel

      - name: Run the platform contract and Win32 suites
        run: |
          set -euo pipefail
          ./build-win32/Debug/cna_platform_tests.exe || ./build-win32/cna_platform_tests.exe

      - name: Probe real Direct3D 11 and 12
        run: |
          set -euo pipefail
          set +e
          ./build-win32/Debug/cna_win32_directx_probe.exe || ./build-win32/cna_win32_directx_probe.exe
          status=$?
          set -e
          if [ "$status" -eq 2 ]; then
            echo "::notice::No Direct3D device on this runner."
            exit 0
          fi
          exit "$status"

  # ---------------------------------------------------------------------------------------------
  # plans/plan_native_platforms_integration.md NPI-0013: the permanent SDL-free native-Linux cell.
  #
  # Every other Linux cell above configures with CNA_ENABLE_SDL left at its AUTO default, so none
  # of them proves a genuinely SDL-free CNA build stays buildable. This one sets
  # CNA_ENABLE_SDL=OFF explicitly, selects the native X11 platform (the one platform besides WIN32
  # that never falls back to SDL), NULL audio, and HEADLESS as the renderer -- deliberately not a
  # renderer that needs a GPU context, because this cell's job is proving the platform/audio/
  # content axes stay SDL-free, not re-proving GL/Vulkan (the graphical matrix cells above already
  # do that under SDL3/SDL2). cna_content is built and tested here specifically because
  # DecodeWavToPcm16 (modules/audio/src/Internal/WavDecoder.cpp) is the dependency this cell exists
  # to keep SDL-free -- see plans/plan_native_platforms_integration.md's WAV decoder section for
  # the history of why that mattered.
  x11-sdl-free:
    name: X11 + Headless + Null audio (CNA_ENABLE_SDL=OFF)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CC: gcc-14
      CXX: g++-14

    steps:
      - name: Checkout CNA (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Clone public sibling repositories
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}/.."
          bash "${GITHUB_WORKSPACE}/scripts/ci/clone_siblings.sh" "${{ github.head_ref }} ${{ github.base_ref }} ${{ github.ref_name }}" sharp-runtime easy-gl meta-gl

      - name: Install build and native X11 dependencies (no SDL packages needed or installed)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++-14 cmake ninja-build ccache pkg-config xvfb x11-utils openbox xclip xsel \
            libavcodec-dev libavformat-dev libavutil-dev libswresample-dev \
            libx11-dev libxext-dev libxrandr-dev libxi-dev libxcursor-dev \
            libxfixes-dev libxss-dev libxtst-dev libxkbcommon-dev binutils \
            ibus dbus-x11 xdotool x11-xkb-utils libdbus-1-dev dbus-daemon \
            xserver-xorg-core xserver-xorg-video-dummy xserver-xorg-input-evdev

      - name: Cache compiler outputs
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: platform-ccache-${{ runner.os }}-x11-sdl-free-${{ github.sha }}
          restore-keys: |
            platform-ccache-${{ runner.os }}-x11-sdl-free-

      # plans/plan_x11.md X11-0150/X11-0155: the controller suite's virtual pads and the
      # touchscreen suite's virtual touchscreen and pen are uinput devices, read back through
      # their event nodes. On this throwaway VM the nodes are simply opened to everyone; where the
      # runner's kernel has no uinput, both suites skip as they always did.
      - name: Give the runner uinput and readable input nodes (CI VM only)
        run: |
          set -euo pipefail
          if sudo modprobe uinput && [ -e /dev/uinput ]; then
            sudo chmod 0666 /dev/uinput
            echo 'KERNEL=="event*", SUBSYSTEM=="input", MODE="0666"' \
              | sudo tee /etc/udev/rules.d/99-cna-ci-input.rules
            sudo udevadm control --reload-rules
            echo "CNA_CI_HAS_UINPUT=1" >> "$GITHUB_ENV"
          else
            echo "::warning::no uinput on this runner; the evdev and touchscreen suites will skip"
          fi

      - name: Start an isolated X11 display (Xvfb + openbox)
        run: |
          set -euo pipefail
          Xvfb :99 -screen 0 1280x720x24 &
          disown
          for i in $(seq 1 40); do
            if xdpyinfo -display :99 >/dev/null 2>&1; then
              echo "DISPLAY=:99" >> "$GITHUB_ENV"
              break
            fi
            sleep 0.5
          done
          DISPLAY=:99 openbox &
          disown
          sleep 1

      - name: Configure CNA_ENABLE_SDL=OFF + X11 + Headless + Null audio
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCNA_ENABLE_SDL=OFF \
            -DCNA_PLATFORM=X11 \
            -DCNA_GRAPHICS_RENDERER=HEADLESS \
            -DCNA_AUDIO_PLATFORM=NULL \
            -DCNA_BUILD_TESTS=ON \
            -DCNA_BUILD_EXAMPLES=ON \
            -DCNA_ENABLE_NET=OFF \
            -DCNA_USE_CCACHE=ON \
            -DCNA_TEST_DISPLAY=:99 \
            -DCNA_PLATFORM_CTEST_BINARY=CnaPlatformModuleTests

      - name: Build the platform, audio and content test suites, and cna_content itself
        run: cmake --build build --target CnaPlatformModuleTests CnaAudioTests CnaContentTests CnaContentPipelineTests cna_content --parallel "$(nproc)"

      - name: Prove no SDL library was configured or linked
        run: |
          set -euo pipefail
          if find build -iname '*SDL2*' -o -iname '*SDL3*' | grep -q .; then
            echo "::error::An SDL artifact exists in the SDL-free build directory." >&2
            find build -iname '*SDL2*' -o -iname '*SDL3*'
            exit 1
          fi
          for exe in build/CnaPlatformModuleTests build/CnaAudioTests build/CnaContentTests build/CnaContentPipelineTests; do
            if ldd "$exe" | grep -iq sdl; then
              echo "::error::$exe links against SDL." >&2
              ldd "$exe" | grep -i sdl
              exit 1
            fi
          done

      - name: Run platform, audio, content and WAV-decoder tests
        env:
          SDL_AUDIODRIVER: dummy
          # plans/plan_x11.md X11-0166: a virtual accelerometer is safe only on this VM.
          CNA_X11_TEST_MOTION_SENSOR: "1"
        run: |
          set -euo pipefail
          ctest --test-dir build -R '^Cna(Platform(Tests|WindowTests|XErrorHandlerTests)|X11(MappingTests|EvdevTests|IntegrationTests|WindowManagerTests|InputMethodTests|ExclusiveFullscreenTests|TouchscreenTests))$' --output-on-failure
          ctest --test-dir build -R '^CnaSdlOffFindsNoSdlPackage$' --output-on-failure
          ./build/CnaAudioTests --gtest_filter='WavDecoderTest.*'
          ./build/CnaContentPipelineTests --gtest_filter='*Adpcm*:*Wav*'
          ./build/CnaContentTests --gtest_filter='*Wav*:*SoundEffect*'

      # plans/plan_x11.md X11-0166: ctest counts a suite whose every case skipped as passed, and
      # the uinput suites skip wherever the machine lacks what they need. On this runner nothing
      # is lacking, so they run once more with their output kept, and any skip fails the job --
      # what they prove on CI is then read in the log, not inferred from a green tick. Since
      # X11-0169/X11-0170 the same goes for the suites that need a private D-Bus and the
      # launcher's own X server.
      - name: The uinput, D-Bus and private-server suites ran rather than skipped
        if: env.CNA_CI_HAS_UINPUT == '1'
        env:
          CNA_X11_TEST_MOTION_SENSOR: "1"
          CNA_X11_TEST_TOUCHSCREEN: "1"
          CNA_AUDIO_RECORDING_DEVICE: "null"
        run: |
          set -euo pipefail
          run_without_skips() {
            local label="$1"
            shift
            local status=0
            local output
            output="$("$@" 2>&1)" || status=$?
            printf '%s\n' "$output"
            if [ "$status" -ne 0 ]; then
              exit "$status"
            fi
            if grep -q '^\[  SKIPPED \]' <<<"$output"; then
              echo "::error::$label skipped on a runner that has what it needs; the reasons are above" >&2
              exit 1
            fi
          }
          for filter in 'X11EvdevVirtualDevice.*' 'X11Touchscreen.*' 'X11DesktopPortalBus.*'; do
            run_without_skips "$filter" ./build/CnaPlatformModuleTests --gtest_filter="$filter"
          done
          run_without_skips "the private-server suites" sh tools/platform/x11_test_server.sh \
            ./build/CnaPlatformModuleTests \
            --gtest_filter='X11DesktopPortalLive.*:X11ScreenSaverLive.*:X11ScreenSaverDesktopLive.*:X11MessageBoxLive.*:X11TrayLive.*'

      - name: Run SDL containment gates
        run: |
          python3 tools/platform/sdl_inventory.py --check
          python3 tools/platform/sdl_classify.py --check
          python3 tools/platform/renderer_sdl_audit.py --check
          python3 tools/platform/sdl_ratchet.py --check --strict
          python3 tools/platform/nonproduction_sdl_audit.py --check

  # ---------------------------------------------------------------------------------------------
  # plans/plan_native_platform_validation.md "Next steps", step 1: the SDL-free X11 cell above
  # selects HEADLESS on purpose, and three defects lived exactly where it does not look -- an
  # SDL-free configuration with a GPU renderer: it could not configure (NPV-0106), a sibling's
  # find_package(SDL3) found an installed SDL3 (NPV-0114), and the platform linked libGLX into
  # every build (NPV-0121). This cell configures that selection, builds two real games from it and
  # runs them with every renderer compiled in, on Mesa's software GL and Vulkan drivers.
  x11-sdl-free-gpu:
    name: X11 + OpenGL33/Vulkan/Software/Headless + ALSA audio (CNA_ENABLE_SDL=OFF)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CC: gcc-14
      CXX: g++-14

    steps:
      - name: Checkout CNA (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Clone public sibling repositories
        run: |
          set -euo pipefail
          bash "${GITHUB_WORKSPACE}/scripts/ci/clone_siblings.sh" "${{ github.head_ref }} ${{ github.base_ref }} ${{ github.ref_name }}" sharp-runtime easy-gl meta-gl

      - name: Install build, X11, GL, Vulkan and ALSA dependencies (no SDL packages)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++-14 cmake ninja-build ccache pkg-config xvfb x11-utils binutils \
            libavcodec-dev libavformat-dev libavutil-dev libswresample-dev \
            libx11-dev libxext-dev libxrandr-dev libxi-dev libxcursor-dev \
            libxfixes-dev libxss-dev libxtst-dev libxkbcommon-dev \
            libgl1-mesa-dev libglx-dev libgl1-mesa-dri libvulkan-dev mesa-vulkan-drivers \
            libasound2-dev openbox x11-xserver-utils libdbus-1-dev dbus-daemon

      - name: Cache compiler outputs
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: platform-ccache-${{ runner.os }}-x11-sdl-free-gpu-${{ github.sha }}
          restore-keys: |
            platform-ccache-${{ runner.os }}-x11-sdl-free-gpu-

      # plans/plan_x11.md X11-0151: the SDL-free games with sound -- ALSA playback and CNA's own
      # mixer. The runner has no sound card; everything plays to ALSA's silent `null` device.
      - name: Configure CNA_ENABLE_SDL=OFF + X11 + OPENGL33;VULKAN;SOFTWARE;HEADLESS + ALSA audio
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCNA_ENABLE_SDL=OFF \
            -DCNA_PLATFORM=X11 \
            -DCNA_GRAPHICS_RENDERER=OPENGL33 \
            -DCNA_GRAPHICS_RENDERERS="OPENGL33;VULKAN;SOFTWARE;HEADLESS" \
            -DCNA_AUDIO_PLATFORM=ALSA \
            -DCNA_BUILD_TESTS=ON \
            -DCNA_BUILD_EXAMPLES=ON \
            -DCNA_ENABLE_NET=OFF \
            -DCNA_USE_CCACHE=ON

      - name: Build two real games and the audio test suite
        run: cmake --build build --target cna_demo_2d cna_house3d_demo CnaAudioTests --parallel "$(nproc)"

      - name: Prove no SDL was found, built or linked
        run: |
          set -euo pipefail
          if grep -E '^SDL[23]_DIR:PATH=' build/CMakeCache.txt | grep -v NOTFOUND; then
            echo "::error::An SDL package was found by a CNA_ENABLE_SDL=OFF configuration." >&2
            exit 1
          fi
          for exe in build/cna_demo_2d build/cna_house3d_demo build/CnaAudioTests; do
            if readelf -d "$exe" | grep -i 'NEEDED.*sdl'; then
              echo "::error::$exe links against SDL." >&2
              exit 1
            fi
            if nm -D --undefined-only "$exe" | grep -q ' SDL_'; then
              echo "::error::$exe references SDL symbols." >&2
              exit 1
            fi
            # libasound is loaded at run time, never linked: a machine without it must still start.
            if readelf -d "$exe" | grep -i 'NEEDED.*asound'; then
              echo "::error::$exe links libasound instead of loading it at run time." >&2
              exit 1
            fi
          done

      - name: Run both games with every renderer compiled in (private Xvfb, Mesa software drivers)
        env:
          CNA_AUDIO_DEVICE: "null"
        run: |
          set -euo pipefail
          ctest --test-dir build -R '^X11_House3D_SmokeTest_' --output-on-failure
          # plans/plan_x11.md X11-0153: the game in exclusive fullscreen -- the monitor of a
          # private Xvfb switched through IsFullScreen, and given back on exit and after SIGKILL.
          ctest --test-dir build -R '^X11_House3D_ExclusiveFullscreen_' --output-on-failure
          for renderer in OPENGL33 VULKAN SOFTWARE HEADLESS; do
            (cd build && CNA_GRAPHICS_RENDERER="$renderer" \
              sh ../tools/platform/x11_test_server.sh ./cna_demo_2d --smoke 6)
          done

      - name: Run the ALSA device, CNA mixer and XNA audio suites on ALSA's null device
        env:
          CNA_AUDIO_DEVICE: "null"
          CNA_AUDIO_RECORDING_DEVICE: "null"
        run: |
          set -euo pipefail
          ./build/CnaAudioTests --gtest_filter='CnaMixer.*:CnaMixerXna.*:AlsaAudioDevice.*:AlsaAudioRecordingDevice.*:Microphone*:AudioCategory*:*AudioDeviceConformanceTests*:AudioEngine*:RendererDetail*'

  # ---------------------------------------------------------------------------------------------
  # plans/plan_native_platforms_integration.md NPI-0014: CNA_ENABLE_SDL's own AUTO/ON/OFF contract.
  #
  # AUTO must be byte-for-byte the historical default (a plain configure with nothing set), ON
  # must configure SDL the same way AUTO does whenever anything actually needs it, and OFF must
  # both build successfully for a native selection and refuse loudly -- not silently fall back --
  # for a selection that genuinely needs SDL. The fourth cell proves that refusal by asserting
  # configure fails with the expected diagnostic; it does not build anything.
  sdl-enable-matrix:
    name: CNA_ENABLE_SDL=${{ matrix.value }} (${{ matrix.platform }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - value: "AUTO"
            platform: SDL3
            renderer: HEADLESS
            audio: SDL3
            expect: configure-succeeds
          - value: "ON"
            platform: SDL3
            renderer: HEADLESS
            audio: SDL3
            expect: configure-succeeds
          - value: "OFF"
            platform: X11
            renderer: HEADLESS
            audio: "NULL"
            expect: configure-succeeds
          - value: "OFF"
            platform: SDL3
            renderer: HEADLESS
            audio: SDL3
            expect: configure-fails
    steps:
      - name: Checkout CNA (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Clone public sibling repositories
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}/.."
          bash "${GITHUB_WORKSPACE}/scripts/ci/clone_siblings.sh" "${{ github.head_ref }} ${{ github.base_ref }} ${{ github.ref_name }}" sharp-runtime easy-gl meta-gl

      - name: Install build and native dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++-14 cmake ninja-build pkg-config \
            libavcodec-dev libavformat-dev libavutil-dev libswresample-dev \
            libx11-dev libxext-dev libxrandr-dev libxi-dev libxcursor-dev \
            libxfixes-dev libxss-dev libxtst-dev libxkbcommon-dev

      - name: Configure and check the expected outcome
        run: |
          set -euo pipefail
          set +e
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCNA_ENABLE_SDL=${{ matrix.value }} \
            -DCNA_PLATFORM=${{ matrix.platform }} \
            -DCNA_GRAPHICS_RENDERER=${{ matrix.renderer }} \
            -DCNA_AUDIO_PLATFORM=${{ matrix.audio }} \
            -DCNA_BUILD_TESTS=OFF \
            -DCNA_BUILD_EXAMPLES=OFF \
            -DCNA_ENABLE_NET=OFF > configure.log 2>&1
          status=$?
          set -e
          cat configure.log
          if [ "${{ matrix.expect }}" = "configure-succeeds" ]; then
            [ "$status" -eq 0 ] || { echo "::error::Expected configure to succeed."; exit 1; }
          else
            [ "$status" -ne 0 ] || { echo "::error::Expected configure to fail (SDL-required selection with CNA_ENABLE_SDL=OFF)."; exit 1; }
            grep -qi "genuinely requires SDL" configure.log || { echo "::error::Expected the SDL-required diagnostic, got something else."; exit 1; }
          fi
