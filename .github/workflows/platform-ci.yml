name: Platform implementation matrix

on:
  push:
    branches: [next, develop, main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [next, develop, main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: platform-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  platform-contract:
    name: ${{ matrix.name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          # GPU profiles exercise separate context/surface paths; the CPU cells prove that a
          # game does not accidentally inherit SDL3 or a window-system requirement.
          - name: SDL3 + OpenGLES3
            platform: SDL3
            renderer: OPENGLES3
            audio: SDL3
            display: true
          - name: SDL3 + Vulkan
            platform: SDL3
            renderer: VULKAN
            audio: SDL3
            display: true
          - name: SDL3 + Software
            platform: SDL3
            renderer: SOFTWARE
            audio: SDL3
            display: true
          # This is the load-bearing independence cell: no graphical display and no SDL audio
          # implementation are selected. It must not inherit DISPLAY from runner configuration.
          - name: Headless + Headless + Null audio
            platform: HEADLESS
            renderer: HEADLESS
            audio: "NULL"
            display: false
          # A pseudo-TTY test runs a real 2D game, keyboard byte, resize and terminal restore;
          # no window system is involved.
          - name: Terminal + Software + Null audio
            platform: TERMINAL
            renderer: SOFTWARE
            audio: "NULL"
            display: false
    env:
      CC: gcc-14
      CXX: g++-14

    steps:
      - name: Checkout CNA (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Clone public sibling repositories
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}/.."
          bash "${GITHUB_WORKSPACE}/scripts/ci/clone_siblings.sh" "${{ github.head_ref }} ${{ github.base_ref }} ${{ github.ref_name }}" sharp-runtime easy-gl meta-gl

      - name: Install build and native dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++-14 cmake ninja-build ccache pkg-config xvfb x11-utils \
            libavcodec-dev libavformat-dev libavutil-dev libswresample-dev \
            libvulkan-dev mesa-vulkan-drivers \
            libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev \
            libx11-dev libxext-dev libxrandr-dev libxi-dev libxcursor-dev \
            libxfixes-dev libxss-dev libxtst-dev libwayland-dev \
            wayland-protocols libxkbcommon-dev libasound2-dev libpulse-dev \
            libudev-dev libdbus-1-dev weston

      - name: Record SDL submodule commit
        id: sdlsha
        run: echo "sha=$(git -C third_party/SDL rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache vendored SDL build
        uses: actions/cache@v4
        with:
          path: .sdl-prebuilt-Linux-x86_64
          key: platform-sdl-${{ runner.os }}-${{ steps.sdlsha.outputs.sha }}

      - name: Cache compiler outputs
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: platform-ccache-${{ runner.os }}-${{ matrix.platform }}-${{ matrix.renderer }}-${{ github.sha }}
          restore-keys: |
            platform-ccache-${{ runner.os }}-${{ matrix.platform }}-${{ matrix.renderer }}-

      - name: Start an isolated X11 display
        if: matrix.display
        run: |
          set -euo pipefail
          Xvfb :99 -screen 0 1280x720x24 &
          disown
          for i in $(seq 1 40); do
            if xdpyinfo -display :99 >/dev/null 2>&1; then
              echo "DISPLAY=:99" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 0.5
          done
          echo "Xvfb did not become ready" >&2
          exit 1

      - name: Configure selected platform tuple
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCNA_PLATFORM=${{ matrix.platform }} \
            -DCNA_GRAPHICS_RENDERER=${{ matrix.renderer }} \
            -DCNA_AUDIO_PLATFORM=${{ matrix.audio }} \
            -DCNA_BUILD_TESTS=ON \
            -DCNA_BUILD_EXAMPLES=ON \
            -DCNA_ENABLE_NET=OFF \
            -DCNA_USE_CCACHE=ON \
            -DCNA_TEST_DISPLAY=:99

      - name: Build the contract, consumer tests and 2D integration demo
        run: |
          set -euo pipefail
          targets="CnaTests cna_demo_2d"
          if [ "${{ matrix.platform }}" = SDL3 ]; then
            targets="$targets cna_platform_exit_harness"
          fi
          cmake --build build --target $targets --parallel 3

      - name: Run platform CTest entries (graphical tuples)
        if: matrix.display
        env:
          SDL_AUDIODRIVER: dummy
        run: ctest --test-dir build -R '^CnaPlatform(Tests|WindowTests)$' --output-on-failure

      # SDL3 is CNA's one windowing implementation, so this is where X11 and Wayland are covered:
      # SDL's x11 driver on a private Xvfb and its wayland driver on a private headless Weston, each
      # asserting that the native handle a renderer receives is a Display* + XID or a wl_display* +
      # wl_surface*, plus the window conformance suite, the X selections and the process-exit
      # teardown. The launchers exit 77 (skip) where their server is missing; both are installed
      # here, so a skip fails the step rather than reading as a pass.
      - name: Run SDL3 on X11 and on Wayland (private Xvfb, private headless Weston)
        if: matrix.platform == 'SDL3'
        run: |
          set -euo pipefail
          output="$(env -u DISPLAY -u WAYLAND_DISPLAY ctest --test-dir build \
            -R '^CnaPlatform(Sdl3X11|Sdl3Wayland|ExitOrder|ExitOrderX11)Tests$' --output-on-failure 2>&1)" \
            || { printf '%s\n' "$output"; exit 1; }
          printf '%s\n' "$output"
          if grep -q 'Skipped' <<<"$output"; then
            echo "::error::an SDL3 window-system suite skipped on a runner that has Xvfb and Weston" >&2
            exit 1
          fi

      - name: Run platform CTest entries with no display (Headless tuple)
        if: matrix.display == false
        env:
          SDL_AUDIODRIVER: dummy
        # A HEADLESS or TERMINAL tuple deliberately owns no platform window. The window-ownership
        # executable is exercised by the graphical tuples; only the platform contract applies here.
        run: env -u DISPLAY -u WAYLAND_DISPLAY ctest --test-dir build -R '^CnaPlatformTests$' --output-on-failure

      - name: Run cross-implementation event oracle (graphical tuples)
        if: matrix.display
        env:
          SDL_AUDIODRIVER: dummy
        run: ./build/CnaTests --gtest_filter='EveryImplementation/GameEventSemanticsGoldenTest.*' --gtest_brief=1

      - name: Run cross-implementation event oracle with no display (Headless tuple)
        if: matrix.display == false
        env:
          SDL_AUDIODRIVER: dummy
        run: env -u DISPLAY -u WAYLAND_DISPLAY ./build/CnaTests --gtest_filter='EveryImplementation/GameEventSemanticsGoldenTest.*' --gtest_brief=1

      - name: Run 2D demo through the selected graphical platform
        if: matrix.display
        working-directory: build
        env:
          SDL_AUDIODRIVER: dummy
        run: ./cna_demo_2d --smoke 6

      - name: Run 2D demo without a display
        if: matrix.platform == 'HEADLESS'
        working-directory: build
        run: env -u DISPLAY -u WAYLAND_DISPLAY ./cna_demo_2d --smoke 6

      # A real end-to-end leg again (plans/plan_terminal_capi_repair.md TCR-3): SOFTWARE requests a
      # surface presenter and feeds it finished CPU frames, so the runner's alternate-screen,
      # SIGWINCH-grid and diagnostics assertions all describe behaviour that happens. It reported
      # "Not Run (Disabled)" between BLEND2D's retirement and that repair, when no renderer set
      # needsSurfacePresenter. The TERMINAL platform's own unit tests, including the 36 pseudo-TTY
      # presenter tests, run in the CnaPlatformTests step above and cover the consumer half.
      - name: Run terminal 2D demo integration through a pseudo-TTY
        if: matrix.platform == 'TERMINAL'
        run: ctest --test-dir build -R '^TerminalSoftwareDemoIntegration$' --output-on-failure

      # Run once rather than six times; configure already invokes the same checks for every
      # matrix cell, while this explicit step keeps their commands visible in the CI log.
      #
      # All seven gates, matching docs/platform-abstraction.md's checklist and plan_platform.md's
      # definition of done. Two were missing here and are not optional: the ratchet needs --strict
      # (PLAT-121 made exceeding the 0/0 floor a hard error, and without the flag the script warns
      # and exits 0), and the non-production manifest is what stops a new native reference from
      # being parked in a test file instead of being fixed.
      - name: Run platform source gates
        if: matrix.platform == 'HEADLESS'
        run: |
          python3 tools/platform/sdl_inventory.py --check
          python3 tools/platform/sdl_classify.py --check
          python3 tools/platform/renderer_sdl_audit.py --check
          python3 tools/platform/sdl_ratchet.py --check --strict
          python3 tools/platform/hot_path_lint.py
          python3 tools/platform/nonproduction_sdl_audit.py --check
          python3 tools/platform/check_contract.py

  # ---------------------------------------------------------------------------------------------
  # Windows: SDL3, on a real Windows runner and a real MSVC.
  #
  # CNA has no platform implementation of its own on Windows: windows, input and host services come
  # from SDL3's windows video driver, and a Direct3D renderer receives the HWND through
  # IPlatformWindow::GetNativeHandle(). This configures CNA for SDL3, builds the platform module's
  # focused suite and the process-exit harness, and runs them with the expectation that the native
  # handle is an HWND. Windows -> SDL3 -> HWND -> Direct3D itself is d3d-windows-ci.yml's
  # DirectX11_Win32HardwareSmoke.
  #
  # workflow_dispatch-only, matching the precedent d3d-windows-ci.yml set and for the same reasons
  # recorded there: Windows runners are slower and more expensive than this project's Linux CI, and
  # automatic Windows triggering is a deliberate exception rather than the default here.
  sdl3-windows:
    name: SDL3 on Windows (native MSVC, windows-latest)
    runs-on: windows-latest
    timeout-minutes: 60
    if: github.event_name == 'workflow_dispatch'
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout CNA (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Clone public sibling repositories
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}/.."
          bash "${GITHUB_WORKSPACE}/scripts/ci/clone_siblings.sh" "${{ github.head_ref }} ${{ github.base_ref }} ${{ github.ref_name }}" sharp-runtime easy-gl meta-gl

      - name: Set up MSVC developer environment (x64)
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Set up Ninja
        uses: seanmiddleditch/gha-setup-ninja@v4

      - name: Configure SDL3 + Headless renderer + SDL3 audio
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCNA_PLATFORM=SDL3 \
            -DCNA_GRAPHICS_RENDERER=HEADLESS \
            -DCNA_AUDIO_PLATFORM=SDL3 \
            -DCNA_BUILD_TESTS=ON \
            -DCNA_BUILD_EXAMPLES=OFF \
            -DCNA_ENABLE_NET=OFF \
            -DCNA_ENABLE_DRACO=OFF \
            -DCNA_PLATFORM_CTEST_BINARY=CnaPlatformModuleTests

      - name: Build the platform suite and the process-exit harness
        run: cmake --build build --target CnaPlatformModuleTests cna_platform_exit_harness --parallel 2

      - name: Run the platform contract, window and exit-order entries
        run: ctest --test-dir build -R '^CnaPlatform(Tests|WindowTests|ExitOrderTests)$' --output-on-failure

      - name: Run the SDL3 window suites on the windows video driver
        env:
          SDL_VIDEODRIVER: windows
          SDL_AUDIODRIVER: dummy
          CNA_TEST_EXPECT_NATIVE_WINDOW_SYSTEM: Win32
        run: ./build/CnaPlatformModuleTests.exe --gtest_filter='Sdl3WindowTest.*:EveryImplementation/PlatformWindowConformance.*/SDL3'

  # ---------------------------------------------------------------------------------------------
  # plans/plan_native_platforms_integration.md NPI-0013: the permanent SDL-free Linux cell.
  #
  # Every other Linux cell above configures with CNA_ENABLE_SDL left at its AUTO default, so none
  # of them proves a genuinely SDL-free CNA build stays buildable. This one sets
  # CNA_ENABLE_SDL=OFF explicitly. With no window there is nothing SDL3 would be needed for: the
  # HEADLESS platform and renderer, and ALSA playback through CNA's own mixer (plans/plan_x11.md
  # X11-0151; the runner has no sound card, so everything plays to ALSA's silent `null` device).
  # cna_content is built and tested here specifically because DecodeWavToPcm16
  # (modules/audio/src/Internal/WavDecoder.cpp) is the dependency this cell exists to keep SDL-free
  # -- see plans/plan_native_platforms_integration.md's WAV decoder section for the history of why
  # that mattered. A windowed build needs SDL3, on Linux as on every other desktop.
  sdl-free:
    name: Headless + Headless + ALSA audio (CNA_ENABLE_SDL=OFF)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      CC: gcc-14
      CXX: g++-14

    steps:
      - name: Checkout CNA (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Clone public sibling repositories
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}/.."
          bash "${GITHUB_WORKSPACE}/scripts/ci/clone_siblings.sh" "${{ github.head_ref }} ${{ github.base_ref }} ${{ github.ref_name }}" sharp-runtime easy-gl meta-gl

      - name: Install build and ALSA dependencies (no SDL or window-system packages)
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++-14 cmake ninja-build ccache pkg-config binutils \
            libavcodec-dev libavformat-dev libavutil-dev libswresample-dev \
            libasound2-dev

      - name: Cache compiler outputs
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: platform-ccache-${{ runner.os }}-sdl-free-${{ github.sha }}
          restore-keys: |
            platform-ccache-${{ runner.os }}-sdl-free-

      - name: Configure CNA_ENABLE_SDL=OFF + Headless + Headless + ALSA audio
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCNA_ENABLE_SDL=OFF \
            -DCNA_PLATFORM=HEADLESS \
            -DCNA_GRAPHICS_RENDERER=HEADLESS \
            -DCNA_AUDIO_PLATFORM=ALSA \
            -DCNA_BUILD_TESTS=ON \
            -DCNA_BUILD_EXAMPLES=ON \
            -DCNA_ENABLE_NET=OFF \
            -DCNA_USE_CCACHE=ON \
            -DCNA_PLATFORM_CTEST_BINARY=CnaPlatformModuleTests

      - name: Build the platform, audio and content test suites, cna_content and a game
        run: cmake --build build --target CnaPlatformModuleTests CnaAudioTests CnaContentTests CnaContentPipelineTests cna_content cna_demo_2d --parallel "$(nproc)"

      - name: Prove no SDL was found, built or linked
        run: |
          set -euo pipefail
          if find build -iname '*SDL*' | grep -q .; then
            echo "::error::An SDL artifact exists in the SDL-free build directory." >&2
            find build -iname '*SDL*'
            exit 1
          fi
          if grep -E '^SDL[23]_DIR:PATH=' build/CMakeCache.txt | grep -v NOTFOUND; then
            echo "::error::An SDL package was found by a CNA_ENABLE_SDL=OFF configuration." >&2
            exit 1
          fi
          for exe in build/CnaPlatformModuleTests build/CnaAudioTests build/CnaContentTests build/CnaContentPipelineTests build/cna_demo_2d; do
            if readelf -d "$exe" | grep -i 'NEEDED.*sdl'; then
              echo "::error::$exe links against SDL." >&2
              exit 1
            fi
            if nm -D --undefined-only "$exe" | grep -q ' SDL_'; then
              echo "::error::$exe references SDL symbols." >&2
              exit 1
            fi
            # libasound is loaded at run time, never linked: a machine without it must still start.
            if readelf -d "$exe" | grep -i 'NEEDED.*asound'; then
              echo "::error::$exe links libasound instead of loading it at run time." >&2
              exit 1
            fi
          done

      - name: Run platform, audio, content and WAV-decoder tests, and the game
        env:
          CNA_AUDIO_DEVICE: "null"
          CNA_AUDIO_RECORDING_DEVICE: "null"
        run: |
          set -euo pipefail
          ctest --test-dir build -R '^CnaPlatformTests$' --output-on-failure
          ctest --test-dir build -R '^CnaSdlOffFindsNoSdlPackage$' --output-on-failure
          ./build/CnaAudioTests --gtest_filter='WavDecoderTest.*:CnaMixer.*:CnaMixerXna.*:AlsaAudioDevice.*:AlsaAudioRecordingDevice.*:Microphone*:AudioCategory*:*AudioDeviceConformanceTests*:AudioEngine*:RendererDetail*'
          ./build/CnaContentPipelineTests --gtest_filter='*Adpcm*:*Wav*'
          ./build/CnaContentTests --gtest_filter='*Wav*:*SoundEffect*'
          (cd build && ./cna_demo_2d --smoke 6)

      - name: Run SDL containment gates
        run: |
          python3 tools/platform/sdl_inventory.py --check
          python3 tools/platform/sdl_classify.py --check
          python3 tools/platform/renderer_sdl_audit.py --check
          python3 tools/platform/sdl_ratchet.py --check --strict
          python3 tools/platform/nonproduction_sdl_audit.py --check

  # ---------------------------------------------------------------------------------------------
  # plans/plan_native_platforms_integration.md NPI-0014: CNA_ENABLE_SDL's own AUTO/ON/OFF contract.
  #
  # AUTO must be byte-for-byte the historical default (a plain configure with nothing set), ON
  # must configure SDL the same way AUTO does whenever anything actually needs it, and OFF must
  # both configure successfully for a windowless selection and refuse loudly -- not silently fall back --
  # for a selection that genuinely needs SDL. The fourth cell proves that refusal by asserting
  # configure fails with the expected diagnostic; it does not build anything.
  sdl-enable-matrix:
    name: CNA_ENABLE_SDL=${{ matrix.value }} (${{ matrix.platform }})
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - value: "AUTO"
            platform: SDL3
            renderer: HEADLESS
            audio: SDL3
            expect: configure-succeeds
          - value: "ON"
            platform: SDL3
            renderer: HEADLESS
            audio: SDL3
            expect: configure-succeeds
          - value: "OFF"
            platform: HEADLESS
            renderer: HEADLESS
            audio: "NULL"
            expect: configure-succeeds
          - value: "OFF"
            platform: SDL3
            renderer: HEADLESS
            audio: SDL3
            expect: configure-fails
    steps:
      - name: Checkout CNA (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Clone public sibling repositories
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}/.."
          bash "${GITHUB_WORKSPACE}/scripts/ci/clone_siblings.sh" "${{ github.head_ref }} ${{ github.base_ref }} ${{ github.ref_name }}" sharp-runtime easy-gl meta-gl

      - name: Install build and native dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++-14 cmake ninja-build pkg-config \
            libavcodec-dev libavformat-dev libavutil-dev libswresample-dev \
            libx11-dev libxext-dev libxrandr-dev libxi-dev libxcursor-dev \
            libxfixes-dev libxss-dev libxtst-dev libxkbcommon-dev

      - name: Configure and check the expected outcome
        run: |
          set -euo pipefail
          set +e
          cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCNA_ENABLE_SDL=${{ matrix.value }} \
            -DCNA_PLATFORM=${{ matrix.platform }} \
            -DCNA_GRAPHICS_RENDERER=${{ matrix.renderer }} \
            -DCNA_AUDIO_PLATFORM=${{ matrix.audio }} \
            -DCNA_BUILD_TESTS=OFF \
            -DCNA_BUILD_EXAMPLES=OFF \
            -DCNA_ENABLE_NET=OFF > configure.log 2>&1
          status=$?
          set -e
          cat configure.log
          if [ "${{ matrix.expect }}" = "configure-succeeds" ]; then
            [ "$status" -eq 0 ] || { echo "::error::Expected configure to succeed."; exit 1; }
          else
            [ "$status" -ne 0 ] || { echo "::error::Expected configure to fail (SDL-required selection with CNA_ENABLE_SDL=OFF)."; exit 1; }
            grep -qi "genuinely requires SDL" configure.log || { echo "::error::Expected the SDL-required diagnostic, got something else."; exit 1; }
          fi
