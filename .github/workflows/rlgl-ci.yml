# plans/plan_rlgl.md RLGL-021: compile and execute the complete registered RLGL suite through
# SDL3's display-server-free offscreen driver and Mesa software rendering.
name: RLGL CI

on:
  push:
    branches: [next, develop, main]
    paths:
      - '.github/workflows/rlgl-ci.yml'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'modules/**'
      - 'scripts/check_renderer_*.py'
      - 'scripts/check_runtime_renderer_discipline.py'
      - 'docs/rlgl*.md'
      - 'plans/plan_rlgl.md'
      - 'THIRD_PARTY_NOTICES.md'
  pull_request:
    branches: [next, develop, main]
    paths:
      - '.github/workflows/rlgl-ci.yml'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'modules/**'
      - 'scripts/check_renderer_*.py'
      - 'scripts/check_runtime_renderer_discipline.py'
      - 'docs/rlgl*.md'
      - 'plans/plan_rlgl.md'
      - 'THIRD_PARTY_NOTICES.md'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: rlgl-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-build:
    name: GCC (Linux x86_64, Mesa runtime gate)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CMAKE_GENERATOR: Ninja
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout CNA
        uses: actions/checkout@v4
        with:
          path: cna
          submodules: true

      - name: Checkout pinned sharp-runtime sibling
        uses: actions/checkout@v4
        with:
          repository: openeggbert/sharp-runtime
          ref: f23ded28c7b94a745cf82f8804b5b7104ca5780e
          path: sharp-runtime

      # This duplicates the CMake pin deliberately: configure performs no dependency network
      # access, and a CI result cannot change because upstream moves.
      - name: Checkout pinned raylib source
        uses: actions/checkout@v4
        with:
          repository: raysan5/raylib
          ref: dbc56a87da87d973a9c5baa4e7438a9d20121d28
          path: raylib

      # RLGL-047 uses only the pinned MojoShader submodule and CNA's shared translation target;
      # FNA3D itself remains excluded from the build graph.
      - name: Checkout pinned FNA3D and MojoShader source
        uses: actions/checkout@v4
        with:
          repository: FNA-XNA/FNA3D
          ref: 3240147
          path: fna3d
          submodules: recursive

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build pkg-config \
            libasound2-dev libpulse-dev libudev-dev libdbus-1-dev \
            libx11-dev libxext-dev libxrandr-dev libxi-dev libxcursor-dev \
            libxfixes-dev libxss-dev libxtst-dev libwayland-dev \
            wayland-protocols libxkbcommon-dev \
            libgl1-mesa-dev libgl1-mesa-dri mesa-utils

      - name: Configure RLGL
        working-directory: cna
        run: |
          cmake -S . -B build-rlgl -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCNA_GRAPHICS_RENDERER=RLGL \
            -DCNA_BUILD_TESTS=ON \
            -DCNA_BUILD_EXAMPLES=OFF \
            -DCNA_RLGL_COMPILED_EFFECTS=ON \
            -DCNA_ENABLE_VIDEO=OFF \
            -DCNA_ENABLE_NET=OFF \
            -DCNA_ENABLE_DRACO=OFF \
            -DCNA_USE_CCACHE=OFF \
            -DCNA_MAX_VENDORED_BUILD_JOBS=2 \
            -DFETCHCONTENT_SOURCE_DIR_RLGL="${GITHUB_WORKSPACE}/raylib" \
            -DFETCHCONTENT_SOURCE_DIR_FNA3D="${GITHUB_WORKSPACE}/fna3d"

      - name: Build complete RLGL runtime inventory
        working-directory: cna
        run: cmake --build build-rlgl --parallel 2 --target cna_test_rlgl_all

      - name: Run complete offscreen Mesa runtime suite
        working-directory: cna
        env:
          SDL_VIDEODRIVER: offscreen
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: |
          ./build-rlgl/cna_test_rlgl_smoke
          ctest --test-dir build-rlgl --output-on-failure --label-regex '^Rlgl$' --parallel 1

      - name: Verify renderer integration invariants
        working-directory: cna
        run: |
          python3 scripts/check_renderer_identities.py
          python3 scripts/check_renderer_target_discipline.py
          python3 scripts/check_runtime_renderer_discipline.py
          python3 scripts/check_renderer_combinations.py
          python3 scripts/check_renderer_descriptors.py
