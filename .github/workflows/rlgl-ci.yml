# plans/plan_rlgl.md RLGL-008: initial CI coverage is compile-focused. The renderer's runtime
# vertical slice is locally proven with SDL3 offscreen + Mesa llvmpipe, but that exact context path
# has not yet been established on a hosted runner. RLGL-021 owns promotion to a runtime CI gate.
name: RLGL CI

on:
  push:
    branches: [next, develop, main]
    paths:
      - '.github/workflows/rlgl-ci.yml'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'modules/**'
      - 'scripts/check_renderer_identities.py'
  pull_request:
    branches: [next, develop, main]
    paths:
      - '.github/workflows/rlgl-ci.yml'
      - 'CMakeLists.txt'
      - 'cmake/**'
      - 'modules/**'
      - 'scripts/check_renderer_identities.py'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: rlgl-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-build:
    name: GCC (Linux x86_64, compile gate)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CMAKE_GENERATOR: Ninja
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout CNA
        uses: actions/checkout@v4
        with:
          path: cna
          submodules: true

      - name: Checkout pinned sharp-runtime sibling
        uses: actions/checkout@v4
        with:
          repository: openeggbert/sharp-runtime
          ref: f23ded28c7b94a745cf82f8804b5b7104ca5780e
          path: sharp-runtime

      # This duplicates the CMake pin deliberately: configure performs no dependency network
      # access, and a CI result cannot change because upstream moves.
      - name: Checkout pinned raylib source
        uses: actions/checkout@v4
        with:
          repository: raysan5/raylib
          ref: dbc56a87da87d973a9c5baa4e7438a9d20121d28
          path: raylib

      # RLGL-047 uses only the pinned MojoShader submodule and CNA's shared translation target;
      # FNA3D itself remains excluded from the build graph.
      - name: Checkout pinned FNA3D and MojoShader source
        uses: actions/checkout@v4
        with:
          repository: FNA-XNA/FNA3D
          ref: 3240147
          path: fna3d
          submodules: recursive

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build pkg-config \
            libasound2-dev libpulse-dev libudev-dev libdbus-1-dev \
            libx11-dev libxext-dev libxrandr-dev libxi-dev libxcursor-dev \
            libxfixes-dev libxss-dev libxtst-dev libwayland-dev \
            wayland-protocols libxkbcommon-dev libgl1-mesa-dev

      - name: Configure RLGL
        working-directory: cna
        run: |
          cmake -S . -B build-rlgl -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCNA_GRAPHICS_RENDERER=RLGL \
            -DCNA_BUILD_TESTS=OFF \
            -DCNA_BUILD_EXAMPLES=OFF \
            -DCNA_RLGL_COMPILED_EFFECTS=ON \
            -DCNA_ENABLE_VIDEO=OFF \
            -DCNA_ENABLE_NET=OFF \
            -DCNA_ENABLE_DRACO=OFF \
            -DCNA_USE_CCACHE=OFF \
            -DCNA_MAX_VENDORED_BUILD_JOBS=2 \
            -DFETCHCONTENT_SOURCE_DIR_RLGL="${GITHUB_WORKSPACE}/raylib" \
            -DFETCHCONTENT_SOURCE_DIR_FNA3D="${GITHUB_WORKSPACE}/fna3d"

      - name: Build renderer and focused smoke executable
        working-directory: cna
        run: |
          cmake --build build-rlgl --parallel 2 --target \
            cna_renderer_rlgl \
            cna_test_rlgl_smoke \
            cna_test_rlgl_texture \
            cna_test_rlgl_texture_cube \
            cna_test_rlgl_texture_cube_oracle \
            cna_test_rlgl_sampler \
            cna_test_rlgl_state \
            cna_test_rlgl_spritebatch \
            cna_test_rlgl_render_target \
            cna_test_rlgl_render_target_formats \
            cna_test_rlgl_mrt \
            cna_test_rlgl_render_target_cube \
            cna_test_rlgl_rendertargetcube_getdata_contract \
            cna_test_rlgl_rendertargetcube_usage \
            cna_test_rlgl_rendertargetcube_msaa_face \
            cna_test_rlgl_rendertargetcube_plural_binding \
            cna_test_rlgl_render_target_orientation \
            cna_test_rlgl_render_target_full \
            cna_test_rlgl_msaa_first_readback \
            cna_test_rlgl_msaa_mip_readback \
            cna_test_rlgl_buffer \
            cna_test_rlgl_primitive \
            cna_test_rlgl_effect \
            cna_test_rlgl_xna_pixel_center \
            cna_test_rlgl_basiceffect_one_light \
            cna_test_rlgl_basiceffect_multilight_emissive \
            cna_test_rlgl_basiceffect_specular \
            cna_test_rlgl_basiceffect_preferperpixellighting \
            cna_test_rlgl_basiceffect_lit_vertex_color \
            cna_test_rlgl_basiceffect_lit_vertex_color_perpixel \
            cna_test_rlgl_basiceffect_vertex_color_clamp \
            cna_test_rlgl_basiceffect_world_scale_precision \
            cna_test_rlgl_basiceffect_normal_transform \
            cna_test_rlgl_basiceffect_lighting \
            cna_test_rlgl_dual_texture_effect \
            cna_test_rlgl_dual_texture_independent_uv \
            cna_test_rlgl_environment_map \
            cna_test_rlgl_environment_map_terms \
            cna_test_rlgl_environment_map_alpha_scaled_lerp \
            cna_test_rlgl_environment_map_fog \
            cna_test_rlgl_environment_map_amount_clamp \
            cna_test_rlgl_environment_map_sampler_contract \
            cna_test_rlgl_environment_map_sampler_state \
            cna_test_rlgl_environment_map_render_target_cube \
            cna_test_rlgl_environmentmapeffect_golden \
            cna_test_rlgl_environmentmapeffect_amount_zero \
            cna_test_rlgl_environmentmapeffect_amount_one \
            cna_test_rlgl_environmentmapeffect_specular \
            cna_test_rlgl_environmentmapeffect_fresnel \
            cna_test_rlgl_environmentmapeffect_fresnel_gradient \
            cna_test_rlgl_environmentmapeffect_eyeposition \
            cna_test_rlgl_environmentmapeffect_worldtransform \
            cna_test_rlgl_environmentmapeffect_combined \
            cna_test_rlgl_environmentmapeffect_multilight \
            cna_test_rlgl_skinned_effect \
            cna_test_rlgl_skinned_terms \
            cna_test_rlgl_skinnedeffect_identity_bones \
            cna_test_rlgl_skinnedeffect_translation_bone \
            cna_test_rlgl_skinnedeffect_twobone_blend \
            cna_test_rlgl_skinnedeffect_vector4_bone_indices \
            cna_test_rlgl_skinnedeffect_weightspervertex \
            cna_test_rlgl_skinnedeffect_multilight \
            cna_test_rlgl_skinnedeffect_specular \
            cna_test_rlgl_skinnedeffect_vertexcolor \
            cna_test_rlgl_skinnedeffect_preferperpixellighting \
            cna_test_rlgl_skinnedeffect_fog \
            cna_test_rlgl_skinnedeffect_world_normal \
            cna_test_rlgl_skinnedeffect_combined \
            cna_test_rlgl_compiled_effect_runtime \
            cna_test_rlgl_compiled_effect_draw

      - name: Verify renderer registry consistency
        working-directory: cna
        run: python3 scripts/check_renderer_identities.py
