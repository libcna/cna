name: Apple platforms (macOS + iOS)

# plan_apple.md APPLE-9. Four legs, deliberately unequal in what they claim:
#
#   apple-cmake-check — Linux, seconds, no Apple hardware: proves the Apple CMake layer still
#                   parses and that the iOS allow-list accepts/refuses/overrides as documented.
#   macos-build   — native macOS build + the portable test suites that do not need a GPU.
#                   This is a real gate: a green run is evidence that CNA builds and its
#                   platform/storage contracts hold on macOS.
#   ios-device    — cross-compile for arm64 iPhone/iPad. Build-only, and that is the entire
#   ios-simulator   claim: nothing here launches an app, renders a pixel or runs a test. See
#                   docs/apple-platforms.md for the iOS evidence boundary.
#
# The Metal renderer keeps its own dedicated workflow (metal-macos-ci.yml); this one covers the
# platform layer underneath every renderer.

on:
  push:
    paths:
      - '.github/workflows/apple-ci.yml'
      - 'CMakeLists.txt'
      - 'cmake/ApplePlatform.cmake'
      - 'cmake/AppleSmoke.cmake'
      - 'cmake/FixupMacOSBundle.cmake'
      - 'cmake/AppleInfo.*.plist.in'
      - 'cmake/toolchains/ios.cmake'
      - 'cmake/ThirdPartySDL.cmake'
      - 'cmake/RendererSelection.cmake'
      - 'cmake/UnitTests.cmake'
      - 'modules/CMakeLists.txt'
      - 'modules/core/include/CNA/Platform.hpp'
      - 'modules/core/include/CNA/Entrypoint.hpp'
      - 'modules/core/src/DesktopOS.cpp'
      - 'modules/core/tests/CNA/PlatformTests.cpp'
      - 'modules/runtime/src/Game.cpp'
      - 'modules/runtime/src/GameWindow.cpp'
      - 'modules/runtime/tests/Microsoft/Xna/Framework/GameWindowTests.cpp'
      - 'modules/storage/src/StorageDevice.cpp'
      - 'scripts/check-apple-platform-cmake.sh'
      - 'tests/apple/ios_smoke.cpp'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apple-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Runs on Linux in seconds and needs no Apple hardware at all. The Apple platform layer is the
  # one part of the build a non-Apple developer can never reach by configuring the project (every
  # line is behind if(APPLE)), so this is the cheap gate that keeps it from rotting between the
  # far more expensive macOS runs below.
  apple-cmake-check:
    name: Apple CMake layer (host-portable)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout CNA
        uses: actions/checkout@v4

      - name: Smoke-check cmake/ApplePlatform.cmake
        run: ./scripts/check-apple-platform-cmake.sh

  macos-build:
    name: macOS (SDL_RENDERER, portable suites)
    runs-on: macos-14
    timeout-minutes: 90

    steps:
      - name: Checkout CNA
        uses: actions/checkout@v4
        with:
          path: cna
          submodules: true

      - name: Checkout sharp-runtime sibling
        uses: actions/checkout@v4
        with:
          repository: openeggbert/sharp-runtime
          path: sharp-runtime

      - name: Install build dependencies
        run: brew install ccache ffmpeg

      - name: Configure
        working-directory: cna
        run: >
          cmake -S . -B cmake-build-macos
          -DCNA_GRAPHICS_RENDERER=SDL_RENDERER
          -DCNA_BUILD_TESTS=ON
          -DCNA_BUILD_EXAMPLES=OFF
          -DCNA_USE_CCACHE=ON
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DCNA_MAX_VENDORED_BUILD_JOBS=2
          -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      - name: Build test suite
        working-directory: cna
        run: cmake --build cmake-build-macos --target CnaTests --parallel 3

      # The CnaTests binary is run directly rather than through ctest: ctest spawns one process
      # per case, which races the tests that share fixture paths (see CMakePresets.json's "tests"
      # preset description).
      #
      # The video driver is deliberately left alone. A hosted macOS runner has a real window
      # server (the Metal workflow's GPU tests depend on it), and the window-creating cases here
      # skip themselves cleanly if SDL video init ever fails. Forcing SDL_VIDEODRIVER=dummy would
      # be worse than either outcome: the dummy driver accepts window creation but rejects
      # minimize/restore, turning a skip into a failure that says nothing about macOS.
      - name: Run platform and storage suites
        working-directory: cna
        env:
          SDL_AUDIODRIVER: dummy
        run: >
          ./cmake-build-macos/CnaTests
          --gtest_filter='PlatformTest.*:GameWindowTest.*:Storage*:*DesktopOS*'

  ios-build:
    name: iOS ${{ matrix.name }} (build only)
    runs-on: macos-14
    timeout-minutes: 90

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: device
            simulator: 'OFF'
            build_dir: cmake-build-ios
          - name: simulator
            simulator: 'ON'
            build_dir: cmake-build-ios-sim

    steps:
      - name: Checkout CNA
        uses: actions/checkout@v4
        with:
          path: cna
          submodules: true

      - name: Checkout sharp-runtime sibling
        uses: actions/checkout@v4
        with:
          repository: openeggbert/sharp-runtime
          path: sharp-runtime

      - name: Install build dependencies
        run: brew install ccache

      # Tests and examples are off: CnaTests is a console gtest binary that an app-sandboxed iOS
      # process cannot run the way CI would need to, and the examples' fixtures assume a desktop
      # filesystem layout. CNA_BUILD_APPLE_SMOKE_APP remains on by default for iOS: it is a real,
      # minimal UIKit/SDL_main/Game product that final-links the selected renderer.
      - name: Configure
        working-directory: cna
        run: >
          cmake -S . -B ${{ matrix.build_dir }}
          -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/ios.cmake
          -DCNA_IOS_SIMULATOR=${{ matrix.simulator }}
          -DCNA_GRAPHICS_RENDERER=SDL_RENDERER
          -DCNA_BUILD_TESTS=OFF
          -DCNA_BUILD_EXAMPLES=OFF
          -DCNA_BUILD_APPLE_SMOKE_APP=ON
          -DCNA_ENABLE_NET=OFF
          -DCNA_USE_CCACHE=ON
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DCNA_MAX_VENDORED_BUILD_JOBS=2
          -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      # The default target, not `--target CNA`: the CNA umbrella is an INTERFACE library and has
      # no build rule of its own. The default target also links cna_ios_smoke.app, deliberately:
      # archive-only builds cannot expose missing UIKit frameworks or dynamic SDL dependencies.
      - name: Build CNA
        working-directory: cna
        run: cmake --build ${{ matrix.build_dir }} --parallel 3

      # A wrong-platform object file links fine into a static archive and only explodes when an
      # application is linked, which this leg never does. Reading the Mach-O platform back off
      # the archive is what actually catches an accidental macOS build wearing an iOS build
      # directory's name.
      - name: Verify the archive really targets iOS
        working-directory: cna
        run: |
          set -euo pipefail
          archive="$(find ${{ matrix.build_dir }} -name 'libcna_core.a' -print -quit)"
          if [ -z "$archive" ]; then
            echo "libcna_core.a not found under ${{ matrix.build_dir }}" >&2
            exit 1
          fi
          echo "Inspecting $archive"
          platform="$(otool -l "$archive" | grep -m1 -A3 LC_BUILD_VERSION | grep platform || true)"
          echo "$platform"
          case "${{ matrix.simulator }}" in
            ON)  expected='platform 7' ;;   # PLATFORM_IOSSIMULATOR
            OFF) expected='platform 2' ;;   # PLATFORM_IOS
          esac
          echo "$platform" | grep -q "$expected" || {
            echo "expected $expected in the Mach-O build-version load command" >&2
            exit 1
          }

      - name: Verify the final iOS application bundle
        working-directory: cna
        run: |
          set -euo pipefail
          app="$(find ${{ matrix.build_dir }} -type d -name 'cna_ios_smoke.app' -print -quit)"
          if [ -z "$app" ]; then
            echo "cna_ios_smoke.app not found under ${{ matrix.build_dir }}" >&2
            exit 1
          fi
          executable="$app/cna_ios_smoke"
          test -x "$executable"
          plutil -lint "$app/Info.plist"

          platform="$(otool -l "$executable" | grep -m1 -A3 LC_BUILD_VERSION | grep platform || true)"
          case "${{ matrix.simulator }}" in
            ON)  expected='platform 7' ;;   # PLATFORM_IOSSIMULATOR
            OFF) expected='platform 2' ;;   # PLATFORM_IOS
          esac
          echo "$platform" | grep -q "$expected"

          symbols="$(nm "$executable")"
          echo "$symbols" | grep -Eq ' [Tt] _main$'
          echo "$symbols" | grep -Eq ' [Tt] _SDL_main$'

          dependencies="$(otool -L "$executable")"
          echo "$dependencies"
          if echo "$dependencies" | grep -Eq '(\.sdl-prebuilt|/opt/homebrew|/usr/local|libSDL3(_image|_mixer)?[^/]*)'; then
            echo "iOS smoke app contains a non-system dynamic SDL/build-machine dependency" >&2
            exit 1
          fi

      - name: Launch the smoke application in the iOS simulator
        if: matrix.simulator == 'ON'
        working-directory: cna
        run: |
          set -euo pipefail
          app="$(find ${{ matrix.build_dir }} -type d -name 'cna_ios_smoke.app' -print -quit)"
          udid="$(xcrun simctl list devices available -j | python3 -c 'import json, sys; data=json.load(sys.stdin); print(next(device["udid"] for runtime, devices in data["devices"].items() if ".iOS-" in runtime for device in devices if device["name"].startswith("iPhone") and device["isAvailable"]))')"
          trap 'xcrun simctl shutdown "$udid" >/dev/null 2>&1 || true' EXIT
          xcrun simctl boot "$udid" >/dev/null 2>&1 || true
          xcrun simctl bootstatus "$udid" -b
          codesign --force --deep --sign - "$app"
          xcrun simctl install "$udid" "$app"
          xcrun simctl spawn "$udid" launchctl setenv SDL_AUDIODRIVER dummy
          output="$(xcrun simctl launch --console "$udid" com.openeggbert.cna.cna-ios-smoke 2>&1)"
          echo "$output"
          echo "$output" | grep -q 'CNA_IOS_SMOKE_OK'
