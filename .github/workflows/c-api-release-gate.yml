# C API task CBIND-042B: the experimental release gate.
#
# A release gate written as prose is a list of things somebody once believed. This one is a
# declaration plus a measurement, and the job fails when they disagree in either direction:
#
#   * a criterion recorded as met that no longer is -- the ordinary regression;
#   * a criterion recorded as blocked that has quietly become met -- the failure mode a release gate
#     actually dies of, because nobody re-reads a document that says "not yet".
#
# The gate currently reports NOT READY, and correctly so: runtime-scope declarations remain planned.
# That is the gate working. This job therefore passes while the declared criterion and the
# measurement agree, and fails the moment the record, generated evidence or landing-page summary
# stops matching.

name: C API release gate

on:
  push:
    branches: [next, develop, main]
    paths:
      - 'tools/c-api/**'
      - 'docs/c-api/**'
      - 'modules/c-api/CMakeLists.txt'
      - 'modules/c-api/examples/**'
      - '.github/workflows/c-api-release-gate.yml'
  pull_request:
    branches: [next, develop, main]
    paths:
      - 'tools/c-api/**'
      - 'docs/c-api/**'
      - 'modules/c-api/CMakeLists.txt'
      - 'modules/c-api/examples/**'
      - '.github/workflows/c-api-release-gate.yml'
  workflow_dispatch:

concurrency:
  group: c-api-release-gate-${{ github.ref }}
  cancel-in-progress: true

# Read-only: no job here writes to the repository, its releases or its packages.
permissions:
  contents: read

jobs:
  release-gate:
    # Advisory since 2026-11-09 (owner decision): a failure here is reported but does not fail the
    # workflow. Regenerate the C API inventories with the --write commands in docs/c-api/README.md.
    continue-on-error: true
    name: May the experimental C ABI be published?
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Clone sharp-runtime parser dependency
        run: |
          bash "${GITHUB_WORKSPACE}/scripts/ci/clone_siblings.sh" "${{ github.head_ref }} ${{ github.base_ref }} ${{ github.ref_name }}" sharp-runtime

      - name: Install Doxygen inventory dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends doxygen

      - name: Check the record against the measurement
        run: python3 tools/c-api/check_release_gate.py --check

      - name: Print the verdict
        run: python3 tools/c-api/check_release_gate.py --run

      # A stale declaration must not overrule the measurement. Mark the open coverage criterion as
      # met in only the declaration and require the gate to reject the disagreement.
      - name: Prove the gate rejects a decision recorded in only one place
        run: |
          set -euo pipefail
          cp tools/c-api/release_gate.json /tmp/release_gate.json.orig
          python3 - <<'PY'
          import json
          from pathlib import Path
          path = Path("tools/c-api/release_gate.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          for criterion in data["criteria"]:
              if criterion["id"] == "coverage-closed":
                  criterion["recorded"] = "met"
                  break
          else:
              raise SystemExit("the coverage decision this check perturbs is no longer recorded")
          path.write_text(json.dumps(data, indent=2, ensure_ascii=False) + "\n", encoding="utf-8")
          PY
          status=0
          python3 tools/c-api/check_release_gate.py --check || status=$?
          cp /tmp/release_gate.json.orig tools/c-api/release_gate.json
          if [ "$status" -eq 0 ]; then
            echo "::error::the release gate accepted a decision recorded in only one place" >&2
            exit 1
          fi
          echo "the gate rejected the one-sided decision, as it must"

      - name: Confirm the tree was restored
        run: git diff --exit-code -- tools/c-api/release_gate.json

      - name: Prove the gate rejects a stale landing-page snapshot
        run: |
          set -euo pipefail
          cp docs/c-api/README.md /tmp/c-api-readme.md.orig
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path("docs/c-api/README.md")
          text = path.read_text(encoding="utf-8")
          matches = list(re.finditer(r"\*\*([0-9,]+) planned\*\*", text))
          if len(matches) != 1:
              raise SystemExit("the README planned-count sentence this check perturbs has moved")
          match = matches[0]
          count = int(match.group(1).replace(",", ""))
          stale = f"**{count - 1:,} planned**"
          path.write_text(text[:match.start()] + stale + text[match.end():], encoding="utf-8")
          PY
          status=0
          python3 tools/c-api/check_release_gate.py --check || status=$?
          cp /tmp/c-api-readme.md.orig docs/c-api/README.md
          if [ "$status" -eq 0 ]; then
            echo "::error::the release gate accepted a stale README coverage count" >&2
            exit 1
          fi
          echo "the gate rejected the stale landing-page snapshot, as it must"

      - name: Confirm the landing page was restored
        run: git diff --exit-code -- docs/c-api/README.md

      - name: Verify regeneration is deterministic
        run: |
          set -euo pipefail
          python3 tools/c-api/check_release_gate.py --write
          if ! git diff --quiet -- docs/c-api/RELEASE_GATE.md; then
            echo "::error::--write changed RELEASE_GATE.md even though --check passed" >&2
            git --no-pager diff --stat -- docs/c-api/RELEASE_GATE.md
            exit 1
          fi
          echo "regeneration is a no-op, as it must be"
