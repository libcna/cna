# INPUT-CI-001 / INPUT-CI-002 / INPUT-CI-005 — CI for the Input track.
#
# Matrix of build configurations, each running the (backend-agnostic) input test suite headless:
#   - EasyGL / SDL_RENDERER / Vulkan / bgfx : the four graphics backends.
#   - ASan+UBSan (on EasyGL)                : built with -DCNA_SANITIZE=address,undefined; any UB /
#                                             memory error fails the job (halt_on_error=1).
# All sibling repos (sharp-runtime, easy-gl, meta-gl) are public and clone over HTTPS with no token.
# third_party/enet is committed here; SDL/SDL_image/SDL_mixer/googletest are submodules; bgfx is
# FetchContent'd at configure time. The prebuilt SDL is cached (built uninstrumented, shared by all).
#
# NOTE: the `Publish diagnostics on failure` step + contents:write are TEMPORARY (Actions logs are
# auth-gated); remove them once every backend is confirmed green.
name: input-ci

on:
  push:
    branches: [feature/input, develop, master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    branches: [develop, master]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

concurrency:
  group: input-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  input-tests:
    name: ${{ matrix.name }} (Linux)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: EasyGL
            backend: EASYGL
            slug: easygl
            sanitize: ""
            asan_options: ""
            ubsan_options: ""
          - name: ASan+UBSan
            backend: EASYGL
            slug: asan
            sanitize: "address,undefined"
            asan_options: "detect_leaks=0:halt_on_error=1"
            ubsan_options: "print_stacktrace=1:halt_on_error=1"
          - name: SDL_RENDERER
            backend: SDL_RENDERER
            slug: sdlrenderer
            sanitize: ""
            asan_options: ""
            ubsan_options: ""
          - name: Vulkan
            backend: VULKAN
            slug: vulkan
            sanitize: ""
            asan_options: ""
            ubsan_options: ""
          - name: bgfx
            backend: BGFX
            slug: bgfx
            sanitize: ""
            asan_options: ""
            ubsan_options: ""
    env:
      CC: gcc-14
      CXX: g++-14
    steps:
      - name: Checkout cna (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Clone sibling repos (public, no token needed)
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}/.."
          for repo in sharp-runtime easy-gl meta-gl; do
            git clone --depth 1 --branch develop \
              "https://github.com/openeggbert/${repo}.git" "${repo}"
          done

      - name: Install system dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++-14 cmake ninja-build pkg-config xvfb \
            libavcodec-dev libavformat-dev libavutil-dev libswresample-dev \
            libvulkan-dev \
            libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev \
            libx11-dev libxext-dev libxrandr-dev libxi-dev libxcursor-dev libxfixes-dev libxss-dev libxtst-dev \
            libwayland-dev wayland-protocols libxkbcommon-dev \
            libasound2-dev libpulse-dev libudev-dev libdbus-1-dev

      - name: Record SDL submodule commit (for the cache key)
        id: sdlsha
        run: echo "sha=$(git -C third_party/SDL rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache prebuilt SDL (built once from the submodule, reused across runs)
        uses: actions/cache@v4
        with:
          path: .sdl-prebuilt-Linux-x86_64
          key: sdl-${{ runner.os }}-${{ steps.sdlsha.outputs.sha }}

      - name: Configure
        run: |
          set -o pipefail
          cmake -S . -B build -G Ninja \
            -DCNA_GRAPHICS_BACKEND=${{ matrix.backend }} \
            -DCNA_BUILD_TESTS=ON \
            -DCNA_SANITIZE=${{ matrix.sanitize }} 2>&1 | tee /tmp/configure.log

      - name: Build CnaTests
        run: cmake --build build --target CnaTests 2>&1 | tee /tmp/build.log

      # A virtual X server (Xvfb) provides real windows/cursors headlessly (the SDL "dummy" driver has
      # null cursors, which fails the MouseCursor tests). For the ASan+UBSan entry, halt_on_error=1 turns
      # any UB / memory error into a job failure.
      - name: Run input tests (canonical filter, headless via Xvfb, shuffled)
        env:
          SDL_VIDEODRIVER: x11
          SDL_AUDIODRIVER: dummy
          ASAN_OPTIONS: ${{ matrix.asan_options }}
          UBSAN_OPTIONS: ${{ matrix.ubsan_options }}
        run: |
          xvfb-run -a ./build/CnaTests \
            --gtest_filter='*Keyboard*:*Mouse*:*GamePad*:*Touch*:*Gesture*:*TextInput*:*SdlInputBridge*:*InputResetAllForTests*:*FakeGamepad*:*SdlGamepadSubsystemInit*:*ButtonState*:*KeyState*:*Buttons*:*PublicApiInput*' \
            --gtest_shuffle --gtest_repeat=3

      # TEMPORARY diagnostic (remove once all backends are green): publish configure/build/CMake logs to a
      # per-entry ci-diag-<slug> branch (fetchable over SSH), since Actions logs are auth-gated.
      - name: Publish diagnostics on failure
        if: failure()
        run: |
          mkdir -p ci-diag
          cp /tmp/configure.log ci-diag/ 2>/dev/null || true
          cp /tmp/build.log ci-diag/ 2>/dev/null || true
          cp build/CMakeCache.txt ci-diag/ 2>/dev/null || true
          find build -name 'CMakeError.log' -exec cp {} ci-diag/ \; 2>/dev/null || true
          git config user.name ci-bot
          git config user.email ci-bot@openeggbert.local
          git checkout -b "ci-diag-${{ matrix.slug }}"
          git add -f ci-diag
          git commit -q -m "ci-diag ${{ matrix.slug }} [skip ci]"
          git push -f origin "ci-diag-${{ matrix.slug }}"
