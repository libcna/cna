# REMED-BUILD-004: the general/default CnaTests suite has never once run in any CI workflow this
# project has had. d3d-windows-ci.yml / devices-tests.yml / input-ci.yml each select a label or
# --gtest_filter scoped to their own subsystem (DIRECTX11, the Devices/Sensors suite, the
# `input` label) -- none of them ever runs `ctest` unfiltered. Combined with REMED-BUILD-001 (fixed:
# gtest_discover_tests(CnaTests) previously had no WORKING_DIRECTORY, so ~220 of these tests failed
# under ctest even when it WAS invoked), this meant ~220 tests covering Media, audio-tag parsing, the
# XNB content pipeline, ENet networking, and Lzx decompression -- including both of this project's
# adversarial-input fuzz harnesses, XnbContainerFuzzTest and LzxDecoderFuzzTest -- had likely never
# once passed in CI at all.
#
# This job runs the FULL, unfiltered default suite (no -L, no --gtest_filter) on OPENGLES3, the
# current public identity for the EasyGL family on Linux. Per REMED-BUILD-004's own
# "decide explicitly which renderers CI runs the general suite on" requirement: this family only, for now
# -- deliberately narrower than "all 14 renderers", which remains future work (each other renderer
# already has its own narrower, renderer-specific CI path or none at all).
#
# There is no known-failure allowlist: the last entry, EasyGL_GraphicsDevice_ReferenceStencil, was
# fixed by REMED-GFX-236 and re-verified passing on 2026-10-10. Any failing test fails the job; the
# current known defects are listed in NEXT.md section 5.
name: general-tests-ci

on:
  push:
    branches: [next, develop, main]
    paths:
      - '**'
      - '!**.md'
      - '!docs/**'
      - 'docs/c-api/COVERAGE.md'
  pull_request:
    branches: [next, develop, main]
    paths:
      - '**'
      - '!**.md'
      - '!docs/**'
      - 'docs/c-api/COVERAGE.md'
  workflow_dispatch:

concurrency:
  group: general-tests-ci-${{ github.ref }}
  cancel-in-progress: true

# Read-only: no job here writes to the repository, its releases or its packages.
permissions:
  contents: read

jobs:
  general-tests:
    name: CnaTests (unfiltered, OPENGLES3 / EasyGL family)
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CC: gcc-14
      CXX: g++-14
    steps:
      - name: Checkout cna (with submodules)
        uses: actions/checkout@v4
        with:
          # Top level only: CNA disables every codec behind SDL_image's/SDL_mixer's nested
          # external/* submodules (cmake/ThirdPartySDL.cmake), and fetching them recursively
          # failed a run on a third-party host's HTTP 503 (plans/plan_apple_m4.md AM4-310).
          submodules: true

      - name: Check build-performance policy
        run: python3 tools/build/check_build_performance_policy.py

      - name: Clone sibling repos (public, no token needed)
        run: |
          set -euo pipefail
          cd "${GITHUB_WORKSPACE}/.."
          bash "${GITHUB_WORKSPACE}/scripts/ci/clone_siblings.sh" "${{ github.head_ref }} ${{ github.base_ref }} ${{ github.ref_name }}" sharp-runtime easy-gl meta-gl

      - name: Install system dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev nlohmann-json3-dev \
            libfreetype-dev python3-pil \
            gcc-14 g++-14 cmake ninja-build ccache time pkg-config doxygen xvfb x11-utils \
            libavcodec-dev libavformat-dev libavutil-dev libswresample-dev \
            libvulkan-dev \
            libgl1-mesa-dev libegl1-mesa-dev libgles2-mesa-dev \
            libx11-dev libxext-dev libxrandr-dev libxi-dev libxcursor-dev libxfixes-dev libxss-dev libxtst-dev \
            libwayland-dev wayland-protocols libxkbcommon-dev \
            libasound2-dev libpulse-dev libudev-dev libdbus-1-dev
          # libfreetype-dev: CnaXnbDependencyBoundary records FreeType as build-time-only and fails
          # rather than pass vacuously when the font pipeline (AUTO) finds none. python3-pil:
          # scripts/xna-diff.py, which the EasyGL reference-image checks run (AM4-272).
          # CApiHeaderCompatibility probes the named gcc/g++ rows as well as $CC/$CXX.
          # Ubuntu 24.04's unversioned GCC 13 rejects the final -std=c23 spelling.
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 100
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-14 100

      - name: Record SDL submodule commit (for the cache key)
        id: sdlsha
        run: echo "sha=$(git -C third_party/SDL rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Cache prebuilt SDL (built once from the submodule, reused across runs)
        uses: actions/cache@v4
        with:
          path: .sdl-prebuilt-Linux-x86_64
          key: sdl-${{ runner.os }}-${{ steps.sdlsha.outputs.sha }}

      # CNA_TEST_DISPLAY is baked into each display-creating test's ENVIRONMENT property at CMake
      # CONFIGURE time (cmake/TestDisplayPolicy.cmake; empty by default), so it cannot
      # be supplied by wrapping the test-run step in `xvfb-run` the way input-ci.yml does for its
      # narrower `-L input` selection -- that selection happens not to include any test that bakes
      # CNA_TEST_DISPLAY. The unfiltered general suite does include several (EasyGL/SdlGpu
      # real-window tests), so this job instead starts a real Xvfb server on a FIXED, known display
      # first, and passes that same display to `-DCNA_TEST_DISPLAY=` at configure time, so both the
      # baked-in test environment and every other test's inherited $DISPLAY agree.
      - name: Start persistent Xvfb on :99
        run: |
          set -euo pipefail
          Xvfb :99 -screen 0 1920x1080x24 &
          disown
          for i in $(seq 1 40); do
            if xdpyinfo -display :99 >/dev/null 2>&1; then
              echo "Xvfb ready on :99"
              echo "DISPLAY=:99" >> "$GITHUB_ENV"
              exit 0
            fi
            sleep 0.5
          done
          echo "Xvfb did not become ready on :99" >&2
          exit 1

      - name: Configure (OPENGLES3, tests + examples on, general default suite)
        run: |
          /usr/bin/time -f '%e %M' -o "${RUNNER_TEMP}/cna-configure.time" \
            cmake -S . -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DCNA_GRAPHICS_RENDERER=OPENGLES3 \
            -DCNA_BUILD_TESTS=ON \
            -DCNA_BUILD_EXAMPLES=ON \
            -DCNA_TEST_DISPLAY=:99
          ccache --zero-stats

      # Unlike the other 3 workflows (which build only the CnaTests target, since their own label/
      # filter selections don't reach any of the ~247 separately-registered renderer smoke-test
      # executables), the unfiltered general suite does exercise those executables directly
      # (add_test(COMMAND <exe>) against targets that are part of the default `all` target) -- so
      # this job needs a full default build, not just CnaTests.
      - name: Build (all CTest-registered targets)
        run: |
          set -o pipefail
          /usr/bin/time -f '%e %M' -o "${RUNNER_TEMP}/cna-build.time" \
            cmake --build build --parallel 4 2>&1 | tee "${RUNNER_TEMP}/cna-build.log"

      - name: Publish build-performance trend report
        run: |
          python3 tools/build/report_build_performance.py \
            --build-dir build \
            --target all \
            --artifact CnaTests \
            --configure-timing "${RUNNER_TEMP}/cna-configure.time" \
            --build-timing "${RUNNER_TEMP}/cna-build.time" \
            --build-log "${RUNNER_TEMP}/cna-build.log" \
            --output build/build-performance-report.json

      - name: Upload build-performance trend report
        uses: actions/upload-artifact@v4
        with:
          name: build-performance-${{ github.run_id }}
          path: build/build-performance-report.json
          retention-days: 30

      - name: Run full unfiltered CnaTests suite (ctest, no -L / --gtest_filter)
        id: run_ctest
        continue-on-error: true
        working-directory: build
        env:
          SDL_VIDEODRIVER: x11
          SDL_AUDIODRIVER: dummy
        run: ctest --output-on-failure

      # Building and testing may write only to ignored locations (build/, the SDL prebuilt cache).
      # A test that rewrites a committed fixture, report or generated file fails the job here.
      - name: Check that build and tests left the checkout clean
        run: scripts/check_clean_checkout.sh

      # ctest runs with continue-on-error so the checkout check above always runs; this step then
      # turns any test failure into a failed job.
      - name: Fail the job if any test failed
        if: steps.run_ctest.outcome == 'failure'
        run: |
          echo "ctest reported failures; see the 'Run full unfiltered CnaTests suite' step." >&2
          exit 1
