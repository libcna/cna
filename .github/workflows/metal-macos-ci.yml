name: Native Metal renderer (macOS)

on:
  push:
    branches: [next, develop, main]
    paths:
      - '.github/workflows/metal-macos-ci.yml'
      - 'CMakeLists.txt'
      - 'cmake/BackendLibraries.cmake'
      - 'cmake/RendererSelection.cmake'
      - 'modules/CMakeLists.txt'
      - 'cmake/Examples.cmake'
      - 'cmake/Tests/MetalTests.cmake'
      - 'modules/renderers/metal/examples/metal_capabilities_test.cpp'
      - 'modules/renderers/metal/examples/metal_smoke_test.cpp'
      - 'modules/graphics/include/CNA/GraphicsCapability.hpp'
      - 'modules/core/include/CNA/GraphicsRendererType.hpp'
      - 'modules/graphics/include/CNA/Internal/Renderers/Common/IGraphicsRenderer.hpp'
      - 'modules/renderers/metal/include/CNA/Internal/Renderers/Metal/**'
      - 'modules/graphics/include/Microsoft/Xna/Framework/Graphics/GraphicsDevice.hpp'
      - 'modules/renderers/metal/src/**'
      - 'modules/graphics/src/Xna/GraphicsDevice.cpp'
      - 'modules/renderers/metal/tests/CNA/Internal/Renderers/Metal/**'
      - 'modules/graphics/tests/Microsoft/Xna/Framework/GraphicsRendererCompileDefinitionTests.cpp'
  pull_request:
    branches: [next, develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: metal-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  metal-build:
    # macos-26 (Xcode 26): macos-14's default Xcode 15.4 has no std::jthread/std::stop_token in its
    # libc++, which gamer services use, so the build stopped there (plans/plan_apple_m4.md AM4-255).
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout CNA
        uses: actions/checkout@v4
        with:
          path: cna
          submodules: true

      - name: Choose the sharp-runtime branch
        id: sharp_runtime_branch
        # The branch CNA's own clone_siblings.sh would use, not a pinned commit: the pins here
        # predated components CNA requests (plans/plan_apple_m4.md AM4-234).
        run: echo "ref=$(bash cna/scripts/ci/sibling_branch.sh "${{ github.head_ref }} ${{ github.base_ref }} ${{ github.ref_name }}" sharp-runtime)" >> "$GITHUB_OUTPUT"

      - name: Checkout sharp-runtime sibling
        uses: actions/checkout@v4
        with:
          repository: libcna/sharp-runtime
          ref: ${{ steps.sharp_runtime_branch.outputs.ref }}
          path: sharp-runtime

      - name: Install build dependencies
        # nlohmann-json: gamer services parse their JSON with it (cmake/HeaderOnlyJson.cmake), and
        # the hosted image does not ship it, so configure stopped there (plans/plan_apple_m4.md
        # AM4-247).
        run: brew install ccache ffmpeg nlohmann-json

      - name: Configure native Metal renderer
        working-directory: cna
        run: >
          cmake -S . -B cmake-build-metal
          -DCNA_GRAPHICS_RENDERER=METAL
          -DCNA_BUILD_TESTS=ON
          -DCNA_ENABLE_DRACO=OFF
          -DCNA_USE_CCACHE=ON
          -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DCNA_MAX_VENDORED_BUILD_JOBS=2
          -DCMAKE_POLICY_VERSION_MINIMUM=3.5

      - name: Build native Metal renderer
        working-directory: cna
        run: cmake --build cmake-build-metal --parallel 3

      # API validation always. GPU shader validation wherever the device supports it: on the hosted
      # runner's "Apple Paravirtual device" it reports "Texture usage flags mismatch" for any sampled
      # ShaderRead texture and the sample reads zero -- measured with a 30-line Metal program and no
      # CNA code, which passes without it and on Apple hardware with it (CNA
      # plans/plan_apple_m4.md AM4-279). Under it on that device every textured or lit draw is black.
      - name: Choose the Metal validation layers for this device
        # The device is asked through Metal itself: system_profiler reports no display there.
        run: |
          cat > "${RUNNER_TEMP}/metal_device_name.m" <<'EOF'
          #import <Metal/Metal.h>
          #include <stdio.h>
          int main(void) { @autoreleasepool { id<MTLDevice> d = MTLCreateSystemDefaultDevice();
              printf("%s\n", d ? d.name.UTF8String : "none"); } return 0; }
          EOF
          clang -fobjc-arc -framework Metal -framework Foundation \
            "${RUNNER_TEMP}/metal_device_name.m" -o "${RUNNER_TEMP}/metal_device_name"
          device=$("${RUNNER_TEMP}/metal_device_name")
          echo "Metal device: ${device}"
          if [ "${device}" = "Apple Paravirtual device" ]; then
            echo "API validation only on this device (AM4-279)"
            echo "MTL_SHADER_VALIDATION=0" >> "$GITHUB_ENV"
          else
            echo "MTL_SHADER_VALIDATION=1" >> "$GITHUB_ENV"
          fi

      - name: Run supported Metal contract tests
        working-directory: cna
        env:
          MTL_DEBUG_LAYER: '1'
        run: >
          ctest --test-dir cmake-build-metal
          -R '^Metal'
          --output-on-failure
          --parallel 3

      - name: Run renderer compile-definition control
        working-directory: cna
        run: >
          ctest --test-dir cmake-build-metal
          -R '^GraphicsRendererCompileDefinitionsTest\.'
          --output-on-failure
          --parallel 3
